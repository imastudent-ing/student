            }
          }
        }
      }

      // ---- 高架の桁(路面の厚み)と橋脚 ----
      if (!s.tunnel && near) {
        const L1b = p3(r.x1 - ROAD_HW * bc, s.p1y + ROAD_HW * bs - DECK_H, r.z1);
        const L2b = p3(r.x2 - ROAD_HW * bc, s.p2y + ROAD_HW * bs - DECK_H, r.z2);
        const R1b = p3(r.x1 + ROAD_HW * bc, s.p1y - ROAD_HW * bs - DECK_H, r.z1);
        const R2b = p3(r.x2 + ROAD_HW * bc, s.p2y - ROAD_HW * bs - DECK_H, r.z2);
        quad(L1, L1b, L2b, L2, shade(24, 27, 38, fog));
        quad(R1, R1b, R2b, R2, shade(18, 21, 30, fog));
        // 橋脚(30mおき)
        if (r.i % 6 === 0 && r.n > 3) {
          const py = s.p1y - DECK_H;
          const pw = 1.6 * M2U, pd = 14 * M2U;
          const a = p3(r.x1 - pw, py, r.z1), b = p3(r.x1 + pw, py, r.z1);
          const c2 = p3(r.x1 + pw, py - pd, r.z1), d2 = p3(r.x1 - pw, py - pd, r.z1);
          quad(a, b, c2, d2, shade(20, 23, 34, fog));
        }
      }

      // ---- 路面 ----
      // 舗装の明暗差は控えめに(手前のセグメントは画面を大きく覆うため縞が目立つ)
      const base = dark ? [31, 34, 44] : [34, 38, 49];
      quad(L1, R1, R2, L2, shade(base[0], base[1], base[2], fog, s.tunnel ? 0.72 : 1));
      // 轍(車線内のタイヤ痕)。路面に走行の痕跡があると質感が出る
      if (near && r.n < 55 && !s.finish) {
        const wearCol = shade(base[0] - 5, base[1] - 5, base[2] - 6, fog, s.tunnel ? 0.72 : 1);
        for (let l = 0; l < LANES; l++) {
          const tc = (l + 0.5) / LANES;
          for (const o of [-0.052, 0.052]) {
            quad(lerpP(L1, R1, tc + o - 0.016), lerpP(L1, R1, tc + o + 0.016),
                 lerpP(L2, R2, tc + o + 0.016), lerpP(L2, R2, tc + o - 0.016), wearCol);
          }
        }
      }

      // ---- 白線 ----
      const edge = 0.045;
      const eL1 = lerpP(L1, R1, edge), eL2 = lerpP(L2, R2, edge);
      const eR1 = lerpP(R1, L1, edge), eR2 = lerpP(R2, L2, edge);
      quad(L1, eL1, eL2, L2, shade(dark ? 226 : 150, dark ? 230 : 156, dark ? 244 : 176, fog));
      quad(eR1, R1, R2, eR2, shade(dark ? 226 : 150, dark ? 230 : 156, dark ? 244 : 176, fog));
      if (dark && near) {
        for (let l = 1; l < LANES; l++) {
          const t = l / LANES;
          const a1 = lerpP(L1, R1, t - 0.008), b1 = lerpP(L1, R1, t + 0.008);
          const a2 = lerpP(L2, R2, t - 0.008), b2 = lerpP(L2, R2, t + 0.008);
          quad(a1, b1, b2, a2, shade(150, 158, 186, fog));
        }
      }
      // ---- 路面のデリニエータ(奥行きの手がかり) ----
      if (r.i % 2 === 0 && near && !s.finish) {
        for (let l = 1; l < LANES; l++) {
          dot(lerpP(L1, R1, l / LANES), 0.11 * M2U, '#ffd98a', (1 - fog) * 0.85, 4);
        }
      }
      // ---- チェックポイント/フィニッシュ路面 ----
      if (s.finish) {
        for (let c3 = 0; c3 < 10; c3++) {
          const t0 = c3 / 10, t1 = (c3 + 1) / 10;
          quad(lerpP(L1, R1, t0), lerpP(L1, R1, t1), lerpP(L2, R2, t1), lerpP(L2, R2, t0),
               c3 % 2 ? shade(232, 236, 246, fog) : shade(16, 18, 24, fog));
        }
      } else if (s.checkpoint) {
        quad(L1, R1, R2, L2, 'rgba(61,232,255,' + (0.45 * (1 - fog)) + ')');
      }

      // ---- 壁・ガードレール ----
      const wallH = 1.05 * M2U;
      const gL1 = p3(r.x1 - ROAD_HW * bc, s.p1y + ROAD_HW * bs + wallH, r.z1);
      const gL2 = p3(r.x2 - ROAD_HW * bc, s.p2y + ROAD_HW * bs + wallH, r.z2);
      const gR1 = p3(r.x1 + ROAD_HW * bc, s.p1y - ROAD_HW * bs + wallH, r.z1);
      const gR2 = p3(r.x2 + ROAD_HW * bc, s.p2y - ROAD_HW * bs + wallH, r.z2);
      quad(L1, gL1, gL2, L2, shade(44, 51, 76, fog));
      quad(R1, gR1, gR2, R2, shade(38, 44, 68, fog));
      if (near) {
        // レール上端の反射帯
        const tL1 = lerpP(gL1, L1, 0.18), tL2 = lerpP(gL2, L2, 0.18);
        const tR1 = lerpP(gR1, R1, 0.18), tR2 = lerpP(gR2, R2, 0.18);
        quad(gL1, tL1, tL2, gL2, shade(96, 110, 152, fog));
        quad(gR1, tR1, tR2, gR2, shade(96, 110, 152, fog));
      }

      if (s.tunnel) {
        // ---- トンネル(3Dボックス) ----
        // 照明の間隔に合わせて壁の明るさを揺らすと、光の帯が流れて見える
        const wl = Math.floor(r.i / 4) % 2 ? 7 : 0;
        const ch = 6.2 * M2U;
        const cL1 = p3(r.x1 - ROAD_HW * 1.06, s.p1y + ch, r.z1);
        const cL2 = p3(r.x2 - ROAD_HW * 1.06, s.p2y + ch, r.z2);
        const cR1 = p3(r.x1 + ROAD_HW * 1.06, s.p1y + ch, r.z1);
        const cR2 = p3(r.x2 + ROAD_HW * 1.06, s.p2y + ch, r.z2);
        quad(gL1, cL1, cL2, gL2, shade(30 + wl, 34 + wl, 48 + wl, fog));
        quad(gR1, cR1, cR2, gR2, shade(24 + wl, 28 + wl, 40 + wl, fog));
        quad(cL1, cR1, cR2, cL2, shade(14, 16, 24, fog));
        if (r.i % 4 === 0 && r.n > 2) {
          const lz = r.z1;
          const a = p3(r.x1 - 1.0 * M2U, s.p1y + ch * 0.97, lz);
          const b = p3(r.x1 + 1.0 * M2U, s.p1y + ch * 0.97, lz);
          const c3 = p3(r.x1 + 1.0 * M2U, s.p1y + ch * 0.97, lz + SEG_LEN * 0.35);
          const d3 = p3(r.x1 - 1.0 * M2U, s.p1y + ch * 0.97, lz + SEG_LEN * 0.35);
          ctx.globalAlpha = 1 - fog;
          quad(a, b, c3, d3, theme.tunnelLight);
          ctx.globalAlpha = 1;
          const tbase = p3(r.x1, s.p1y, lz);
          if (a && tbase) fxL.push({ x: (a.x + b.x) / 2, y0: tbase.y, sc: a.sc, col: theme.tunnelLight, a: (1 - fog) * 0.8 });
        }
      } else if ((s.checkpoint || s.finish) && r.n > 1) {
        drawGate(r, s, fog);
      }
      // 工事規制のパイロンと道路標識
      if (s.cone) drawCones(r, s, fog);
      if (signAt[r.i] && !s.tunnel && r.n > 2) drawSign(r, s, signAt[r.i], fog);
    }

    // ---- 濡れた路面の反射と光だまり ----
    for (const f of fxL) {
      const len = Math.min(H * 0.22, f.sc * 12 * M2U * PROJ_K);
      const wdt = Math.max(1.5, Math.min(14, f.sc * 0.5 * M2U * PROJ_K));
      if (len < 3) continue;
      const g1 = ctx.createLinearGradient(0, f.y0, 0, f.y0 + len);
      g1.addColorStop(0, colA(f.col, 0.12 * f.a));
      g1.addColorStop(1, colA(f.col, 0));
      ctx.fillStyle = g1;
      ctx.fillRect(f.x - wdt / 2, f.y0, wdt, len);
      const pr = Math.max(4, Math.min(70, f.sc * 5 * M2U * PROJ_K));
      const g2 = ctx.createRadialGradient(f.x, f.y0, 0, f.x, f.y0, pr);
      g2.addColorStop(0, colA(f.col, 0.10 * f.a));
      g2.addColorStop(1, colA(f.col, 0));
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.ellipse(f.x, f.y0, pr, pr * 0.30, 0, 0, Math.PI * 2); ctx.fill();
    }

    // ---- ヘッドライトの路面照射 ----
    if (car && raceState !== 'idle') {
      const hb = findSegment(posZ);
      const hp2 = (posZ % SEG_LEN) / SEG_LEN;
      const hy = hb.p1y + (hb.p2y - hb.p1y) * hp2;
      const cxr = carRoadX + posX * M2U;
      const P = (d, o) => p3(cxr + (o + Math.sin(heading) * d) * M2U, hy, posZ + d * M2U);
      const n1 = P(6, -1.0), n2 = P(6, 1.0), f1 = P(42, -3.6), f2 = P(42, 3.6);
      if (n1 && n2 && f1 && f2) {
        const gc = ctx.createLinearGradient(0, n1.y, 0, f1.y);
        gc.addColorStop(0, 'rgba(190,215,255,0.055)');
        gc.addColorStop(1, 'rgba(190,215,255,0)');
        ctx.fillStyle = gc;
        ctx.beginPath();
        ctx.moveTo(n1.x, n1.y); ctx.lineTo(n2.x, n2.y); ctx.lineTo(f2.x, f2.y); ctx.lineTo(f1.x, f1.y);
        ctx.closePath(); ctx.fill();
      }
    }

    // ---- 夜霧(距離感) ----
    const fy0 = horizonY - H * 0.10, fy1 = horizonY + H * 0.16;
    const fogGrad = ctx.createLinearGradient(0, fy0, 0, fy1); // 霧は地平線帯に重ねる
    const fogCol = baseSeg.tunnel ? '10,12,22' : '26,35,80';
    fogGrad.addColorStop(0, 'rgba(' + fogCol + ',0)');
    fogGrad.addColorStop(0.22, 'rgba(' + fogCol + ',.42)');
    fogGrad.addColorStop(1, 'rgba(' + fogCol + ',0)');
    ctx.fillStyle = fogGrad;
    ctx.fillRect(0, fy0, W, fy1 - fy0);

    drawTraffic(rows, baseSeg);
    drawPlayerCar();
    drawSmoke();
    ctx.restore();

    // 画面下部のビネット(手前の路面が単調に広がるのを引き締める)
    const vg = ctx.createLinearGradient(0, H * 0.78, 0, H);
    vg.addColorStop(0, 'rgba(3,4,10,0)');
    vg.addColorStop(1, 'rgba(3,4,10,.55)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, H * 0.78, W, H * 0.22);
    // 周辺減光(視線を中央へ集める)
    const cv = ctx.createRadialGradient(W / 2, H * 0.42, Math.min(W, H) * 0.45,
                                        W / 2, H * 0.42, Math.max(W, H) * 0.78);
    cv.addColorStop(0, 'rgba(2,3,10,0)');
    cv.addColorStop(1, 'rgba(2,3,10,.40)');
    ctx.fillStyle = cv;
    ctx.fillRect(0, 0, W, H);

    drawSpeedLines();
    drawHud();
    if (IS_TOUCH && running) drawTouchButtons();
  }

  // 世界座標の点光源を、画面上のサイズを制限して描く
  function dot(p, worldR, color, alpha, maxPx) {
    if (!p || alpha <= 0.01) return;
    const rr = Math.min(maxPx, Math.max(0.7, p.sc * worldR * PROJ_K));
    ctx.globalAlpha = Math.min(1, alpha);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function lerpP(a, b, t) {
    if (!a || !b) return null;
    return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, sc: a.sc };
  }
  function colA(c, a) {
    const p = parseCol(c);
    return 'rgba(' + p[0] + ',' + p[1] + ',' + p[2] + ',' + Math.max(0, Math.min(1, a)).toFixed(3) + ')';
  }

  // ネオン看板
  const BB_TEXT = ['湾岸', 'MIDNIGHT', 'NEON GT', '首都高速', 'TUNE UP', 'RX MOTORS', 'ドリフト天国', 'OIL 24h'];
  const BB_COL = ['#ff3d8f', '#3de8ff', '#f2d048', '#5ee08a'];
  function drawBillboard(r, s, fog) {
    const sgn = hash(r.i * 7) > 0.5 ? 1 : -1;
    const idx = Math.floor(hash(r.i * 13) * BB_TEXT.length);
    const col = BB_COL[idx % BB_COL.length];
    const bx = r.x1 + sgn * (ROAD_HW + 5.5 * M2U);
    const y0 = s.p1y + 4.2 * M2U, bw2 = 3.6 * M2U, bh2 = 1.7 * M2U;
    const a = p3(bx - bw2, y0 - bh2, r.z1), b = p3(bx + bw2, y0 - bh2, r.z1);
    const c = p3(bx + bw2, y0 + bh2, r.z1), d = p3(bx - bw2, y0 + bh2, r.z1);
    if (!a || !c) return;
    // 支柱
    quad(p3(bx - 0.15 * M2U, s.p1y, r.z1), p3(bx + 0.15 * M2U, s.p1y, r.z1),
         p3(bx + 0.15 * M2U, y0 - bh2, r.z1), p3(bx - 0.15 * M2U, y0 - bh2, r.z1),
         shade(40, 46, 66, fog));
    // パネルとネオン縁
    quad(a, b, c, d, shade(12, 14, 24, fog));
    ctx.globalAlpha = (1 - fog) * (0.75 + 0.25 * Math.sin(performance.now() / 300 + r.i));
    ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(1, Math.min(5, a.sc * 0.16 * M2U * PROJ_K));
    ctx.beginPath();
    ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y);
    ctx.closePath(); ctx.stroke();
    // ネオン文字(近い時だけ)
    const hpx = Math.abs(c.y - b.y);
    if (hpx > 10) {
      ctx.fillStyle = col;
      ctx.font = 'bold ' + hpx * 0.42 + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(BB_TEXT[idx], (a.x + c.x) / 2, (a.y + c.y) / 2 + hpx * 0.15);
    }
    ctx.globalAlpha = 1;
  }
  function shade(r, g, b, fog, mul) {
    const m = mul === undefined ? 1 : mul;
    const f = 1 - fog;
    // 遠景ほど夜霧の青へ収束
    const fr = 26, fg = 34, fb = 74;
    return 'rgb(' + Math.round((r * m) * f + fr * fog) + ',' +
                    Math.round((g * m) * f + fg * fog) + ',' +
                    Math.round((b * m) * f + fb * fog) + ')';
  }

  function drawBuilding(bx, by, bz, bw, bh, sgn, fog, seed) {
    const depth = bw * (0.8 + hash(seed + 13) * 0.6);
    const x0 = bx - bw / 2, x1 = bx + bw / 2;
    const z0 = bz, z1 = bz + depth;
    // 手前面
    const a = p3(x0, by, z0), b = p3(x1, by, z0), c = p3(x1, by + bh, z0), d = p3(x0, by + bh, z0);
    // 側面(道路側)
    const sx = sgn > 0 ? x0 : x1;
    const e = p3(sx, by, z0), f = p3(sx, by, z1), g = p3(sx, by + bh, z1), h2 = p3(sx, by + bh, z0);
    quad(e, f, g, h2, shade(7, 10, 22, fog));
    quad(a, b, c, d, shade(12, 16, 32, fog));
    // 窓明かり
    if (a && c && fog < 0.72) {
      const cols = Math.max(2, Math.floor(bw / M2U / 3.2));
      const rows2 = Math.max(3, Math.floor(bh / M2U / 4.0));
      ctx.globalAlpha = (1 - fog) * 0.75;
      for (let wy = 0; wy < rows2; wy++) {
        for (let wx = 0; wx < cols; wx++) {
          if ((wx * 7 + wy * 13 + seed) % 3 !== 0) continue;
          const u0 = (wx + 0.28) / cols, u1 = (wx + 0.72) / cols;
          const v0 = (wy + 0.3) / rows2, v1 = (wy + 0.7) / rows2;
          const pA = p3(x0 + bw * u0, by + bh * v0, z0);
          const pB = p3(x0 + bw * u1, by + bh * v1, z0);
          if (!pA || !pB) continue;
          ctx.fillStyle = ((wx + wy + seed) % 7 === 0) ? 'rgba(180,220,255,.85)' : 'rgba(255,212,130,.8)';
          ctx.fillRect(pA.x, pB.y, Math.max(1, pB.x - pA.x), Math.max(1, pA.y - pB.y));
        }
      }
      ctx.globalAlpha = 1;
    }
    // 高層ビルには屋上アンテナと航空障害灯
    if (bh > 42 * M2U && fog < 0.8) {
      const antTop = by + bh + 6 * M2U;
      const t1 = p3(bx, by + bh, z0), t2 = p3(bx, antTop, z0);
      if (t1 && t2) {
        ctx.strokeStyle = shade(60, 66, 90, fog);
        ctx.lineWidth = Math.max(0.7, t1.sc * 0.15 * M2U * PROJ_K);
        ctx.beginPath(); ctx.moveTo(t1.x, t1.y); ctx.lineTo(t2.x, t2.y); ctx.stroke();
        const blink = Math.floor(performance.now() / 650 + hash(seed) * 10) % 2 === 0;
        dot(t2, 0.5 * M2U, '#ff4a4a', (blink ? 0.95 : 0.22) * (1 - fog), 5);
      }
    }
  }

  function drawGate(r, s, fog) {
    const gh = 7.4 * M2U, bw = 0.34 * M2U;
    const blink = Math.floor(performance.now() / 300) % 2 === 0;
    const f = 1 - fog;
    const col = s.finish
      ? shade(232, 236, 246, fog)
      : 'rgb(' + Math.round((blink ? 61 : 24) * f + 26 * fog) + ',' +
                 Math.round((blink ? 190 : 92) * f + 34 * fog) + ',' +
                 Math.round((blink ? 214 : 110) * f + 74 * fog) + ')';
    for (const sgn of [-1, 1]) {
      const px = r.x1 + sgn * ROAD_HW * 1.06;
      const a = p3(px - bw, s.p1y, r.z1), b = p3(px + bw, s.p1y, r.z1);
      const c = p3(px + bw, s.p1y + gh, r.z1), d = p3(px - bw, s.p1y + gh, r.z1);
      quad(a, b, c, d, col);
    }
    const la = p3(r.x1 - ROAD_HW * 1.06, s.p1y + gh, r.z1);
    const lb = p3(r.x1 + ROAD_HW * 1.06, s.p1y + gh, r.z1);
    const lc = p3(r.x1 + ROAD_HW * 1.06, s.p1y + gh - 0.9 * M2U, r.z1);
    const ld = p3(r.x1 - ROAD_HW * 1.06, s.p1y + gh - 0.9 * M2U, r.z1);
    if (s.finish && la && lb) {
      for (let c3 = 0; c3 < 12; c3++) {
        const t0 = c3 / 12, t1 = (c3 + 1) / 12;
        quad(lerpP(la, lb, t0), lerpP(la, lb, t1), lerpP(ld, lc, t1), lerpP(ld, lc, t0),
             c3 % 2 ? '#e8eaf6' : '#14161c');
      }
    } else {
      quad(la, lb, lc, ld, col);
    }
  }

  function drawSmoke() {
    const s = Math.min(W, H);
    const baseY = carScreenY;
    for (const p of smoke) {
      const age = p.spark ? 1 - p.t / 0.4 : 1 - p.t / 0.75;
      const sz = p.spark ? 3 : 5 + age * 34;
      ctx.globalAlpha = (p.spark ? 0.9 : 0.17) * (1 - age);
      ctx.fillStyle = p.spark ? '#ffcf5e' : '#aeb8d4';
      const px = carScreenX + p.x * s * 0.08 - steerIn * s * 0.02;
      const py = baseY + age * s * 0.05;
      ctx.beginPath(); ctx.arc(px, py, sz, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ============ 3Dカーモデル ============
  // 車種ごとの寸法(m)。ロフト(断面の押し出し)で車体を組み立てる。
  const SHAPE = {
    classic: { L:4.14, W:1.63, ride:0.16, belt:0.90, roof:1.26, rf0:-0.95, rf1:0.50, nose:0.80, tail:0.94, wb:2.30, tw:1.46, wr:0.31, ww:0.21, wing:0 },
    coupe:   { L:4.45, W:1.76, ride:0.13, belt:0.92, roof:1.28, rf0:-1.05, rf1:0.55, nose:0.74, tail:0.96, wb:2.55, tw:1.60, wr:0.33, ww:0.26, wing:1 },
    sedan:   { L:4.70, W:1.77, ride:0.15, belt:0.98, roof:1.42, rf0:-1.25, rf1:0.72, nose:0.86, tail:1.04, wb:2.70, tw:1.60, wr:0.33, ww:0.24, wing:0 },
    hatch:   { L:4.16, W:1.69, ride:0.15, belt:0.94, roof:1.38, rf0:-0.95, rf1:0.78, nose:0.84, tail:1.30, wb:2.45, tw:1.53, wr:0.31, ww:0.22, wing:0 },
    super:   { L:4.44, W:1.94, ride:0.10, belt:0.80, roof:1.12, rf0:-0.70, rf1:0.45, nose:0.62, tail:0.88, wb:2.50, tw:1.76, wr:0.34, ww:0.32, wing:1 },
    truck:   { L:4.69, W:1.70, ride:0.42, belt:1.15, roof:2.12, rf0:-1.05, rf1:1.15, nose:1.30, tail:2.12, wb:2.53, tw:1.52, wr:0.36, ww:0.21, wing:0 },
  };

  // 断面列から箱状のポリゴンを生成
  function loft(V, F, secs, role, topRole) {
    const ring = [];
    for (const s of secs) {
      ring.push(V.length);
      V.push([-s.hw, s.y0, s.z], [s.hw, s.y0, s.z], [s.hw, s.y1, s.z], [-s.hw, s.y1, s.z]);
    }
    for (let i = 0; i < ring.length - 1; i++) {
      const a = ring[i], b = ring[i + 1];
      F.push({ v: [a + 0, a + 1, b + 1, b + 0], r: 'under' });
      F.push({ v: [a + 3, b + 3, b + 2, a + 2], r: topRole || role });
      F.push({ v: [a + 0, b + 0, b + 3, a + 3], r: role });
      F.push({ v: [a + 1, a + 2, b + 2, b + 1], r: role });
    }
    const f = ring[0], l = ring[ring.length - 1];
    F.push({ v: [f + 0, f + 3, f + 2, f + 1], r: role });
    F.push({ v: [l + 0, l + 1, l + 2, l + 3], r: role });
    return ring;
  }
  // 円柱(タイヤ)
  function cylinder(V, F, cx, cy, cz, radius, halfW, sides, role) {
    const inner = [], outer = [];
    for (let i = 0; i < sides; i++) {
      const t = i / sides * Math.PI * 2;
      const y = cy + Math.sin(t) * radius, z = cz + Math.cos(t) * radius;
      inner.push(V.length); V.push([cx - halfW, y, z]);
      outer.push(V.length); V.push([cx + halfW, y, z]);
    }
    for (let i = 0; i < sides; i++) {
      const j = (i + 1) % sides;
      F.push({ v: [inner[i], outer[i], outer[j], inner[j]], r: role });
    }
    // ホイール面
    for (let i = 0; i < sides; i += 2) {
      const j = (i + 1) % sides, k = (i + 2) % sides;
      F.push({ v: [outer[i], outer[j], outer[k], outer[i]], r: 'rim' });
      F.push({ v: [inner[i], inner[k], inner[j], inner[i]], r: 'rim' });
    }
  }

  function makeCarMesh(type, hasWing) {
    const p = SHAPE[type] || SHAPE.coupe;
    const V = [], F = [];
    const hw = p.W / 2, hl = p.L / 2;
    // 車体本体
    loft(V, F, [
      { z: -hl,          hw: hw * 0.90, y0: p.ride + 0.10, y1: p.tail * 0.86 },
      { z: -hl * 0.72,   hw: hw * 0.99, y0: p.ride,        y1: p.tail },
      { z: -hl * 0.22,   hw: hw,        y0: p.ride,        y1: p.belt },
      { z:  hl * 0.28,   hw: hw,        y0: p.ride,        y1: p.belt * 0.98 },
      { z:  hl * 0.74,   hw: hw * 0.96, y0: p.ride + 0.02, y1: p.nose * 1.04 },
      { z:  hl,          hw: hw * 0.82, y0: p.ride + 0.08, y1: p.nose },
    ], 'body');
    // キャビン(グラスハウス)
    const cw = type === 'truck' ? hw * 0.97 : hw * 0.80;
    loft(V, F, [
      { z: p.rf0,                        hw: cw * 0.90, y0: p.belt * 0.96, y1: p.roof * 0.93 },
      { z: p.rf0 + (p.rf1 - p.rf0) * .3, hw: cw,        y0: p.belt * 0.96, y1: p.roof },
      { z: p.rf0 + (p.rf1 - p.rf0) * .8, hw: cw * 0.98, y0: p.belt * 0.96, y1: p.roof },
      { z: p.rf1,                        hw: cw * 0.86, y0: p.belt * 0.96, y1: p.roof * 0.90 },
    ], 'glass', 'roof');
    // タイヤ4輪
    const wx = p.tw / 2, wzF = p.wb / 2, wzR = -p.wb / 2;
    const wheels = [];
    for (const [sx, sz, isFront] of [[-1, wzF, true], [1, wzF, true], [-1, wzR, false], [1, wzR, false]]) {
      const start = V.length;
      cylinder(V, F, sx * wx, p.wr, sz, p.wr, p.ww / 2, 8, 'tire');
      wheels.push({ from: start, to: V.length, front: isFront, cx: sx * wx, cz: sz });
    }
    // リアウイング
    if (hasWing || p.wing) {
      const wy = p.tail + 0.20, wz = -hl + 0.16;
      loft(V, F, [
        { z: wz - 0.13, hw: hw * 0.86, y0: wy, y1: wy + 0.055 },
        { z: wz + 0.13, hw: hw * 0.86, y0: wy - 0.02, y1: wy + 0.035 },
      ], 'wing');
      for (const sx of [-1, 1]) {
        const before = V.length;
        loft(V, F, [
          { z: wz - 0.05, hw: 0.035, y0: p.tail * 0.92, y1: wy },
          { z: wz + 0.05, hw: 0.035, y0: p.tail * 0.92, y1: wy },
        ], 'wing');
        // このステーの頂点だけを左右にずらす
        for (let i = before; i < V.length; i++) V[i][0] += sx * hw * 0.66;
      }
    }
    // リアバンパー / ディフューザー(リア面に段差を作って平板さを消す)
    if (type !== 'truck') {
      loft(V, F, [
        { z: -hl - 0.04, hw: hw * 0.86, y0: p.ride + 0.04, y1: p.tail * 0.40 },
        { z: -hl + 0.34, hw: hw * 0.93, y0: p.ride + 0.02, y1: p.tail * 0.44 },
      ], 'bumper');
      // ショルダー(リアフェンダーの張り出し)
      for (const sx of [-1, 1]) {
        const before = V.length;
        loft(V, F, [
          { z: -hl * 0.86, hw: 0.055, y0: p.ride + 0.16, y1: p.tail * 0.86 },
          { z: -hl * 0.30, hw: 0.055, y0: p.ride + 0.16, y1: p.belt * 0.98 },
        ], 'body');
        for (let i = before; i < V.length; i++) V[i][0] += sx * hw * 1.01;
      }
    }
    // テールランプ / ナンバープレート(車体後端にわずかに浮かせる)
    const lampY = p.tail * 0.62, lampZ = -hl - 0.055;
    const parts = [];
    if (type === 'classic') {
      for (const sx of [-1, 1]) for (const o of [0.30, 0.52]) {
        parts.push({ x: sx * hw * o, y: lampY, w: 0.13, h: 0.13, role: 'lamp' });
      }
    } else if (type === 'truck') {
      for (const sx of [-1, 1]) {
        parts.push({ x: sx * hw * 0.80, y: p.tail * 0.86, w: 0.15, h: 0.22, role: 'lamp' });
        parts.push({ x: sx * hw * 0.80, y: p.tail * 0.62, w: 0.15, h: 0.14, role: 'amber' });
      }
    } else {
      for (const sx of [-1, 1]) {
        parts.push({ x: sx * hw * 0.58, y: lampY, w: hw * 0.52, h: 0.17, role: 'lamp' });
      }
    }
    parts.push({ x: 0, y: lampY - 0.20, w: 0.33, h: 0.16, role: 'plate' });
    for (const q of parts) {
      const i0 = V.length;
      V.push([q.x - q.w / 2, q.y - q.h / 2, lampZ], [q.x + q.w / 2, q.y - q.h / 2, lampZ],
             [q.x + q.w / 2, q.y + q.h / 2, lampZ], [q.x - q.w / 2, q.y + q.h / 2, lampZ]);
      F.push({ v: [i0, i0 + 1, i0 + 2, i0 + 3], r: q.role, flat: true });
    }
    // マフラー
    for (const sx of (type === 'super' ? [-1, 1] : [1])) {
      const i0 = V.length, ex = sx * hw * 0.52, ey = p.ride + 0.09;
      V.push([ex - 0.06, ey - 0.05, lampZ], [ex + 0.06, ey - 0.05, lampZ],
             [ex + 0.06, ey + 0.05, lampZ], [ex - 0.06, ey + 0.05, lampZ]);
      F.push({ v: [i0, i0 + 1, i0 + 2, i0 + 3], r: 'pipe', flat: true });
    }
    return { V, F, wheels, p };
  }

  const meshCache = {};
  function ensureMesh(type, wing) {
    const key = type + (wing ? 'W' : '');
    if (!meshCache[key]) meshCache[key] = makeCarMesh(type, wing);
    return meshCache[key];
  }
  // 頂点変換用のスクラッチ(毎フレームの確保を避ける)
  const SCR = { n: 0, wx: null, wy: null, wz: null, px: null, py: null, pz: null, steer: null };
  function ensureScratch(n) {
    if (SCR.n >= n) return;
    SCR.n = n;
    SCR.wx = new Float64Array(n); SCR.wy = new Float64Array(n); SCR.wz = new Float64Array(n);
    SCR.px = new Float64Array(n); SCR.py = new Float64Array(n); SCR.pz = new Float64Array(n);
    SCR.steer = new Uint8Array(n);
  }

  // メッシュを世界へ配置して描画
  function drawCar3D(mesh, wx, wy, wz, yaw, pitch, roll, color, opt) {
    const { V, F, wheels } = mesh;
    const cy = Math.cos(yaw), sy = Math.sin(yaw);
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    const cr = Math.cos(roll), sr = Math.sin(roll);
    const n = V.length;
    ensureScratch(n);
    const wxs = SCR.wx, wys = SCR.wy, wzs = SCR.wz, px = SCR.px, py = SCR.py, pz = SCR.pz;
    // 前輪の操舵
    const sd = Math.cos(opt.steer), sdS = Math.sin(opt.steer);
    const steerSet = SCR.steer;
    steerSet.fill(0, 0, n);
    for (const wh of wheels) if (wh.front) for (let i = wh.from; i < wh.to; i++) steerSet[i] = 1;

    for (let i = 0; i < n; i++) {
      let vx = V[i][0], vy = V[i][1], vz = V[i][2];
      if (steerSet[i]) {
        // 前輪をホイール中心まわりに操舵
        const ox = V[i][0], oz = V[i][2];
        const cxw = ox > 0 ? mesh.p.tw / 2 : -mesh.p.tw / 2, czw = mesh.p.wb / 2;
        const rx = ox - cxw, rz = oz - czw;
        vx = cxw + rx * sd + rz * sdS;
        vz = czw - rx * sdS + rz * sd;
      }
      // ロール(z軸) -> ピッチ(x軸) -> ヨー(y軸)
      const x1 = vx * cr - vy * sr, y1 = vx * sr + vy * cr, z1 = vz;
      const y2 = y1 * cp - z1 * sp, z2 = y1 * sp + z1 * cp;
      const x3 = x1 * cy + z2 * sy, z3 = -x1 * sy + z2 * cy;
      wxs[i] = wx + x3 * M2U; wys[i] = wy + y2 * M2U; wzs[i] = wz + z3 * M2U;
      const P = p3(wxs[i], wys[i], wzs[i]);
      px[i] = P.x; py[i] = P.y; pz[i] = P.rz;
    }

    // 面を奥から手前へ
    const order = [];
    for (let k = 0; k < F.length; k++) {
      const v = F[k].v;
      order.push({ k, d: (pz[v[0]] + pz[v[1]] + pz[v[2]] + pz[v[3]]) * 0.25 });
    }
    order.sort((a, b) => b.d - a.d);

    const brake = opt.brake;
    const LIGHT = [-0.52, 0.78, -0.35];   // 月あかり(左上後方)。左右で陰影差を出す
    for (const o of order) {
      const f = F[o.k], v = f.v;
      // 面法線(車体中心から外向きに揃える)
      const ax = wxs[v[1]] - wxs[v[0]], ay = wys[v[1]] - wys[v[0]], az = wzs[v[1]] - wzs[v[0]];
      const bx = wxs[v[3]] - wxs[v[0]], by = wys[v[3]] - wys[v[0]], bz = wzs[v[3]] - wzs[v[0]];
      let nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
      const nl = Math.hypot(nx, ny, nz) || 1;
      nx /= nl; ny /= nl; nz /= nl;
      const ccx = (wxs[v[0]] + wxs[v[2]]) / 2 - wx, ccy = (wys[v[0]] + wys[v[2]]) / 2 - wy - 0.6 * M2U;
      const ccz = (wzs[v[0]] + wzs[v[2]]) / 2 - wz;
      if (nx * ccx + ny * ccy + nz * ccz < 0) { nx = -nx; ny = -ny; nz = -nz; }
      const lam = Math.max(0, nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]);
      let col;
      switch (f.r) {
        case 'body': case 'roof':
          col = mixColor(color, '#ffffff', 0.06 + lam * 0.30);
          col = mixColor(col, '#0a0f22', 0.30 - lam * 0.26);
          // 月光のスペキュラ(上向きの面に冷たい艶)
          if (lam > 0.72) col = mixColor(col, '#cfe0ff', (lam - 0.72) * 0.85);
          break;
        case 'glass': col = mixColor('#0c1226', '#7fa8e0', 0.10 + lam * 0.34); break;
        case 'wing':  col = mixColor('#15161c', '#ffffff', lam * 0.30); break;
        case 'bumper': col = mixColor(mixColor(color, '#000000', 0.42), '#ffffff', lam * 0.24); break;
        case 'tire':  col = mixColor('#0c0d10', '#ffffff', lam * 0.22); break;
        case 'rim':   col = mixColor('#4a4f5c', '#ffffff', lam * 0.45); break;
        case 'under': col = '#05060b'; break;
        case 'lamp':  col = brake ? '#ff6b80' : '#c62b3a'; break;
        case 'amber': col = '#e8a33d'; break;
        case 'plate': col = '#e9ecdf'; break;
        case 'pipe':  col = mixColor('#3a3d45', '#ffffff', lam * 0.5); break;
        default:      col = mixColor(color, '#000000', 0.4);
      }
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(px[v[0]], py[v[0]]);
      ctx.lineTo(px[v[1]], py[v[1]]);
      ctx.lineTo(px[v[2]], py[v[2]]);
      ctx.lineTo(px[v[3]], py[v[3]]);
      ctx.closePath();
      ctx.fill();
      // パネルライン(面の境界をわずかに沈めて立体感を出す)
      if (f.r === 'body' || f.r === 'roof' || f.r === 'glass' || f.r === 'bumper') {
        ctx.strokeStyle = 'rgba(5,7,14,.30)';
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
      // ブレーキランプのハロー
      if (f.r === 'lamp' && brake) {
        ctx.globalAlpha = 0.30;
        ctx.fillStyle = '#ff3d5e';
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
    // 車体中心のスクリーン座標を返す
    return p3(wx, wy, wz);
  }

  // ---- 車体スプライト(ガレージのプレビュー用) ----
  function drawCarSprite(c, x, y, w, type, color, opt) {
    opt = opt || {};
    const brake = opt.brake;
    let h = w * 0.52;
    if (type === 'sedan') h = w * 0.56;
    if (type === 'super') h = w * 0.44;
    if (type === 'truck') h = w * 0.95;
    c.save();
    c.translate(x, y);
    if (opt.rot) c.rotate(opt.rot);
    if (opt.skew) c.transform(1, 0, opt.skew, 1, 0, 0);

    if (type === 'truck') {
      c.fillStyle = color;
      c.beginPath();
      c.moveTo(-w / 2, 0);
      c.lineTo(-w / 2 + w * 0.02, -h * 0.96);
      c.quadraticCurveTo(0, -h * 1.04, w / 2 - w * 0.02, -h * 0.96);
      c.lineTo(w / 2, 0);
      c.closePath(); c.fill();
      c.fillStyle = 'rgba(10,14,30,.88)';
      c.beginPath();
      if (c.roundRect) c.roundRect(-w * 0.36, -h * 0.9, w * 0.72, h * 0.52, w * 0.03);
      else c.rect(-w * 0.36, -h * 0.9, w * 0.72, h * 0.52);
      c.fill();
      c.strokeStyle = 'rgba(30,34,44,.9)';
      c.lineWidth = Math.max(1, w * 0.012);
      c.beginPath(); c.moveTo(w * 0.05, -h * 0.4); c.lineTo(-w * 0.12, -h * 0.78); c.stroke();
      c.fillStyle = '#23252b';
      c.fillRect(-w * 0.5, -h * 0.1, w, h * 0.1);
      c.fillRect(-w * 0.3, -h * 0.34, w * 0.6, h * 0.035);
      c.fillStyle = '#f5f7f0';
      const tpw = w * 0.2, tph = h * 0.1;
      c.fillRect(-tpw / 2, -h * 0.3, tpw, tph);
      if (w > 90) {
        c.fillStyle = '#1a3a1a';
        c.font = 'bold ' + tph * 0.5 + 'px sans-serif'; c.textAlign = 'center';
        c.fillText('湾岸 30-45', 0, -h * 0.3 + tph * 0.72);
      }
      c.fillStyle = brake ? '#ff5570' : '#c62828';
      c.fillRect(-w * 0.48, -h * 0.94, w * 0.07, h * 0.1);
      c.fillRect(w * 0.41, -h * 0.94, w * 0.07, h * 0.1);
      c.fillStyle = '#e8a33d';
      c.fillRect(-w * 0.48, -h * 0.83, w * 0.07, h * 0.07);
      c.fillRect(w * 0.41, -h * 0.83, w * 0.07, h * 0.07);
      c.fillStyle = brake ? '#ff5570' : '#c62828';
      c.fillRect(-w * 0.46, -h * 0.14, w * 0.09, h * 0.05);
      c.fillRect(w * 0.37, -h * 0.14, w * 0.09, h * 0.05);
      c.fillStyle = '#1a1c22';
      c.beginPath(); c.ellipse(w * 0.18, -h * 0.035, w * 0.09, h * 0.035, 0, 0, Math.PI * 2); c.fill();
    } else {
      const cab = type === 'super' ? 0.34 : type === 'sedan' ? 0.42 : 0.38;
      // 影
      c.fillStyle = 'rgba(0,0,0,.4)';
      c.beginPath(); c.ellipse(0, 0, w * 0.52, h * 0.1, 0, 0, Math.PI * 2); c.fill();
      // ボディ(上面をやや明るくして立体感)
      const grad = c.createLinearGradient(0, -h, 0, 0);
      grad.addColorStop(0, mixColor(color, '#ffffff', 0.22));
      grad.addColorStop(0.55, color);
      grad.addColorStop(1, mixColor(color, '#000000', 0.38));
      c.fillStyle = grad;
      c.beginPath();
      c.moveTo(-w / 2, 0);
      c.lineTo(-w / 2 + w * 0.06, -h * 0.52);
      c.lineTo(-w / 2 + w * cab, -h);
      c.lineTo(w / 2 - w * cab, -h);
      c.lineTo(w / 2 - w * 0.06, -h * 0.52);
      c.lineTo(w / 2, 0);
      c.closePath(); c.fill();
      // リアウィンドウ
      c.fillStyle = 'rgba(8,12,26,.9)';
      c.fillRect(-w * (0.5 - cab) * 0.92, -h * 0.94, w * (1 - cab * 2) * 0.92 + w * 0.06, h * 0.34);
      c.fillStyle = 'rgba(120,160,220,.12)';
      c.fillRect(-w * (0.5 - cab) * 0.92, -h * 0.94, w * (1 - cab * 2) * 0.92 + w * 0.06, h * 0.1);
      if (type === 'coupe' || type === 'super' || opt.wing) {
        c.fillStyle = 'rgba(0,0,0,.62)';
        c.fillRect(-w * 0.42, -h * 1.1, w * 0.84, h * 0.09);
        c.fillRect(-w * 0.38, -h * 1.02, w * 0.05, h * 0.1);
        c.fillRect(w * 0.33, -h * 1.02, w * 0.05, h * 0.1);
      }
      if (type === 'classic') {
        c.fillStyle = brake ? '#ff5570' : '#d32f2f';
        for (const sx of [-1, 1]) {
          c.beginPath(); c.arc(sx * w * 0.32, -h * 0.34, w * 0.05, 0, Math.PI * 2); c.fill();
          c.beginPath(); c.arc(sx * w * 0.2, -h * 0.34, w * 0.05, 0, Math.PI * 2); c.fill();
        }
      } else {
        c.fillStyle = brake ? '#ff5570' : '#d32f2f';
        c.fillRect(-w * 0.44, -h * 0.4, w * 0.24, h * (brake ? 0.15 : 0.11));
        c.fillRect(w * 0.2, -h * 0.4, w * 0.24, h * (brake ? 0.15 : 0.11));
        if (brake) {
          c.fillStyle = 'rgba(255,60,90,.28)';
          c.fillRect(-w * 0.55, -h * 0.5, w * 1.1, h * 0.32);
        }
      }
      c.fillStyle = '#f5f7f0';
      const pw = w * 0.18, phh = h * 0.12;
      c.fillRect(-pw / 2, -h * 0.3, pw, phh);
      if (w > 90) {
        c.fillStyle = '#1a3a1a';
        c.font = 'bold ' + phh * 0.55 + 'px sans-serif'; c.textAlign = 'center';
        c.fillText('湾岸 33-45', 0, -h * 0.3 + phh * 0.75);
      }
      c.fillStyle = '#555';
      c.beginPath(); c.arc(w * 0.34, -h * 0.06, w * 0.035, 0, Math.PI * 2); c.fill();
      if (type === 'super') { c.beginPath(); c.arc(-w * 0.34, -h * 0.06, w * 0.035, 0, Math.PI * 2); c.fill(); }
    }
    c.fillStyle = '#000';
    c.fillRect(-w * 0.5, -h * 0.1, w * 0.13, h * 0.14);
    c.fillRect(w * 0.37, -h * 0.1, w * 0.13, h * 0.14);
    c.restore();
  }
  // '#rrggbb' と 'rgb(r,g,b)' の双方を受け付ける
  function parseCol(c) {
    if (c[0] === '#') {
      const v = parseInt(c.slice(1), 16);
      return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
    }
    const m = c.match(/(\d+)\D+(\d+)\D+(\d+)/);
    return m ? [+m[1], +m[2], +m[3]] : [128, 128, 128];
  }
  function mixColor(a, b, t) {
    const pa = parseCol(a), pb = parseCol(b);
    return 'rgb(' + Math.round(pa[0] * (1 - t) + pb[0] * t) + ',' +
                    Math.round(pa[1] * (1 - t) + pb[1] * t) + ',' +
                    Math.round(pa[2] * (1 - t) + pb[2] * t) + ')';
  }

  // 自車の画面上のX(3D投影から得る。スモークなどが追従する)
  let carScreenX = 0, carScreenY = 0;
  // 自車位置における道路中心の世界X(描画ループが毎フレーム更新する)
  let carRoadX = 0;
  // 交通車両を奥から手前へ描画
  function drawTraffic(rows, baseSeg) {
    if (!traffic.length) return;
    const first = baseSeg.index, last = first + rows.length - 1;
    const list = [];
    for (const t of traffic) {
      const si = Math.floor(t.z / SEG_LEN);
      if (si < first || si > last) continue;
      list.push({ t, row: rows[si - first], pct: (t.z % SEG_LEN) / SEG_LEN, si });
    }
    if (!list.length) return;
    list.sort((a, b) => b.si - a.si);
    for (const it of list) {
      const r = it.row, s = r.s;
      const cxT = r.x1 + (r.x2 - r.x1) * it.pct;
      const yT = s.p1y + (s.p2y - s.p1y) * it.pct;
      const wx = cxT + it.t.x * M2U;
      const wy = yT - Math.sin(s.bank) * it.t.x * M2U;
      const mesh = ensureMesh(it.t.type, false);
      // テールランプの路面反射(車より先に描く)
      const ctr = p3(wx, wy, it.t.z);
      if (ctr) {
        const len = Math.min(H * 0.16, ctr.sc * 6 * M2U * PROJ_K);
        const wd = Math.max(2, Math.min(40, ctr.sc * it.t.w * M2U * PROJ_K * 0.7));
        if (len > 3) {
          const gt = ctx.createLinearGradient(0, ctr.y, 0, ctr.y + len);
          gt.addColorStop(0, 'rgba(255,45,80,' + (it.t.brake > 0 ? 0.22 : 0.10) + ')');
          gt.addColorStop(1, 'rgba(255,45,80,0)');
          ctx.fillStyle = gt;
          ctx.fillRect(ctr.x - wd / 2, ctr.y, wd, len);
        }
      }
      drawCar3D(mesh, wx, wy, it.t.z, 0, 0, s.bank * 0.5, it.t.color,
                { brake: it.t.brake > 0, steer: 0 });
    }
  }

  // 工事規制のパイロン
  function drawCones(r, s, fog) {
    if (!s.cone) return;
    if (r.i % 2 !== 0) return;
    const xw = s.cone * ROAD_HW * 0.52;
    const base = p3(r.x1 + xw, s.p1y, r.z1);
    const top = p3(r.x1 + xw, s.p1y + 0.72 * M2U, r.z1);
    if (!base || !top) return;
    const wpx = Math.max(1.5, base.sc * 0.34 * M2U * PROJ_K);
    ctx.fillStyle = shade(232, 110, 40, fog);
    ctx.beginPath();
    ctx.moveTo(base.x - wpx, base.y);
    ctx.lineTo(base.x + wpx, base.y);
    ctx.lineTo(top.x + wpx * 0.22, top.y);
    ctx.lineTo(top.x - wpx * 0.22, top.y);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = shade(240, 240, 245, fog);
    const my = base.y + (top.y - base.y) * 0.55;
    ctx.fillRect(base.x - wpx * 0.6, my, wpx * 1.2, Math.max(1, (base.y - top.y) * 0.13));
  }

  // 道路標識(支柱+板)。板はドライバー側を向く
  function drawSign(r, s, sg, fog) {
    const side = sg.kind === 'board' ? 0 : 1;          // 案内板は路側、他は右側
    const px = r.x1 + (sg.kind === 'board' ? -ROAD_HW * 1.2 : ROAD_HW * 1.2);
    const h0 = sg.kind === 'board' ? 5.4 : 2.6;
    const postB = p3(px, s.p1y, r.z1);
    const postT = p3(px, s.p1y + h0 * M2U, r.z1);
    if (!postB || !postT) return;
    const pw = Math.max(1, postB.sc * 0.10 * M2U * PROJ_K);
    ctx.fillStyle = shade(70, 76, 96, fog);
    ctx.fillRect(postT.x - pw, postT.y, pw * 2, postB.y - postT.y);
    const size = (sg.kind === 'board' ? 2.6 : 0.95) * M2U;
    const cx = postT.x, cy = postT.y;
    const hp = Math.max(3, postT.sc * size * PROJ_K * 0.5);
    if (hp < 3) return;
    const f = 1 - fog;
    ctx.globalAlpha = Math.max(0.15, f);
    if (sg.kind === 'curve') {
      // 黄色の警戒標識(ひし形)+ 曲がる向きの矢印
      ctx.fillStyle = '#f0c419';
      ctx.beginPath();
      ctx.moveTo(cx, cy - hp); ctx.lineTo(cx + hp, cy); ctx.lineTo(cx, cy + hp); ctx.lineTo(cx - hp, cy);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = Math.max(1, hp * 0.09); ctx.stroke();
      ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = Math.max(1.2, hp * 0.16);
      ctx.beginPath();
      ctx.moveTo(cx - sg.dir * hp * 0.34, cy + hp * 0.42);
      ctx.lineTo(cx - sg.dir * hp * 0.34, cy - hp * 0.05);
      ctx.lineTo(cx + sg.dir * hp * 0.36, cy - hp * 0.45);
      ctx.stroke();
    } else if (sg.kind === 'limit') {
      ctx.fillStyle = '#f7f7f2';
      ctx.beginPath(); ctx.arc(cx, cy, hp, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#cc2222'; ctx.lineWidth = Math.max(1.5, hp * 0.22);
      ctx.beginPath(); ctx.arc(cx, cy, hp * 0.86, 0, Math.PI * 2); ctx.stroke();
      if (hp > 9) {
        ctx.fillStyle = '#1a1a1a';
        ctx.font = 'bold ' + (hp * 1.05) + 'px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('60', cx, cy + hp * 0.04);
        ctx.textBaseline = 'alphabetic';
      }
    } else {
      // 緑の案内板
      ctx.fillStyle = '#136b3c';
      ctx.fillRect(cx - hp, cy - hp * 0.46, hp * 2, hp * 0.92);
      ctx.strokeStyle = '#e8f0e8'; ctx.lineWidth = Math.max(1, hp * 0.06);
      ctx.strokeRect(cx - hp, cy - hp * 0.46, hp * 2, hp * 0.92);
      ctx.fillStyle = '#e8f0e8';
      ctx.fillRect(cx - hp * 0.7, cy - hp * 0.18, hp * 1.0, Math.max(1, hp * 0.1));
      ctx.fillRect(cx - hp * 0.7, cy + hp * 0.08, hp * 0.7, Math.max(1, hp * 0.1));
    }
    ctx.globalAlpha = 1;
  }

  function drawPlayerCar() {
    const s = Math.min(W, H);
    const baseSeg = findSegment(posZ);
    const basePct = (posZ % SEG_LEN) / SEG_LEN;
    const roadY = baseSeg.p1y + (baseSeg.p2y - baseSeg.p1y) * basePct;
    const carWX = carRoadX + posX * M2U;
    const carWY = roadY - Math.sin(baseSeg.bank) * posX * M2U + bodyHeave * M2U;
    const mesh = ensureMesh(car.type, sel.tune === 2);
    const brake = keys.down || input.brake;

    // 路面への投影影
    const shC = p3(carWX, carWY + 2, posZ);
    if (shC) {
      const hl = mesh.p.L / 2 * M2U * 0.92, hwid = mesh.p.W / 2 * M2U * 0.9;
      const cyh = Math.cos(heading), syh = Math.sin(heading);
      const corner = (ox, oz) => p3(carWX + (ox * cyh + oz * syh), carWY + 2, posZ + (-ox * syh + oz * cyh));
      ctx.globalAlpha = 0.30;
      quad(corner(-hwid, -hl), corner(hwid, -hl), corner(hwid, hl), corner(-hwid, hl), '#03040a');
      ctx.globalAlpha = 1;
      // フルチューン車はアンダーネオン
      if (sel.tune === 2) {
        const pr = Math.max(10, shC.sc * 2.6 * M2U * PROJ_K);
        const ug = ctx.createRadialGradient(shC.x, shC.y, 0, shC.x, shC.y, pr);
        ug.addColorStop(0, 'rgba(110,90,255,.22)');
        ug.addColorStop(1, 'rgba(110,90,255,0)');
        ctx.fillStyle = ug;
        ctx.beginPath(); ctx.ellipse(shC.x, shC.y, pr, pr * 0.30, 0, 0, Math.PI * 2); ctx.fill();
      }
    }

    // 3Dの車体本体(ヨー・ピッチ・ロール込み)
    const proj = drawCar3D(mesh, carWX, carWY, posZ,
      heading, bodyPitch, bodyRoll + Math.sin(baseSeg.bank) * 0.6, car.color,
      { brake, steer: steerIn * mesh.p.wb * 0.09 });
    carScreenX = proj ? proj.x : W / 2;
    carScreenY = proj ? proj.y : H * 0.78;

    // 火花
    if (scraping) {
      ctx.fillStyle = '#ffcf5e';
      const sx = carScreenX + Math.sign(posX) * s * 0.09;
      for (let i = 0; i < 7; i++) {
        ctx.fillRect(sx + (Math.random() - .5) * 18, carScreenY - Math.random() * s * 0.05, 3, 3);
      }
    }
  }

  function drawPlayerCarOld() {
    const s = Math.min(W, H);
    const w = s * 0.21;
    const x = carScreenX;
    const y = H - s * (IS_TOUCH ? 0.14 : 0.09);
    const grad = ctx.createRadialGradient(x, y - w * 0.9, 10, x, y - w * 0.9, s * 0.42);
    grad.addColorStop(0, 'rgba(200,220,255,.13)');
    grad.addColorStop(1, 'rgba(200,220,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(x - s * 0.45, y - w * 0.9 - s * 0.45, s * 0.9, s * 0.5);
    if (scraping) {
      ctx.fillStyle = '#ffcf5e';
      const sx = x + Math.sign(posX) * w * 0.5;
      for (let i = 0; i < 7; i++) ctx.fillRect(sx + (Math.random() - .5) * 18, y - Math.random() * w * 0.5, 3, 3);
    }
    drawCarSprite(ctx, x, y, w, car.type, car.color, {
      brake: keys.down || input.brake,
      rot: heading * 0.55 + steerIn * 0.03,
      skew: -heading * 0.5,
      wing: sel.tune === 2,
    });
  }

  function drawSpeedLines() {
    const kmh = vMs * 3.6;
    const intensity = Math.max(0, (kmh - 200) / 150);
    if (intensity <= 0) return;
    ctx.strokeStyle = 'rgba(180,210,255,' + (0.15 * Math.min(1, intensity)) + ')';
    ctx.lineWidth = 2;
    const cx = W / 2, cy = H * 0.44;
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2 + (posZ * 0.0002 % (Math.PI * 2));
      const r1 = Math.min(W, H) * (0.42 + 0.1 * Math.sin(i * 7 + posZ * 0.0008));
      const r2 = r1 + Math.min(W, H) * 0.24 * Math.min(1, intensity);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
      ctx.stroke();
    }
  }

  // ================= HUD =================
  function drawHud() {
    const s = Math.min(W, H);
    const pad = s * 0.035;
    const kmh = vMs * 3.6;

    if (raceState === 'countdown') {
      const n = Math.ceil(countdown - 0.6);
      if (n >= 1 && n <= 3) {
        if (n !== lastBeep) { sfxBeep(); lastBeep = n; }
        ctx.textAlign = 'center';
        ctx.font = 'italic bold ' + s * 0.3 + 'px "Arial Black", sans-serif';
        ctx.fillStyle = 'rgba(242,208,72,.92)';
        ctx.fillText(n, W / 2, H * 0.44);
      }
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + s * 0.03 + 'px sans-serif';
      ctx.fillStyle = '#8b93b8';
      ctx.fillText(course.name + ' - ' + car.maker + ' ' + car.model, W / 2, H * 0.58);
    }

    if (raceState !== 'countdown') {
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + s * 0.072 + 'px "Arial Black", sans-serif';
      ctx.fillStyle = sectionTimeLeft < 5 ? '#ff3d5e' : '#f2d048';
      ctx.fillText(Math.max(0, sectionTimeLeft).toFixed(1), W / 2, pad + s * 0.065);
      ctx.font = 'bold ' + s * 0.019 + 'px sans-serif';
      ctx.fillStyle = '#8b93b8';
      const secName = sectionIdx < sectionEnds.length ? sectionEnds[sectionIdx].name : 'FINISH';
      ctx.fillText('SECTION ' + Math.min(sectionIdx + 1, sectionEnds.length) + '/' + sectionEnds.length + '  ' + secName, W / 2, pad + s * 0.09);
      ctx.fillStyle = '#e8eaf6';
      ctx.font = 'bold ' + s * 0.027 + 'px sans-serif';
      ctx.fillText('TOTAL ' + fmtTime(totalTime), W / 2, pad + s * 0.124);
      const bw = Math.min(W * 0.6, 420), bh = 5;
      const bx = W / 2 - bw / 2, by = pad + s * 0.142;
      ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = '#3de8ff'; ctx.fillRect(bx, by, bw * Math.min(1, posZ / finishZ), bh);
      ctx.fillStyle = '#fff';
      for (const se of sectionEnds) ctx.fillRect(bx + bw * se.z / finishZ - 1, by - 2, 2, bh + 4);
    }

    // ---- タコメーター ----
    const tx = IS_TOUCH ? buttonRects().brake.x - s * 0.16 : W - s * 0.16;
    const ty = H - s * 0.18;
    const tr = s * 0.105;
    const a0 = Math.PI * 0.75, a1 = Math.PI * 2.25;
    const rpmN = ph ? Math.min(1.02, rpm / ph.redline) : 0;
    ctx.lineWidth = s * 0.017;
    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    ctx.beginPath(); ctx.arc(tx, ty, tr, a0, a1); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,61,94,.25)';
    ctx.beginPath(); ctx.arc(tx, ty, tr, a0 + (a1 - a0) * 0.90, a1); ctx.stroke();
    ctx.strokeStyle = rpmN > 0.92 ? '#ff3d5e' : '#3de8ff';
    ctx.beginPath(); ctx.arc(tx, ty, tr, a0, a0 + (a1 - a0) * rpmN); ctx.stroke();
    // 目盛り
    ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 1.5;
    if (ph) {
      for (let k = 0; k <= Math.floor(ph.redline / 1000); k++) {
        const t = (k * 1000) / ph.redline;
        if (t > 1.02) break;
        const ang = a0 + (a1 - a0) * t;
        ctx.beginPath();
        ctx.moveTo(tx + Math.cos(ang) * tr * 0.78, ty + Math.sin(ang) * tr * 0.78);
        ctx.lineTo(tx + Math.cos(ang) * tr * 0.9, ty + Math.sin(ang) * tr * 0.9);
        ctx.stroke();
      }
    }
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = 'italic bold ' + s * 0.058 + 'px "Arial Black", sans-serif';
    ctx.fillText(Math.floor(kmh), tx, ty + s * 0.014);
    ctx.font = 'bold ' + s * 0.018 + 'px sans-serif';
    ctx.fillStyle = '#8b93b8';
    ctx.fillText('km/h', tx, ty + s * 0.042);
    ctx.fillStyle = wheelspin > 0.2 ? '#ff3d5e' : '#f2d048';
    ctx.font = 'italic bold ' + s * 0.034 + 'px "Arial Black", sans-serif';
    ctx.fillText(gear, tx, ty - s * 0.043);
    ctx.font = 'bold ' + s * 0.014 + 'px sans-serif';
    ctx.fillStyle = '#8b93b8';
    ctx.fillText(sel.mt ? '6MT' : 'AT', tx, ty - s * 0.026);
    ctx.font = 'bold ' + s * 0.015 + 'px sans-serif';
    ctx.fillStyle = '#7f89ad';
    ctx.fillText((rpm / 1000).toFixed(1) + ' ×1000rpm', tx, ty + s * 0.068);
    if (sel.mt && ph) {
      if (rpm > ph.redline * 0.95 && gear < 6) {
        ctx.fillStyle = Math.floor(performance.now() / 130) % 2 ? '#ff3d5e' : '#ffd048';
        ctx.font = 'bold ' + s * 0.02 + 'px sans-serif';
        ctx.fillText('▲ SHIFT UP', tx, ty - tr - s * 0.014);
      } else if (gear > 1 && vMs > 3 && rpm < ph.redline * 0.42 &&
                 rpmFromSpeed(vMs, gear - 1, ph) < ph.redline * 0.88) {
        // 壁ヒット等の大減速後、ギアが高すぎてトルクが出ない状態を知らせる
        ctx.fillStyle = Math.floor(performance.now() / 200) % 2 ? '#3de8ff' : '#8b93b8';
        ctx.font = 'bold ' + s * 0.02 + 'px sans-serif';
        ctx.fillText('▼ SHIFT DOWN', tx, ty - tr - s * 0.014);
      }
    }

    // ---- Gメーター ----
    // タッチ時は左下がステアリングホイールなので、その右隣に置く
    const wg = IS_TOUCH ? wheelGeom() : null;
    const gx = wg ? wg.cx + wg.r + s * 0.11 : pad + s * 0.062;
    const gy = H - pad - s * 0.062, gr = s * 0.055;
    ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(gx, gy, gr, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(gx, gy, gr * 0.5, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx - gr, gy); ctx.lineTo(gx + gr, gy);
    ctx.moveTo(gx, gy - gr); ctx.lineTo(gx, gy + gr); ctx.stroke();
    const gLat = Math.max(-1.6, Math.min(1.6, aLat / G));
    const gLon = Math.max(-1.6, Math.min(1.6, aLong / G));
    ctx.fillStyle = sliding > 0.3 ? '#ff3d5e' : '#3de8ff';
    ctx.beginPath();
    ctx.arc(gx + gLat / 1.6 * gr, gy - gLon / 1.6 * gr, Math.max(3, s * 0.009), 0, Math.PI * 2);
    ctx.fill();
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + s * 0.015 + 'px sans-serif';
    ctx.fillStyle = '#7f89ad';
    ctx.fillText(Math.hypot(gLat, gLon).toFixed(2) + ' G', gx, gy + gr + s * 0.026);

    // ---- 車名・警告 ----
    ctx.textAlign = 'left';
    ctx.font = 'bold ' + s * 0.02 + 'px sans-serif';
    ctx.fillStyle = '#8b93b8';
    if (IS_TOUCH) {
      ctx.fillText(car ? car.maker + ' ' + car.model + '  [' + car.dt + ']' : '', pad, pad + s * 0.028);
    } else {
      ctx.fillText(car ? car.maker + ' ' + car.model + '  [' + car.dt + ']' : '', pad + s * 0.13, H - pad - s * 0.005);
    }
    if (sliding > 0.3 || wheelspin > 0.3) {
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + s * 0.024 + 'px sans-serif';
      ctx.fillStyle = 'rgba(255,61,94,' + (0.5 + 0.5 * Math.sin(performance.now() / 90)) + ')';
      const msg = wheelspin > 0.3 ? 'WHEEL SPIN'
                : (understeer ? 'UNDER STEER' : 'OVER STEER');
      ctx.fillText(msg, W / 2, pad + s * 0.185);
    }

    let fy = H * 0.30;
    ctx.textAlign = 'center';
    for (const f of flashes) {
      ctx.globalAlpha = Math.min(1, f.t);
      ctx.font = 'italic bold ' + s * 0.05 * f.size + 'px "Arial Black", sans-serif';
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, W / 2, fy);
      fy += s * 0.055 * f.size;
    }
    ctx.globalAlpha = 1;
  }

  function drawTouchButtons() {
    const rects = buttonRects();
    for (const [name, r] of Object.entries(rects)) {
      const active = input[name];
      const isShift = name === 'sup' || name === 'sdown';
      ctx.fillStyle = active ? 'rgba(120,160,255,.42)' : 'rgba(30,38,70,.42)';
      ctx.strokeStyle = active ? 'rgba(160,200,255,.9)' : 'rgba(255,255,255,.26)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      if (isShift) {
        if (ctx.roundRect) ctx.roundRect(r.x, r.y, r.w, r.h, 10); else ctx.rect(r.x, r.y, r.w, r.h);
      } else {
        ctx.arc(r.x + r.w / 2, r.y + r.h / 2, Math.min(r.w, r.h) / 2, 0, Math.PI * 2);
      }
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + r.w * 0.16 + 'px sans-serif';
      ctx.fillText(r.label, r.x + r.w / 2, r.y + r.h / 2 + r.w * 0.05);
    }
    drawWheel();
  }

  // ステアリングホイールの描画
  function drawWheel() {
    const g = wheelGeom();
    const held = wheelPtr !== null;
    ctx.save();
    ctx.translate(g.cx, g.cy);
    ctx.rotate(wheelAngle);
    const rimW = g.r * 0.24;
    // リム
    ctx.lineWidth = rimW;
    ctx.strokeStyle = held ? 'rgba(56,70,120,.80)' : 'rgba(34,42,76,.62)';
    ctx.beginPath(); ctx.arc(0, 0, g.r - rimW / 2, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 2;
    ctx.strokeStyle = held ? 'rgba(160,200,255,.9)' : 'rgba(255,255,255,.30)';
    ctx.beginPath(); ctx.arc(0, 0, g.r, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, g.r - rimW, 0, Math.PI * 2); ctx.stroke();
    // スポーク(左・右・下)
    ctx.lineWidth = rimW * 0.55;
    ctx.strokeStyle = held ? 'rgba(70,84,136,.85)' : 'rgba(44,52,88,.7)';
    ctx.lineCap = 'round';
    for (const a of [Math.PI, 0, Math.PI / 2]) {
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * g.r * 0.18, Math.sin(a) * g.r * 0.18);
      ctx.lineTo(Math.cos(a) * (g.r - rimW), Math.sin(a) * (g.r - rimW));
      ctx.stroke();
    }
    ctx.lineCap = 'butt';
    // ハブ
    ctx.fillStyle = held ? 'rgba(56,70,120,.9)' : 'rgba(34,42,76,.8)';
    ctx.beginPath(); ctx.arc(0, 0, g.r * 0.20, 0, Math.PI * 2); ctx.fill();
    // センターマーカー(回転が分かる赤ストライプ)
    ctx.fillStyle = '#ff3d5e';
    ctx.fillRect(-rimW * 0.18, -g.r, rimW * 0.36, rimW);
    ctx.restore();
    // 舵角表示
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + g.r * 0.16 + 'px sans-serif';
    ctx.fillStyle = 'rgba(139,147,184,.9)';
    ctx.fillText(Math.round(wheelAngle * 57.3) + '°', g.cx, g.cy + g.r + g.r * 0.22);
  }

  // ================= ループ =================
  function loop(time) {
    if (!running) return;
    const dt = Math.max(0, Math.min(0.05, (time - lastTime) / 1000));
    lastTime = time;
    update(dt);
    if (running) { render(); requestAnimationFrame(loop); }
  }

  // ================= UI =================
  function el(id) { return document.getElementById(id); }
  function buildMakerChips() {
    const box = el('makerChips'); box.innerHTML = '';
    MAKERS.forEach((mk, i) => {
      const b = document.createElement('button');
      b.className = 'chip' + (i === sel.maker ? ' on' : '');
      b.textContent = mk.name;
      b.onclick = () => { sel.maker = i; sel.model = 0; buildMakerChips(); buildModelList(); refreshPreview(); };
      box.appendChild(b);
    });
  }
  function buildModelList() {
    const box = el('modelList'); box.innerHTML = '';
    MAKERS[sel.maker].models.forEach((md, i) => {
      const b = document.createElement('button');
      b.className = 'caritem' + (i === sel.model ? ' on' : '');
      b.innerHTML = '<span class="nm">' + md.n + '</span>' +
        '<span class="ps"><span class="dt">' + md.dt + '</span> ' + md.ps + 'PS</span>';
      b.onclick = () => { sel.model = i; buildModelList(); refreshPreview(); };
      box.appendChild(b);
    });
  }
  function buildTuneChips() {
    const box = el('tuneChips'); box.innerHTML = '';
    TUNES.forEach((tn, i) => {
      const b = document.createElement('button');
      b.className = 'chip' + (i === sel.tune ? ' on' : '');
      b.textContent = tn.label;
      b.onclick = () => { sel.tune = i; buildTuneChips(); refreshPreview(); };
      box.appendChild(b);
    });
  }
  function buildSwatches() {
    const box = el('swatches'); box.innerHTML = '';
    BODY_COLORS.forEach((bc, i) => {
      const b = document.createElement('button');
      b.className = 'sw' + (i === sel.color ? ' on' : '');
      b.style.background = bc.c; b.title = bc.n;
      b.onclick = () => { sel.color = i; buildSwatches(); refreshPreview(); };
      box.appendChild(b);
    });
  }
  function buildMtChips() {
    const box = el('mtChips'); box.innerHTML = '';
    [{ l: '6速MT', v: true }, { l: 'AT', v: false }].forEach(o => {
      const b = document.createElement('button');
      b.className = 'chip' + (sel.mt === o.v ? ' on' : '');
      b.textContent = o.l;
      b.onclick = () => { sel.mt = o.v; buildMtChips(); refreshPreview(); };
      box.appendChild(b);
    });
  }
  function buildAssistChips() {
    const box = el('assistChips'); box.innerHTML = '';
    [{ l: 'アシストON', v: true }, { l: 'アシストOFF', v: false }].forEach(o => {
      const b = document.createElement('button');
      b.className = 'chip' + (sel.assist === o.v ? ' on' : '');
      b.textContent = o.l;
      b.title = 'ON: 安定化+舵の丸め込みで簡単に走れる / OFF: 素の物理';
      b.onclick = () => { sel.assist = o.v; buildAssistChips(); };
      box.appendChild(b);
    });
  }
  function refreshPreview() {
    const c = currentCar(), p = c.ph;
    const pv = el('preview'), pctx = pv.getContext('2d');
    pctx.clearRect(0, 0, pv.width, pv.height);
    const g = pctx.createLinearGradient(0, 0, 0, pv.height);
    g.addColorStop(0, '#0c1226'); g.addColorStop(1, '#05060f');
    pctx.fillStyle = g; pctx.fillRect(0, 0, pv.width, pv.height);
    pctx.fillStyle = '#14161f'; pctx.fillRect(0, pv.height - 26, pv.width, 26);
    drawCarSprite(pctx, pv.width / 2, pv.height - 18, 150, c.type, c.color, { wing: sel.tune === 2 });
    // 物理値から導いた実性能
    const pwr = c.ps / (p.mass / 1000);                    // PS/t
    const maxG = p.mu * (1 + p.dfK * 60 * 60 / (p.mass * G)); // 200km/h時の横G目安
    const r80 = Math.sqrt(p.mu * G * 120) * 3.6;           // R120mコーナー通過速度
    el('statBox').innerHTML =
      row('出力', Math.min(100, c.ps / 8.5), c.ps + ' PS') +
      row('車重', Math.min(100, (2800 - p.mass) / 20), p.mass + ' kg') +
      row('パワーウェイト', Math.min(100, pwr / 8), pwr.toFixed(0) + ' PS/t') +
      row('最高速', Math.min(100, (c.top - 120) / 2.6), c.top + ' km/h') +
      row('タイヤグリップ', Math.min(100, (p.mu - 0.8) * 160), p.mu.toFixed(2) + ' μ') +
      row('ダウンフォース', Math.min(100, p.dfK * 200), (p.dfK * 60 * 60).toFixed(0) + ' N') +
      row('R120m通過', Math.min(100, (r80 - 60) / 1.2), r80.toFixed(0) + ' km/h');
  }
  function row(lb, pct, vl) {
    return '<div class="statrow"><span class="lb">' + lb + '</span><div class="bar"><i style="width:' +
      Math.max(2, Math.min(100, pct)) + '%"></i></div><span class="vl">' + vl + '</span></div>';
  }
  function buildCourseList() {
    const box = el('courseList'); box.innerHTML = '';
    COURSES.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'courseitem' + (i === sel.course ? ' on' : '');
      const best = loadBest(c.id);
      b.innerHTML =
        '<div class="cn">' + c.name + ' <span style="color:#8b93b8;font-size:12px;">' + c.len + ' / ' + c.sections.length + 'セクション</span></div>' +
        '<div class="cd">' + c.desc + '</div>' +
        (best ? '<div class="bt">コースレコード ' + fmtTime(best.time) + ' - ' + best.car + '</div>'
              : '<div class="bt" style="color:#5c6488">記録なし</div>');
      b.onclick = () => { sel.course = i; buildCourseList(); };
      box.appendChild(b);
    });
  }
  function openGarage() {
    buildMakerChips(); buildModelList(); buildTuneChips(); buildSwatches(); buildMtChips(); buildAssistChips(); refreshPreview();
    showScreen('garage');
  }
  el('btn-title').onclick = () => { tryLandscape(); openGarage(); };
  el('btn-garage-back').onclick = () => showScreen('title');
  el('btn-garage-next').onclick = () => { saveGarage(); buildCourseList(); showScreen('course'); };
  el('btn-course-back').onclick = () => openGarage();
  el('btn-course-start').onclick = () => { lastBeep = -1; tryLandscape(); startRace(); };
  el('btn-retry').onclick = () => { lastBeep = -1; tryLandscape(); startRace(); };
  el('btn-res-course').onclick = () => { buildCourseList(); showScreen('course'); };
  el('btn-res-garage').onclick = () => openGarage();

  el('titleDesc').innerHTML =
    'ハンドル・アクセル・ブレーキ・6速ミッションを駆使し、<br>' +
    '国内外' + MAKERS.length + 'メーカー・' + TOTAL_CARS + '車種から選んだ愛車で<br>' +
    '実在の都市高速を舞台に300km/hオーバーの走りに挑む。<br><br>' +
    '他の車もライバルも一切いない深夜のコースを単独走行。<br>' +
    'セクション毎の規定時間を守りながら、<br>' +
    '自分の限界=最速トータルタイムを追い求めるストイックなモード。' +
    (IS_TOUCH
      ? '<br><br>[操作] 画面左半分を左右にドラッグするとハンドルが回る<br>(離すと自動でセンターへ)。右手で ACCEL / BRAKE / SHIFT±'
      : '<br><br>[操作] ←→ハンドル / ↑アクセル / ↓ブレーキ / X・Space シフトアップ / Z シフトダウン');

  // テスト用フック
  window.__mh = () => {
    const look = [];
    const bi = findSegment(posZ).index;
    for (let d = 0; d < 90; d++) {
      const s = segments[Math.min(segments.length - 1, bi + d)];
      look.push({ d: d * SEG_LEN / M2U, R: isFinite(s.radius) ? s.radius : 99999 });
    }
    return {
      posX, posZ, kmh: vMs * 3.6, vMs, gear, rpm, redline: ph ? ph.redline : 0,
      heading, raceState, sectionIdx, totalTime, finishZ, sliding, wheelspin, scraping,
      wheelAngle, steerIn, posXm: posX,
      mu: ph ? ph.mu : 0, mass: ph ? ph.mass : 0, dfK: ph ? ph.dfK : 0,
      halfRoad: HALF_ROAD_M, look,
      nTraffic: traffic.length, nSigns: signs.length, nHaz: hazards.length,
      nextSpawn: nextSpawnZ / M2U,
      trafficAhead: traffic.filter(t => t.z > posZ && t.z < posZ + 400 * M2U)
                           .map(t => ({ d: Math.round((t.z - posZ) / M2U), x: +t.x.toFixed(1), kmh: Math.round(t.speed * 3.6) })),
    };
  };

  // 初期プレビュー
  buildCourse(COURSES[0]);
  car = currentCar(); ph = car.ph;
  posZ = 300 * M2U;
  render();
  showScreen('title');
})();
</script>
</body>
</html>

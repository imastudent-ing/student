<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05060f">
<title>MIDNIGHT HIGHWAY - 首都高タイムアタック</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #05060f;
    color: #e8eaf6;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #rotor { position: fixed; inset: 0; }
  #rotor.rot {
    inset: auto; top: 0; left: 0;
    transform-origin: top left;
    transform: rotate(90deg) translate(0, -100%);
  }
  canvas#game { position: fixed; inset: 0; display: block; touch-action: none; }
  #muteBtn {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    right: max(10px, env(safe-area-inset-right));
    z-index: 40;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(20,26,48,.6);
    color: #fff; font-size: 17px; cursor: pointer;
  }
  .screen {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(5,6,15,.86);
    backdrop-filter: blur(4px);
    display: flex; flex-direction: column;
    align-items: center;
    overflow-y: auto;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  .screen.hidden { display: none; }
  .logo {
    font-size: clamp(26px, 7vw, 44px);
    font-weight: bold; font-style: italic; letter-spacing: 3px;
    background: linear-gradient(90deg, #3de8ff, #6c8cff, #ff3d8f);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center; line-height: 1.2;
    margin: 24px 0 4px;
  }
  .sublogo { color: #8b93b8; letter-spacing: 6px; font-size: clamp(11px, 3vw, 14px); margin-bottom: 20px; }
  .desc { color: #aab2d0; font-size: clamp(12px, 3.2vw, 14px); line-height: 2; text-align: center; max-width: 540px; }
  button.main {
    background: linear-gradient(135deg, #3d6bff, #b53dff);
    color: #fff; border: none; border-radius: 999px;
    padding: 15px 52px; font-size: 17px; font-weight: bold; letter-spacing: 3px;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 6px 30px rgba(90,90,255,.4);
    margin-top: 22px;
  }
  button.main:active { transform: scale(.95); }
  button.sub {
    background: #1a2038; color: #cfd6f2;
    border: 1px solid #2c3354; border-radius: 999px;
    padding: 10px 24px; font-size: 13px; font-weight: bold;
    cursor: pointer; font-family: inherit;
  }
  h2.sec { font-size: 15px; letter-spacing: 3px; color: #8b93b8; margin: 18px 0 8px; align-self: flex-start; }
  .wrapcol { width: 100%; max-width: 640px; display: flex; flex-direction: column; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; width: 100%; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    background: #141a30; border: 1px solid #2c3354; border-radius: 999px;
    color: #cfd6f2; padding: 8px 16px; font-size: 13px; font-weight: bold;
    cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .chip.on { background: #2b3f86; border-color: #6c8cff; color: #fff; }
  .carlist { display: flex; flex-direction: column; gap: 6px; max-height: 250px; overflow-y: auto; width: 100%; }
  .caritem {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    background: #12172b; border: 1px solid #232a4a; border-radius: 10px;
    padding: 10px 14px; cursor: pointer; font-family: inherit; color: #e8eaf6;
    text-align: left; width: 100%;
  }
  .caritem.on { background: #223066; border-color: #6c8cff; }
  .caritem .nm { font-size: 14px; font-weight: bold; }
  .caritem .ps { font-size: 12px; color: #8b93b8; white-space: nowrap; }
  .caritem .dt { font-size: 10px; color: #6c8cff; border: 1px solid #2c3354; border-radius: 4px; padding: 1px 5px; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #2c3354; cursor: pointer; }
  .sw.on { border-color: #fff; box-shadow: 0 0 0 2px #6c8cff; }
  .statrow { display: flex; align-items: center; gap: 10px; margin: 4px 0; font-size: 12px; }
  .statrow .lb { width: 96px; color: #8b93b8; }
  .statrow .bar { flex: 1; height: 8px; background: #141a30; border-radius: 4px; overflow: hidden; }
  .statrow .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #3de8ff, #b53dff); border-radius: 4px; }
  .statrow .vl { width: 86px; text-align: right; color: #e8eaf6; font-weight: bold; font-variant-numeric: tabular-nums; }
  #preview { background: #0a0d1a; border: 1px solid #232a4a; border-radius: 10px; margin: 8px auto; display: block; }
  .courselist { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .courseitem {
    background: #12172b; border: 1px solid #232a4a; border-radius: 12px;
    padding: 14px 16px; cursor: pointer; font-family: inherit; color: #e8eaf6;
    text-align: left; width: 100%;
  }
  .courseitem.on { background: #223066; border-color: #6c8cff; }
  .courseitem .cn { font-size: 16px; font-weight: bold; }
  .courseitem .cd { font-size: 12px; color: #8b93b8; margin-top: 4px; line-height: 1.7; }
  .courseitem .bt { font-size: 12px; color: #f2d048; margin-top: 4px; }
  table.result { border-collapse: collapse; margin-top: 10px; width: 100%; max-width: 480px; }
  table.result td, table.result th { padding: 7px 10px; font-size: 14px; border-bottom: 1px solid #232a4a; }
  table.result th { color: #8b93b8; font-weight: normal; text-align: left; font-size: 12px; letter-spacing: 2px; }
  table.result td.tm { text-align: right; font-variant-numeric: tabular-nums; font-weight: bold; }
  .total { font-size: clamp(26px, 7vw, 40px); font-weight: bold; font-style: italic; color: #f2d048; margin-top: 14px; font-variant-numeric: tabular-nums; }
  .record { color: #ff3d8f; font-weight: bold; letter-spacing: 2px; margin-top: 6px; }
  .btnrow { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
  .note { font-size: 11px; color: #5c6488; margin-top: 14px; text-align: center; line-height: 1.8; }
  .selrow { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="rotor">
<canvas id="game"></canvas>
<button id="muteBtn">🔊</button>

<!-- タイトル -->
<div class="screen" id="scr-title">
  <div class="logo">MIDNIGHT<br>HIGHWAY</div>
  <div class="sublogo">首都高 TIME ATTACK</div>
  <div class="desc" id="titleDesc"></div>
  <button class="main" id="btn-title">GAME START</button>
  <div class="note">実物理シミュレーション搭載。摩擦円・空気抵抗・荷重移動・バンクを再現。<br>コーナーはブレーキングとギア選択で攻略せよ。</div>
</div>

<!-- 車両選択 -->
<div class="screen hidden" id="scr-garage">
  <div class="wrapcol">
    <div class="logo" style="font-size:22px;margin:8px 0 0;">CAR SELECT</div>
    <h2 class="sec">MAKER</h2>
    <div class="chips" id="makerChips"></div>
    <h2 class="sec">MODEL</h2>
    <div class="carlist" id="modelList"></div>
    <h2 class="sec">TUNE</h2>
    <div class="selrow" id="tuneChips"></div>
    <h2 class="sec">COLOR / MISSION / ASSIST</h2>
    <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;">
      <div class="swatches" id="swatches"></div>
      <div class="selrow" id="mtChips"></div>
      <div class="selrow" id="assistChips"></div>
    </div>
    <canvas id="preview" width="300" height="150"></canvas>
    <div id="statBox"></div>
    <div class="btnrow">
      <button class="sub" id="btn-garage-back">← タイトル</button>
      <button class="main" style="margin-top:0;" id="btn-garage-next">コース選択へ →</button>
    </div>
  </div>
</div>

<!-- コース選択 -->
<div class="screen hidden" id="scr-course">
  <div class="wrapcol">
    <div class="logo" style="font-size:22px;margin:8px 0 0;">COURSE SELECT</div>
    <h2 class="sec">実在都市高速 4コース</h2>
    <div class="courselist" id="courseList"></div>
    <div class="btnrow">
      <button class="sub" id="btn-course-back">← クルマ選択</button>
      <button class="main" style="margin-top:0;" id="btn-course-start">タイムアタック開始</button>
    </div>
  </div>
</div>

<!-- リザルト -->
<div class="screen hidden" id="scr-result">
  <div class="logo" style="font-size:26px;" id="resTitle">RESULT</div>
  <div class="desc" id="resCar"></div>
  <table class="result"><tbody id="resBody"></tbody></table>
  <div class="total" id="resTotal"></div>
  <div class="record hidden" id="resRecord">★ NEW RECORD ★</div>
  <div class="desc" id="resBest" style="margin-top:6px;"></div>
  <div class="btnrow">
    <button class="main" style="margin-top:0;" id="btn-retry">リトライ</button>
    <button class="sub" id="btn-res-course">コース選択</button>
    <button class="sub" id="btn-res-garage">クルマ選択</button>
  </div>
</div>
</div><!-- /rotor -->

<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const IS_TOUCH = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

  let W = 0, H = 0, DPR = 1, ROT = false, horizonY = 0, PROJ_K = 1;

  // ================= 世界の単位 =================
  // 1m = M2U 内部単位。SEG_LEN は 1 セグメントの長さ。
  const M2U = 223.2;
  const SEG_LEN = 5 * M2U;              // 5m/セグメント
  const ROAD_HW = 9.0 * M2U;            // 路面半幅 9m (3車線+路肩)
  const LANES = 3;
  const CAMERA_H = 2.45 * M2U;          // 視点高 2.45m(ルーフ面が見えて立体感が出る)
  const CAMERA_BACK = 8.6 * M2U;        // 自車の後方 8.6m にカメラ
  const CAMERA_DEPTH = 1.55;            // 画角(値が小さいほど広角)
  const DRAW_DIST = 140;                // 700m 先まで描画
  const NEAR_DETAIL = 70;               // 詳細描画するセグメント数
  const DECK_H = 1.6 * M2U;             // 高架桁の厚み
  const G = 9.81;                       // 重力加速度 m/s^2
  const RHO = 1.225;                    // 空気密度 kg/m^3
  // curve値 -> コーナー半径(m)。
  // 描画側は横位置を curve*n^2/2 (内部単位) で積算するので、円弧 y=z^2/(2R) と
  // 突き合わせると R = SEG_LEN^2 / (M2U * curve) [m] になる。
  const RADIUS_K = (SEG_LEN * SEG_LEN) / M2U;
  const GEARS = [3.83, 2.31, 1.62, 1.27, 1.00, 0.79];
  const DRIVE_EFF = 0.88;
  const SHIFT_TIME = 0.24;
  const MIN_TURN_R = 11;                // 最小旋回半径(ステア切れ角の限界) m

  // ================= 車種データ =================

  const MAKERS = [

      { n: 'フェアレディZ (Z33)',   ps: 280, top: 268, ac: .69, hd: .72, type: 'coupe',   dt: 'FR' },
      { n: 'スカイラインGT-R (R32)', ps: 280, top: 270, ac: .73, hd: .74, type: 'coupe',  dt: 'AWD' },

      { n: 'GT-R (R35)',            ps: 570, top: 310, ac: .88, hd: .82, type: 'coupe',  dt: 'AWD' },
      { n: 'シルビア (S15)',        ps: 250, top: 245, ac: .62, hd: .76, type: 'coupe',  dt: 'FR' },
      { n: '180SX',                 ps: 205, top: 235, ac: .58, hd: .72, type: 'hatch',  dt: 'FR' },
    ]},
    { name: 'TOYOTA', models: [
      { n: 'スープラ (A70)',       ps: 280, top: 262, ac: .68, hd: .62, type: 'coupe', dt: 'FR' },
      { n: 'スープラ (A80)',       ps: 280, top: 280, ac: .76, hd: .70, type: 'coupe', dt: 'FR' },
      { n: 'アリスト V300',        ps: 280, top: 258, ac: .66, hd: .58, type: 'sedan', dt: 'FR' },
      { n: 'チェイサー ツアラーV',  ps: 280, top: 252, ac: .64, hd: .64, type: 'sedan', dt: 'FR' },
      { n: 'スプリンタートレノ AE86', ps: 130, top: 195, ac: .40, hd: .80, type: 'hatch', dt: 'FR' },
      { n: 'ソアラ 2.5GT-T',       ps: 280, top: 255, ac: .63, hd: .60, type: 'coupe', dt: 'FR' },
      { n: 'ダイナ (働くクルマ)',   ps: 130, top: 145, ac: .30, hd: .38, type: 'truck', dt: 'FR' },
    ]},
    { name: 'MAZDA', models: [
      { n: 'RX-7 (FC3S)', ps: 205, top: 240, ac: .60, hd: .76, type: 'coupe', dt: 'FR' },
      { n: 'RX-7 (FD3S)', ps: 280, top: 265, ac: .70, hd: .84, type: 'coupe', dt: 'FR' },
      { n: 'RX-8',        ps: 250, top: 240, ac: .58, hd: .78, type: 'coupe', dt: 'FR' },
      { n: 'ロードスター (NA)', ps: 130, top: 190, ac: .42, hd: .86, type: 'hatch', dt: 'FR' },
    ]},
    { name: 'HONDA', models: [
      { n: 'NSX (NA1)',        ps: 280, top: 272, ac: .70, hd: .84, type: 'super', dt: 'MR' },
      { n: 'S2000 (AP1)',      ps: 250, top: 242, ac: .60, hd: .84, type: 'coupe', dt: 'FR' },
      { n: 'インテグラ TypeR', ps: 200, top: 230, ac: .56, hd: .82, type: 'hatch', dt: 'FF' },

    ]},
    { name: 'SUBARU', models: [
      { n: 'インプレッサ WRX STI (GC8)', ps: 280, top: 250, ac: .68, hd: .78, type: 'sedan', dt: 'AWD' },

    { name: 'MITSUBISHI', models: [

      { n: 'ランサーエボリューション IX', ps: 280, top: 256, ac: .72, hd: .82, type: 'sedan', dt: 'AWD' },
      { n: 'GTO ツインターボ',           ps: 280, top: 260, ac: .66, hd: .60, type: 'coupe', dt: 'AWD' },

    { name: 'PORSCHE', models: [
      { n: '911ターボ (930)', ps: 300, top: 278, ac: .70, hd: .64, type: 'coupe', dt: 'FR' },
      { n: '911ターボ (964)', ps: 360, top: 290, ac: .76, hd: .72, type: 'coupe', dt: 'AWD' },
      { n: '911 GT2 (996)',   ps: 462, top: 305, ac: .82, hd: .78, type: 'coupe', dt: 'FR' },
    ]},
    { name: 'BMW', models: [
      { n: 'M3 (E36)', ps: 321, top: 262, ac: .66, hd: .76, type: 'coupe', dt: 'FR' },
      { n: 'M5 (E39)', ps: 400, top: 275, ac: .72, hd: .68, type: 'sedan', dt: 'FR' },
    ]},
    { name: 'MERCEDES', models: [
      { n: '190E 2.5-16 EVO II', ps: 235, top: 248, ac: .58, hd: .70, type: 'sedan', dt: 'FR' },
      { n: 'SL600 (R129)',       ps: 394, top: 268, ac: .66, hd: .58, type: 'coupe', dt: 'FR' },
    ]},
    { name: 'FERRARI', models: [
      { n: 'テスタロッサ', ps: 390, top: 290, ac: .76, hd: .68, type: 'super', dt: 'MR' },
      { n: 'F40',         ps: 478, top: 315, ac: .86, hd: .74, type: 'super', dt: 'MR' },
    ]},
    { name: 'LAMBORGHINI', models: [
      { n: 'カウンタック LP400', ps: 375, top: 285, ac: .72, hd: .60, type: 'super', dt: 'MR' },
      { n: 'ディアブロ GT',      ps: 575, top: 320, ac: .86, hd: .66, type: 'super', dt: 'AWD' },
    ]},
    { name: 'AUDI', models: [
      { n: 'RS4 (B5)', ps: 380, top: 262, ac: .70, hd: .74, type: 'sedan', dt: 'AWD' },
    ]},
    { name: 'CHEVROLET', models: [
      { n: 'コルベット (C5)', ps: 345, top: 280, ac: .72, hd: .64, type: 'coupe', dt: 'FR' },
    ]},
    { name: 'DODGE', models: [
      { n: 'バイパー GTS', ps: 450, top: 295, ac: .80, hd: .58, type: 'super', dt: 'FR' },
    ]},
  ];
  const TOTAL_CARS = MAKERS.reduce((a, m) => a + m.models.length, 0) * TUNES.length;

  const BODY_COLORS = [
    { n: 'ホワイト', c: '#eef0f5' }, { n: 'ブラック', c: '#181a22' },
    { n: 'レッド', c: '#c8102e' },   { n: 'ブルー', c: '#2456d8' },
    { n: 'イエロー', c: '#f2d048' }, { n: 'シルバー', c: '#aab2c0' },
    { n: 'ミッドナイトパープル', c: '#3a2a5e' }, { n: 'ガンメタ', c: '#3c414d' },
  ];

  // ================= 物理パラメータ生成 =================
  const TYPE_MASS = { classic: 1180, coupe: 1420, sedan: 1490, hatch: 1060, super: 1350, truck: 2400 };
  const TYPE_CDA  = { classic: 0.74, coupe: 0.64, sedan: 0.68, hatch: 0.66, super: 0.60, truck: 1.95 };
  const DRIVE_FRAC = { AWD: 0.95, MR: 0.70, FR: 0.56, FF: 0.46 };
  // 前輪荷重配分 / 駆動力の後輪配分 / 重心高
  const FRONT_WEIGHT = { AWD: 0.56, MR: 0.42, FR: 0.53, FF: 0.62 };
  const REAR_DRIVE   = { AWD: 0.60, MR: 1.00, FR: 1.00, FF: 0.00 };
  const WHEELBASE    = { classic: 2.30, coupe: 2.55, sedan: 2.70, hatch: 2.45, super: 2.50, truck: 2.53 };
  const CG_HEIGHT    = { classic: 0.50, coupe: 0.48, sedan: 0.52, hatch: 0.52, super: 0.42, truck: 0.95 };

  function buildPhysics(c) {
    const mass = TYPE_MASS[c.type] || 1400;
    const CdA = TYPE_CDA[c.type] || 0.66;
    const powerW = c.ps * 735.5;
    const redline = c.type === 'truck' ? 4300 : (c.type === 'classic' ? 7200 : 7900);
    const idle = 850;
    const wheelR = c.type === 'truck' ? 0.38 : 0.33;
    const topMs = c.top / 3.6;
    // 6速レブリミット時に最高速をわずかに超えるファイナルギア比
    const finalDrive = (redline * Math.PI / 30) * wheelR / (topMs * 1.02) / GEARS[5];
    // タイヤグリップ係数
    const mu = Math.min(1.42, 0.90 + c.hd * 0.34 + c.tuneGrip);
    // ダウンフォース係数 N/(m/s)^2
    const dfBase = { super: 0.22, coupe: 0.10, sedan: 0.08, hatch: 0.06, classic: 0.02, truck: 0 }[c.type] || 0.08;
    const dfK = dfBase + c.tuneDf;
    // 最大トルク(出力カーブから逆算)
    const xPeak = 0.80;
    const tShape = 1 - 2.222 * Math.pow(xPeak - 0.55, 2);
    const Tmax = powerW / (tShape * xPeak * redline * Math.PI / 30);
    // --- 二輪(バイシクル)モデルの諸元 ---
    const L = WHEELBASE[c.type] || 2.55;
    const fw = FRONT_WEIGHT[c.dt] || 0.53;
    const b = L * fw;            // 重心~後軸(前輪荷重が大きいほど重心は前)
    const a = L - b;             // 重心~前軸
    const Iz = mass * L * L * 0.32;
    const hCG = CG_HEIGHT[c.type] || 0.48;
    // タイヤのコーナリング係数(垂直荷重あたり)。シャシー性能が高いほど応答が鋭い
    const kC = 11 + c.hd * 7;
    return {

      Crr: 0.014,
      driveFrac: DRIVE_FRAC[c.dt] || 0.56,

  // 正規化スリップ(スリップ/ピークスリップ)に対する摩擦利用率を返す。
  // ピークを超えると力が落ちるため、滑り出すと本当に姿勢が破綻し、
  // 滑りを収めればグリップが戻る(実タイヤと同じ挙動)。
  function tireCurve(sn) {
    const s = Math.abs(sn);
    const f = s <= 1
      ? Math.sin(Math.PI / 2 * s)
      : 1 - 0.28 * (1 - Math.exp(-(s - 1) * 0.9));
    return sn < 0 ? -f : f;

  function muAtLoad(mu, Fz, FzRef) {
    return mu * Math.max(0.62, 1.10 - 0.10 * (Fz / Math.max(1, FzRef)));
  }
  // 左右荷重移動を考慮した1軸の横グリップ上限(N)

    const l = Math.max(60, Fz / 2 - dFz), r = Math.max(60, Fz / 2 + dFz);
    return muAtLoad(mu, l, FzRef / 2) * l + muAtLoad(mu, r, FzRef / 2) * r;
  }

    return ph.Tmax * Math.max(0.18, t);

  // ================= コース構築 =================
  let segments = [], sectionEnds = [], finishZ = 0, course = null;

  function buildCourse(c) {
    course = c;
    segments = [];
    sectionEnds = [];
    let secStartZ = 0;
    for (const sec of c.sections) {
      for (const p of sec.pieces) {
        const [lenM, curve, hill, flag] = p;
        const count = Math.max(2, Math.round(lenM * M2U / SEG_LEN));
        const startY = segments.length ? segments[segments.length - 1].p2y : 0;
        const rise = lenM * (hill / 100) * M2U;
        for (let i = 0; i < count; i++) {
          const t = i / count;
          const ease = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
          const cv = curve * ease;
          segments.push({
            curve: cv,
            bank: cv * 0.0058,                       // バンク角(rad)
            radius: radiusOf(cv),
            p1y: startY + rise * (i / count),
            p2y: startY + rise * ((i + 1) / count),
            tunnel: flag === 't',
            bridge: flag === 'b' || flag === 'bw',
            tower: flag === 'bw' && i === Math.floor(count / 2),
          });
        }
      }
      const endZ = segments.length * SEG_LEN;
      sectionEnds.push({
        z: endZ, name: sec.name,
        limit: Math.round((endZ - secStartZ) / M2U / (sec.avg / 3.6) * 10) / 10,
      });
      secStartZ = endZ;
    }
    finishZ = segments.length * SEG_LEN;
    const lastY = segments[segments.length - 1].p2y;
    for (let i = 0; i < 120; i++) {
      segments.push({ curve: 0, bank: 0, radius: Infinity, p1y: lastY, p2y: lastY, tunnel: false });
    }
    segments.forEach((s, i) => {
      s.index = i; s.z = i * SEG_LEN;
      s.checkpoint = sectionEnds.some(se => se.z === s.z);
      s.finish = s.z === finishZ;
    });
    buildSigns(c);
    // 工事規制の位置に当たり判定を持たせる
    for (const h of hazards) {
      for (let k = 0; k < h.len; k++) {
        const s = segments[h.i + k];
        if (s) s.cone = h.side;
      }
    }
  }
  // curve値 -> コーナー半径(m)
  function radiusOf(curve) {
    return curve ? RADIUS_K / Math.abs(curve) : Infinity;
  }

  // ---- 標識と工事規制をコース形状から自動生成する ----
  let signs = [], hazards = [], signAt = {};
  function buildSigns(c) {
    signs = [];
    hazards = [];
    signAt = {};
    const segPerM = M2U / SEG_LEN;
    let inCorner = false;
    for (let i = 2; i < segments.length; i++) {
      const s = segments[i];
      const tight = Math.abs(s.curve) > 8;
      if (tight && !inCorner) {
        inCorner = true;
        // コーナーの手前に警戒標識(R が小さいほど手前に出す)
        const R = s.radius;
        const lead = Math.round((R < 250 ? 150 : 95) * segPerM);
        const at = i - lead;
        if (at > 6 && !segments[at].tunnel) {
          signs.push({ i: at, kind: 'curve', dir: Math.sign(s.curve), r: Math.round(R) });
        }
      } else if (!tight && Math.abs(s.curve) < 3) {
        inCorner = false;
      }
    }
    // 速度標識と案内板を一定間隔で
    const every = Math.round(700 * segPerM);
    for (let i = every; i < segments.length - 40; i += every) {
      if (segments[i].tunnel) continue;
      signs.push({ i, kind: (i / every) % 2 === 0 ? 'limit' : 'board' });
    }
    // 工事規制(車線規制)。コースごとの数だけ、直線区間に置く
    const nH = c.hazards || 0;
    for (let h = 0; h < nH; h++) {
      const at = Math.round(segments.length * (0.18 + 0.62 * (h + 0.5) / nH));
      let idx = at;
      // 直線的な場所を探す
      for (let k = 0; k < 60 && Math.abs(segments[idx].curve) > 6; k++) idx = (idx + 7) % (segments.length - 60) + 20;
      hazards.push({ i: idx, len: Math.round(70 * segPerM), side: h % 2 === 0 ? -1 : 1 });
    }
    for (const sg of signs) signAt[sg.i] = sg;
  }

  function findSegment(z) {
    if (!isFinite(z)) z = 0;
    return segments[Math.max(0, Math.min(segments.length - 1, Math.floor(z / SEG_LEN)))];

  // ================= 交通車両 =================

  let traffic = [], nextSpawnZ = 0, hitCooldown = 0, wallSfxT = 0;
  const TRAFFIC_KINDS = [
    { type: 'sedan', mass: 1500, w: 1.77, l: 4.70, kmh: [70, 95] },
    { type: 'hatch', mass: 1100, w: 1.69, l: 4.16, kmh: [65, 90] },

  ];
  const TRAFFIC_COLORS = ['#e8eaf0', '#2b2f38', '#8b93a5', '#20305c', '#7a2230', '#d8d2c4', '#33513a'];
  // 車線中心の横位置(m)。実際の高速道路と同じ3.5m幅。
  function laneCenter(i) { return (i - (LANES - 1) / 2) * 3.5; }

  // タイムアタックとして公平になるよう、交通の配置はコースごとに固定にする
  let tSeed = 1;
  function trand() {
    tSeed = (tSeed * 1664525 + 1013904223) >>> 0;
    return tSeed / 4294967296;
  }
  function resetTraffic() {
    traffic = [];
    nextSpawnZ = 260 * M2U;
    hitCooldown = 0;
    tSeed = 0;
    for (let i = 0; i < course.id.length; i++) tSeed = (tSeed * 131 + course.id.charCodeAt(i)) >>> 0;
    tSeed = (tSeed ^ 0x9e3779b9) >>> 0;
  }
  function spawnOne(z) {
    const k = TRAFFIC_KINDS[Math.floor(trand() * TRAFFIC_KINDS.length)];
    // トラックは走行車線(左寄り)を走る
    const li = k.type === 'truck'
      ? Math.floor(trand() * 2)
      : Math.floor(trand() * LANES);
    traffic.push({
      z, lane: li, x: laneCenter(li),
      type: k.type, mass: k.mass, w: k.w, l: k.l,
      speed: (k.kmh[0] + trand() * (k.kmh[1] - k.kmh[0])) / 3.6,
      color: TRAFFIC_COLORS[Math.floor(trand() * TRAFFIC_COLORS.length)],
      brake: 0,
    });
  }
  function updateTraffic(dt) {
    if (hitCooldown > 0) hitCooldown -= dt;
    // 前方に一定間隔で補充
    const horizon = posZ + 900 * M2U;
    let guard = 0;
    while (nextSpawnZ < horizon && guard++ < 40) {
      if (trand() < course.trafficRate) spawnOne(nextSpawnZ);
      nextSpawnZ += (110 + trand() * 240) * M2U;
    }
    for (const t of traffic) {
      t.z += t.speed * M2U * dt;
      if (t.brake > 0) t.brake -= dt;
    }
    // 通り過ぎた車を掃除
    if (traffic.length > 0 && traffic[0].z < posZ - 90 * M2U) {
      traffic = traffic.filter(t => t.z > posZ - 90 * M2U);
    }

    // ---- 衝突判定 ----
    if (hitCooldown > 0) return;
    const myHalfL = 2.3, myHalfW = 0.92;
    for (const t of traffic) {
      const dz = (t.z - posZ) / M2U;
      if (Math.abs(dz) > myHalfL + t.l / 2) continue;
      const dx = t.x - posX;
      if (Math.abs(dx) > myHalfW + t.w / 2) continue;
      collideWithTraffic(t, dz, dx);
      break;

  function collideWithTraffic(t, dz, dx) {
    const m1 = ph.mass, m2 = t.mass;
    const e = 0.22;                                   // 反発係数
    const vRel = vMs - t.speed;
    const sideHit = Math.abs(dz) < 1.6;               // 並走状態での接触
    if (sideHit) {
      // 側面接触: 弾かれて姿勢を乱す
      const dir = dx > 0 ? -1 : 1;
      vLat += dir * 3.4;
      yawRate += dir * 0.5;
      vMs -= Math.min(vMs, 4 + Math.abs(vRel) * 0.25);
      shake = Math.max(shake, 9);
      flash('接触!', '#ff8f4d', 0.8);
    } else if (vRel > 0) {
      // 追突: 運動量交換
      const j = (1 + e) * vRel * m2 / (m1 + m2);
      vMs = Math.max(0, vMs - j);
      t.speed += (1 + e) * vRel * m1 / (m1 + m2);
      t.brake = 1.2;
      const dir = dx > 0 ? -1 : 1;
      vLat += dir * 1.8;
      yawRate += dir * 0.22;
      shake = Math.max(shake, 14);
      flash('CRASH!', '#ff3d5e', 1.1);
    } else {
      return;
    }
    sfxCrashSound();
    hitCooldown = 0.6;
    for (let i = 0; i < 6; i++) smoke.push({ x: (Math.random() - .5) * 1.6, t: 0.5, spark: true });
  }

  function startRace() {
    car = currentCar(); ph = car.ph;
    buildCourse(COURSES[sel.course]);
    initSky();
    posZ = 0; posX = 0; camXm = 0; vMs = 0; heading = 0; steerIn = 0;
    yawRate = 0; vLat = 0; slipAngle = 0; understeer = false; alignSt = 0; prevSnF = 0;
    bodyPitch = 0; bodyPitchV = 0; bodyRoll = 0; bodyRollV = 0; bodyHeave = 0; bodyHeaveV = 0; prevGrade = 0;
    resetTraffic();
    gear = 1; rpm = ph.idle; shiftTimer = 0;
    aLong = 0; aLat = 0; wheelspin = 0; sliding = 0;
    totalTime = 0; sectionIdx = 0; splits = [];
    sectionTimeLeft = sectionEnds[0].limit; sectionStartTime = 0;
    raceState = 'countdown'; countdown = 3.6;
    finishTimer = 0; shake = 0; flashes = []; smoke = [];
    saveGarage();
    showScreen(null);
    initAudio();
    running = true; lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function flash(text, color, size) {
    flashes.push({ text, color, size: size || 1, t: 1.8 });
    if (flashes.length > 3) flashes.shift();
  }
  function fmtTime(t) {
    const m = Math.floor(t / 60), s = t - m * 60;
    return (m > 0 ? m + "'" : '') + s.toFixed(2).padStart(m > 0 ? 5 : 1, '0') + '"';
  }

  function shiftUp() {
    if (gear < 6 && shiftTimer <= 0) { gear++; shiftTimer = SHIFT_TIME; sfxShift(); }
  }
  function shiftDown() {
    if (gear > 1 && shiftTimer <= 0) {
      if (rpmFromSpeed(vMs, gear - 1, ph) < ph.redline * 1.04) { gear--; shiftTimer = SHIFT_TIME; sfxShift(); }
      else flash('OVER REV!', '#ff3d5e', 0.6);
    }
  }

  // ================= 物理更新 =================
  function update(dt) {
    if (raceState === 'countdown') {
      countdown -= dt;
      rpm = ph.idle + (ph.redline * 0.45 - ph.idle) * (0.5 + 0.5 * Math.sin(performance.now() / 90));
      if (countdown <= 0) { raceState = 'running'; flash('GO!', '#5ee08a', 1.4); sfxGo(); }
      updateEngine(0.4);
      return;
    }

    const left = keys.left;
    const right = keys.right;
    const brake = keys.down || input.brake;
    const accel = (keys.up || input.accel) && raceState === 'running';

    // wheelPtr の指が消えていたら解放(イベント取りこぼしの保険)
    if (wheelPtr !== null && !pointers.has(wheelPtr)) wheelPtr = null;
    // ハンドルを離している間はセルフセンタリング
    if (IS_TOUCH && wheelPtr === null && wheelAngle !== 0) {
      wheelAngle -= wheelAngle * Math.min(1, 7 * dt);
      if (Math.abs(wheelAngle) < 0.005) wheelAngle = 0;
    }

    if (shiftTimer > 0) shiftTimer -= dt;
    const seg = findSegment(posZ);

    // ---- エンジン回転数 ----
    rpm = Math.max(ph.idle, rpmFromSpeed(vMs, gear, ph));
    const revLimit = rpm >= ph.redline;

    // ---- AT変速 ----
    if (!sel.mt && raceState === 'running') {
      autoShiftTimer -= dt;
      if (autoShiftTimer <= 0) {
        if (rpm > ph.redline * 0.95 && gear < 6) { gear++; shiftTimer = SHIFT_TIME; sfxShift(); autoShiftTimer = 0.45; }
        else if (gear > 1 && rpmFromSpeed(vMs, gear - 1, ph) < ph.redline * 0.82 && rpm < ph.redline * 0.45) {
          gear--; shiftTimer = SHIFT_TIME; sfxShift(); autoShiftTimer = 0.45;
        }
      }
    }

    // ---- ダウンフォースと垂直荷重 ----
    const downforce = ph.dfK * vMs * vMs;                 // N
    const normalLoad = ph.mass * G + downforce;           // N
    const gripAccel = ph.mu * normalLoad / ph.mass;       // 総グリップ (m/s^2)

    // ================= 荷重: 前後・左右の移動 =================
    const L = ph.L;
    const grade = (seg.p2y - seg.p1y) / SEG_LEN;
    const dfFront = downforce * 0.42, dfRear = downforce * 0.58;
    // 前後荷重移動(加速で後軸へ、制動で前軸へ)。前フレームの加速度を使う
    const transferLong = ph.mass * aLong * ph.hCG / L;
    let Fzf = ph.mass * G * ph.b / L - transferLong + dfFront;
    let Fzr = ph.mass * G * ph.a / L + transferLong + dfRear;
    Fzf = Math.max(200, Fzf); Fzr = Math.max(200, Fzr);
    // 左右荷重移動。ロール剛性配分で前後に振り分ける
    const transferLat = ph.mass * aLat * ph.hCG / ph.track;
    const dFzF = transferLat * ph.rollDist;
    const dFzR = transferLat * (1 - ph.rollDist);
    // 左右移動を織り込んだ軸グリップ(荷重依存でグリップは目減りする)
    const gripF = axleGrip(ph.mu, Fzf, dFzF, ph.FzRef);
    const gripR = axleGrip(ph.mu, Fzr, dFzR, ph.FzRef);

    // ================= 前後方向 =================
    const fDrag = 0.5 * RHO * ph.CdA * vMs * vMs;
    const fRoll = ph.Crr * ph.mass * G;
    let fDrive = 0;
    wheelspin = Math.max(0, wheelspin - dt * 2.2);

    if (accel && shiftTimer <= 0 && !revLimit) {
      // 発進時はクラッチミートで回転を保つ
      const effRpm = (gear === 1 && rpm < ph.redline * 0.45) ? ph.redline * 0.45 : rpm;
      const T = engineTorque(effRpm, ph);
      fDrive = T * GEARS[gear - 1] * ph.finalDrive * DRIVE_EFF / ph.wheelR;
      // 駆動輪のトラクション上限。超えた分はホイールスピンになり、
      // 滑っている間は摩擦が落ちるので実際に前に進まなくなる
      const fTraction = gripF * (1 - ph.rearDrive) + gripR * ph.rearDrive;
      if (fDrive > fTraction) {
        wheelspin = Math.min(1, (fDrive / fTraction - 1) * 1.2);
        fDrive = fTraction * (1 - 0.20 * wheelspin);
      }
    }
    // 制動(ABS相当: 各軸のグリップの97%まで)
    let fBrakeF = 0, fBrakeR = 0;
    if (brake) {
      fBrakeF = Math.min(ph.brakeBias * ph.mass * 13, gripF * 0.97);
      fBrakeR = Math.min((1 - ph.brakeBias) * ph.mass * 13, gripR * 0.97);
    }
    const fBrake = fBrakeF + fBrakeR;
    const fEngBrake = (!accel && vMs > 1) ? 55 + rpm * 0.045 : 0;

    let accelLong = (fDrive - fDrag - fRoll - fBrake - fEngBrake) / ph.mass;
    accelLong -= G * grade;
    vMs += accelLong * dt;
    if (vMs < 0) vMs = 0;
    if (vMs > ph.topMs * 1.06) vMs = ph.topMs * 1.06;
    aLong = accelLong;

    // ================= 横方向: 二輪モデル + タイヤ特性曲線 =================
    let steerTarget = left ? -1 : right ? 1 : 0;
    let steerRate = 8.5 - Math.min(4.5, vMs / 24);
    if (IS_TOUCH && (wheelPtr !== null || wheelAngle !== 0)) {
      // ハンドルの回転角がそのままアナログ入力になる
      steerTarget = Math.max(-1, Math.min(1, wheelAngle / WHEEL_LOCK));
      steerRate = 14;   // ホイール自体が滑らかなので追従は速く
    }
    steerIn += (steerTarget - steerIn) * steerRate * dt;
    steerIn = Math.max(-1, Math.min(1, steerIn));
    // 切り込み側の上限は定常旋回基準(高速では舵をわずかしか使わない)。
    const aGripMax = gripF / (ph.mass * ph.b / L);
    const deltaGrip = aGripMax * L / Math.max(1, vMs * vMs);
    const deltaSteady = Math.min(ph.steerMax, deltaGrip * 1.6);
    // セルフアライニングトルク(キャスター効果):
    // 姿勢スリップがピークの1.15倍を超える大スライド時のみ、前輪が速度方向へ
    // 自動的に倣う。前輪のグリップが回復し、カウンターステアが成立する。
    // 通常走行〜限界旋回(スリップ≦ピーク付近)では一切介入しない。
    const stateSlip = vMs > 2.5 ? (vLat + ph.a * yawRate) / vMs : 0;
    // ゲートは「前輪の実スリップ」(前フレーム値)で判定する。
    // ドライバーが舵で追従できている間(前輪スリップ小)は一切介入せず、
    // 前輪が本当にグリップを失った時だけ速度方向へ倣わせる。
    const sat = Math.min(1, Math.max(0, (Math.abs(prevSnF) - 1.3) / 0.5));
    // 急に効かせると反動で逆振りする(タンクスラッパー)ため、ローパスで穏やかに
    const alignTarget = stateSlip * 0.55 * sat;
    alignSt += (alignTarget - alignSt) * Math.min(1, 9 * dt);
    let delta = Math.max(-ph.steerMax, Math.min(ph.steerMax,
      alignSt + steerIn * deltaSteady));                // 前輪実舵角(rad)
    if (sel.assist) {
      // アシスト: 前輪スリップがピークを超えない範囲に舵角を丸める。
      // 切りすぎてもアンダーで刺さらず、常に最大グリップ付近で曲がる
      const lo = Math.max(-ph.steerMax, stateSlip - ph.slipPeak * 0.98);
      const hi = Math.min(ph.steerMax, stateSlip + ph.slipPeak * 0.98);
      if (lo <= hi) delta = Math.max(lo, Math.min(hi, delta));
    }

    // 各軸が前後力で消費している摩擦(摩擦楕円)
    const fxFront = fDrive * (1 - ph.rearDrive) - fBrakeF;
    const fxRear = fDrive * ph.rearDrive - fBrakeR;
    const availF = Math.sqrt(Math.max(0.01, 1 - Math.pow(Math.min(1, Math.abs(fxFront) / gripF), 2)));
    const availR = Math.sqrt(Math.max(0.01, 1 - Math.pow(Math.min(1, Math.abs(fxRear) / gripR), 2)));

    if (vMs < 2.5) {
      yawRate = vMs * Math.tan(delta) / L;
      vLat = 0; aLat = 0; sliding = 0; prevSnF = 0;
    } else {
      const slipF = (vLat + ph.a * yawRate) / vMs - delta;
      const slipR = (vLat - ph.b * yawRate) / vMs;
      const snF = slipF / ph.slipPeak;
      const snR = slipR / (ph.slipPeak * 1.04);   // 後軸をわずかに粘らせて直進安定性を確保
      const satF = Math.max(0, Math.abs(snF) - 1);
      const satR = Math.max(0, Math.abs(snR) - 1);
      // タイヤ特性曲線 × 軸グリップ × 摩擦楕円の残余
      const Fyf = -tireCurve(snF) * gripF * availF;
      const Fyr = -tireCurve(snR) * gripR * availR;
      const fBank = ph.mass * G * Math.sin(seg.bank);
      const vLatDot = (Fyf + Fyr + fBank) / ph.mass - vMs * yawRate;
      // ピーク超えのタイヤは復元が消え発振しやすい(タンクスラッパー)。
      // ニューマチックトレール由来のヨー減衰を、飽和時のみ効かせる
      const yawDamp = Math.min(1, satF + satR) * 2.2;
      const yawDot = (ph.a * Fyf - ph.b * Fyr) / ph.Iz - yawRate * yawDamp;
      vLat += vLatDot * dt;
      yawRate += yawDot * dt;
      vLat = Math.max(-30, Math.min(30, vLat));
      yawRate = Math.max(-2.4, Math.min(2.4, yawRate));
      aLat = (Fyf + Fyr + fBank) / ph.mass;
      sliding = Math.min(1, Math.max(satF, satR) * 0.8);
      understeer = satF > satR;
      prevSnF = snF;
    }

    // ---- 道路に対する相対ヨーと横位置 ----
    const curveSign = Math.sign(seg.curve);
    const yawRoad = isFinite(seg.radius) ? (vMs / seg.radius) * curveSign : 0;
    heading += (yawRate - yawRoad) * dt;
    heading = Math.max(-0.85, Math.min(0.85, heading));
    if (sel.assist) {
      // スタビリティアシスト: 車体を道なりに緩やかに復元する
      heading -= heading * 0.55 * dt;
      vLat -= vLat * 0.35 * dt;
    }
    slipAngle = vMs > 2.5 ? Math.atan2(vLat, vMs) : 0;
    posX += (vMs * Math.sin(heading) + vLat * Math.cos(heading)) * dt;

    // ---- 交通車両 ----
    if (raceState === 'running') updateTraffic(dt);

    // ---- 工事規制のパイロン ----
    if (seg.cone && hitCooldown <= 0) {
      const coneX = seg.cone * HALF_ROAD_M * 0.52;
      if (Math.abs(posX - coneX) < 1.15) {
        vMs -= Math.min(vMs, 12);
        vLat += (posX > coneX ? 1 : -1) * 1.6;
        shake = Math.max(shake, 8);
        hitCooldown = 0.35;
        flash('規制帯!', '#ff8f4d', 0.7);
        sfxCrashSound();
      }
    }

    // ---- 壁(ガードレール) ----
    // 位置だけでなく速度も壁に沿わせる(法線成分を消す)のが要点。
    // これをしないと、斜めのままの車が毎フレーム壁へ押し付けられて
    // 擦過減速が続き、姿勢も直らなくなる。
    scraping = false;
    const wallX = HALF_ROAD_M - 1.0;
    // 接触帯(壁から15cm)で処理する。めり込んだ瞬間だけだと、反発の後に
    // 整列処理が途切れて「斜めのまま貼り付く」状態になるため。
    if (Math.abs(posX) > wallX - 0.15) {
      const sgnW = Math.sign(posX);
      const pen = Math.abs(posX) > wallX;
      if (pen) posX = sgnW * wallX;
      const chW = Math.cos(heading), shW = Math.sin(heading);
      let vFwd = vMs * chW - vLat * shW;       // 道路方向の速度成分
      let vSide = vMs * shW + vLat * chW;      // 壁法線方向の速度成分
      if (pen && vSide * sgnW > 0) {
        const impact = Math.abs(vSide);
        // 法線速度を消す(反発はごく小さく)。食い込みぶんの前進速度を失う
        vSide = -sgnW * impact * 0.05;
        vFwd = Math.max(0, vFwd - impact * 0.40);
        // 壁がノーズを押し戻すモーメント
        yawRate -= sgnW * Math.min(0.45, impact * 0.10);
        if (impact > 3) {
          shake = Math.max(shake, Math.min(14, 3 + impact));
          if (wallSfxT <= 0) { sfxCrashSound(); wallSfxT = 0.5; }
          for (let i = 0; i < 4; i++) smoke.push({ x: sgnW, t: 0.45, spark: true });
        }
      }
      const noseIn = heading * sgnW > 0.02;    // ノーズが壁側を向いている
      if (vFwd > 8 && (pen || noseIn)) {
        scraping = true;
        // 擦過抵抗: 壁とほぼ平行なら軽く、角度が深いほど強い。
        // グラインド中は壁が車体を平行へ整列させ続ける
        vFwd = Math.max(0, vFwd - (3.0 + Math.abs(shW) * vFwd * 0.9) * dt);
        heading -= heading * 5 * dt;
        yawRate -= yawRate * 6 * dt;
        shake = Math.max(shake, 3);
        if (Math.random() < 0.5) smoke.push({ x: sgnW, t: 0.4, spark: true });
      } else if (vFwd < 3 && pen) {
        heading = 0; yawRate = 0; vSide = 0;
      }
      // 車体座標系へ戻す
      vMs = Math.max(0, vFwd * chW + vSide * shW);
      vLat = -vFwd * shW + vSide * chW;
    }

    // ---- 車体姿勢(サスペンション) ----
    // ノーズダイブ / スクワット
    const pitchTarget = -aLong * 0.0092;
    bodyPitchV += ((pitchTarget - bodyPitch) * 105 - bodyPitchV * 13.5) * dt;
    bodyPitch += bodyPitchV * dt;
    bodyPitch = Math.max(-0.09, Math.min(0.09, bodyPitch));
    // ロール(横G + 路面バンク)
    const rollTarget = aLat * 0.0075 - seg.bank * 0.55;
    bodyRollV += ((rollTarget - bodyRoll) * 95 - bodyRollV * 12.5) * dt;
    bodyRoll += bodyRollV * dt;
    bodyRoll = Math.max(-0.13, Math.min(0.13, bodyRoll));
    // 勾配変化による上下動
    const gradeRate = (grade - prevGrade) / Math.max(dt, 0.001);
    prevGrade = grade;
    bodyHeaveV += (-bodyHeave * 190 - bodyHeaveV * 16 - gradeRate * vMs * 0.010) * dt;
    bodyHeave += bodyHeaveV * dt;
    bodyHeave = Math.max(-0.10, Math.min(0.10, bodyHeave));

    // ---- タイヤスモーク ----
    if ((sliding > 0.25 || wheelspin > 0.3) && vMs > 12 && Math.random() < 0.6) {
      smoke.push({ x: (Math.random() - .5) * 1.4, t: 0.75, spark: false });
    }
    for (const s of smoke) s.t -= dt;
    smoke = smoke.filter(s => s.t > 0);
    if (smoke.length > 40) smoke.splice(0, smoke.length - 40);

    // ---- 前進 ----
    posZ += vMs * Math.cos(heading) * M2U * dt;

    // ---- 計時・セクション判定 ----
    if (raceState === 'running') {
      totalTime += dt;
      sectionTimeLeft -= dt;
      const secEnd = sectionEnds[sectionIdx];
      if (secEnd && posZ >= secEnd.z) {
        const secTime = totalTime - sectionStartTime;
        splits.push({ name: secEnd.name, time: secTime, limit: secEnd.limit });
        sectionStartTime = totalTime;
        sectionIdx++;
        if (sectionIdx < sectionEnds.length) {
          sectionTimeLeft = sectionEnds[sectionIdx].limit;
          flash(secEnd.name + '  ' + fmtTime(secTime), '#3de8ff', 0.8);
          sfxCheckpoint();
        } else {
          raceState = 'finished'; finishTimer = 0;
          flash('FINISH!', '#f2d048', 1.5); sfxFinish();
        }
      }
      if (raceState === 'running' && sectionTimeLeft <= 0) {
        sectionTimeLeft = 0; raceState = 'timeup'; finishTimer = 0;
        flash('TIME UP…', '#ff3d5e', 1.3); sfxCrashSound();
      }
    } else if (raceState === 'finished' || raceState === 'timeup') {
      vMs = Math.max(0, vMs - 14 * dt);
      finishTimer += dt;
      if (finishTimer > 2.4) { running = false; showResult(); updateEngine(0); return; }
    }

    if (shake > 0) shake = Math.max(0, shake - 28 * dt);
    if (wallSfxT > 0) wallSfxT -= dt;
    for (const f of flashes) f.t -= dt;
    flashes = flashes.filter(f => f.t > 0);
    updateEngine(accel ? 1 : 0);
  }

  // ================= リザルト =================
  function showResult() {
    const cleared = raceState === 'finished';
    document.getElementById('resTitle').textContent = cleared ? 'RESULT' : 'TIME UP';
    document.getElementById('resCar').textContent =
      course.name + ' / ' + car.maker + ' ' + car.name + ' (' + car.ps + 'PS・' + car.dt + '・' + (sel.mt ? '6MT' : 'AT') + ')';
    const body = document.getElementById('resBody');
    body.innerHTML = '';
    splits.forEach((sp, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = '<th>SEC ' + (i + 1) + '</th><td>' + sp.name + '</td><td class="tm">' + fmtTime(sp.time) + '</td>';
      body.appendChild(tr);
    });
    if (!cleared) {
      const tr = document.createElement('tr');
      tr.innerHTML = '<th>SEC ' + (splits.length + 1) + '</th><td>' + sectionEnds[sectionIdx].name +
        '</td><td class="tm" style="color:#ff3d5e">DNF</td>';
      body.appendChild(tr);
    }
    const rec = document.getElementById('resRecord');
    rec.classList.add('hidden');
    if (cleared) {
      document.getElementById('resTotal').textContent = 'TOTAL ' + fmtTime(totalTime);
      const prev = loadBest(course.id);
      if (!prev || totalTime < prev.time) {
        try { localStorage.setItem(bestKey(course.id), JSON.stringify({ time: totalTime, car: car.maker + ' ' + car.name })); } catch (e) {}
        rec.classList.remove('hidden');
        document.getElementById('resBest').textContent = prev ? '前回ベスト ' + fmtTime(prev.time) : '';
      } else {
        document.getElementById('resBest').textContent = 'コースレコード ' + fmtTime(prev.time) + ' (' + prev.car + ')';
      }
    } else {
      document.getElementById('resTotal').textContent = '規定時間内に走りきれなかった…';
      document.getElementById('resBest').textContent = '';
    }
    showScreen('result');
  }

  // ================= サウンド =================
  let AC = null, engOsc, engOsc2, engGain, windGain, noiseBuf, screechGain, screechFilt;
  function initAudio() {
    if (AC) { resumeAudio(); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      engOsc = AC.createOscillator(); engOsc.type = 'sawtooth';
      engOsc2 = AC.createOscillator(); engOsc2.type = 'square';
      const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 820;
      engGain = AC.createGain(); engGain.gain.value = 0;
      const g2 = AC.createGain(); g2.gain.value = 0.32;
      engOsc.connect(f); engOsc2.connect(g2); g2.connect(f);
      f.connect(engGain); engGain.connect(AC.destination);
      engOsc.start(); engOsc2.start();
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      const nf = AC.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 880;
      windGain = AC.createGain(); windGain.gain.value = 0;
      src.connect(nf); nf.connect(windGain); windGain.connect(AC.destination);
      src.start();
      // タイヤのスキール音(グリップのピークを超えた量で鳴る)
      const scr = AC.createBufferSource(); scr.buffer = noiseBuf; scr.loop = true;
      screechFilt = AC.createBiquadFilter();
      screechFilt.type = 'bandpass'; screechFilt.frequency.value = 2400; screechFilt.Q.value = 9;

  function resumeAudio() {
    if (!AC) return;

  // AudioParam に NaN/Infinity を書き込むとノードが永久に無音になるため必ず通す
  function setParam(param, v, now) {
    if (!param) return;
    const x = isFinite(v) ? Math.max(0, Math.min(20000, v)) : 0;
    try { param.setTargetAtTime(x, now, 0.02); } catch (e) { try { param.value = x; } catch (e2) {} }
  }
  function updateEngine(throttle) {
    if (!AC || !engGain) return;
    resumeAudio();
    const now = AC.currentTime;
    if (muted || !running) {
      setParam(engGain.gain, 0, now);
      setParam(windGain && windGain.gain, 0, now);
      setParam(screechGain && screechGain.gain, 0, now);
      return;
    }
    // スキール音: 滑り量とホイールスピンで鳴り、速度で音程が上がる
    const skid = Math.max(sliding, wheelspin * 0.85);
    setParam(screechGain.gain, skid > 0.06 ? Math.min(0.13, skid * 0.16) : 0, now);
    setParam(screechFilt.frequency, 1700 + Math.min(1500, vMs * 18) + skid * 500, now);
    const rpmN = ph && ph.redline ? rpm / ph.redline : 0.3;
    const fr = 38 + (isFinite(rpmN) ? rpmN : 0.3) * 190 + gear * 5;
    setParam(engOsc.frequency, fr, now);
    setParam(engOsc2.frequency, fr * 0.5, now);
    const cut = shiftTimer > 0 ? 0.28 : 1;
    setParam(engGain.gain, (0.024 + throttle * 0.042 + (isFinite(rpmN) ? rpmN : 0) * 0.022) * cut, now);
    setParam(windGain.gain,
      Math.max(0, (vMs - 45) / 620) + (scraping ? 0.14 : 0) + sliding * 0.06 + wheelspin * 0.05, now);
  }
  function blip(freq, dur, type, vol, slide) {
    if (!AC || muted || !isFinite(freq)) return;
    resumeAudio();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, AC.currentTime);
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, AC.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.12, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);

  const sfxShift = () => blip(210, 0.07, 'square', 0.07, -70);
  const sfxCheckpoint = () => { blip(880, 0.1, 'square', 0.1); setTimeout(() => blip(1320, 0.18, 'square', 0.1), 100); };
  const sfxGo = () => blip(880, 0.4, 'square', 0.14);
  const sfxBeep = () => blip(440, 0.18, 'square', 0.12);
  const sfxFinish = () => { [660, 880, 1100, 1320].forEach((f, i) => setTimeout(() => blip(f, 0.22, 'square', 0.12), i * 130)); };
  function sfxCrashSound() {
    if (!AC || muted) return;
    const src = AC.createBufferSource(); src.buffer = noiseBuf;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 450;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.3, AC.currentTime);

  let lastBeep = -1;
  document.getElementById('muteBtn').addEventListener('click', e => {
    muted = !muted; e.target.textContent = muted ? '🔇' : '🔊'; e.target.blur();
  });

  // ================= 入力 =================
  const input = { brake: false, accel: false, sup: false, sdown: false };
  let prevSup = false, prevSdown = false;
  const keys = {};
  const pointers = new Map();

  // ---- ステアリングホイール(タッチ) ----
  // 実車のように指で回して操作する。±135°でフルロック、離すと自動でセンターへ。
  const WHEEL_LOCK = Math.PI * 0.61;   // ±110°でフルロック
  let wheelAngle = 0, wheelPtr = null, wheelGrabX = 0, wheelGrabA = 0;

  function wheelGeom() {
    const s = Math.min(W, H);
    const r = Math.min(s * 0.21, 120);
    // 画面の縁から十分離す。縁ぎりぎりに置くと、実機ではOSのエッジ
    // ジェスチャー(通知センター・ホームバー・戻る)にタッチを奪われる。
    return { cx: s * 0.09 + r, cy: H - s * 0.075 - r, r };
  }
  function buttonRects() {
    const s = Math.min(W, H);
    const pad = s * 0.03;
    const mR = s * 0.06;                 // 右端もエッジジェスチャー帯を避ける
    const r = Math.min(s * 0.115, 64, (W - pad * 7) / 9);
    const by = H - r * 2 - s * 0.05 - 4;
    const rects = {
      accel: { x: W - mR - r * 2.4, y: by - r * 0.4, w: r * 2.4, h: r * 2.4, label: 'ACCEL' },
      brake: { x: W - mR - pad - r * 4.2, y: by, w: r * 1.8, h: r * 2, label: 'BRAKE' },
    };
    if (sel.mt) {
      rects.sup   = { x: W - mR - r * 1.9, y: by - r * 2.4, w: r * 1.9, h: r * 1.6, label: 'SHIFT +' };
      rects.sdown = { x: W - mR - pad - r * 3.9, y: by - r * 2.4, w: r * 1.9, h: r * 1.6, label: 'SHIFT −' };
    }
    return rects;
  }
  function updateTouchInput() {
    if (!IS_TOUCH) return;
    const rects = buttonRects();
    for (const k of Object.keys(input)) input[k] = false;
    for (const [id, p] of pointers) {
      if (id === wheelPtr) continue;   // ハンドルを握っている指はボタン判定しない
      for (const [name, r] of Object.entries(rects)) {
        if (p.x >= r.x - 6 && p.x <= r.x + r.w + 6 && p.y >= r.y - 6 && p.y <= r.y + r.h + 6) input[name] = true;
      }
    }
    if (input.sup && !prevSup) shiftUp();
    if (input.sdown && !prevSdown) shiftDown();
    prevSup = input.sup; prevSdown = input.sdown;
  }
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    // キャプチャしておくと指が要素外へ滑っても up/cancel が確実に届く
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    const p = mapPoint(e);
    pointers.set(e.pointerId, p);

    // 新しい指を優先する(イベント取りこぼしで固まっても、触り直せば直る)
    if (IS_TOUCH && p.x < W * 0.52 && p.y > H * 0.22) {

  canvas.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;

    pointers.set(e.pointerId, p);
    if (e.pointerId === wheelPtr) {
      // 左右のドラッグ量 = リムを回す量(半径1.4個ぶんでフルロック)。
      // 角度追跡より単純で、跳ね・詰まりが起きない
      const g = wheelGeom();

  canvas.addEventListener('pointercancel', releasePointer);

    KeyA: 'left', KeyD: 'right', KeyW: 'up', KeyS: 'down',

  document.addEventListener('keydown', e => {

      if (e.code === 'KeyX' || e.code === 'KeyE' || e.code === 'Space') { shiftUp(); e.preventDefault(); }

  // ================= 3D 描画 =================
  let camX = 0, camY = 0, camZ = 0, camCos = 1, camSin = 0;
  let camXm = 0;   // カメラの横位置(m) — 車を減衰追従する

  // 任意の3D点をスクリーン座標へ(カメラのヨー回転込み)
  const NEAR_PLANE = 0.4 * M2U;
  function p3(wx, wy, wz) {
    const dx = wx - camX, dz = wz - camZ;
    // ニアクリップ: カメラ手前の点も潰さずに投影する(ポリゴンの欠落を防ぐ)
    const rz = Math.max(NEAR_PLANE, dz * camCos + dx * camSin);
    const rx = dx * camCos - dz * camSin;
    const sc = CAMERA_DEPTH / rz;
    // 縦横で同じスケール(PROJ_K)を使う。アスペクト比が保たれ、物体が歪まない。
    return { x: W / 2 + sc * rx * PROJ_K, y: horizonY - sc * (wy - camY) * PROJ_K, sc, rz };
  }
  // 世界座標の光をソフトなグローとして描く
  function glow(p, worldR, color, alpha, maxPx) {
    if (!p || alpha <= 0.02) return;
    const rr = Math.min(maxPx, Math.max(3, p.sc * worldR * PROJ_K));
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rr);
    g.addColorStop(0, color);
    g.addColorStop(0.45, 'rgba(255,255,255,0)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalAlpha = Math.min(1, alpha);
    ctx.fillStyle = g;
    ctx.fillRect(p.x - rr, p.y - rr, rr * 2, rr * 2);
    ctx.globalAlpha = 1;
  }
  function quad(a, b, c, d, color) {
    if (!a || !b || !c || !d) return;

    ctx.beginPath();
    ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y);
    ctx.closePath(); ctx.fill();
  }

  function drawSky(inTunnel) {
    if (inTunnel) { ctx.fillStyle = '#05060d'; ctx.fillRect(0, 0, W, H); return; }
    const hz = horizonY;
    const sky = ctx.createLinearGradient(0, 0, 0, hz + H * 0.02);
    sky.addColorStop(0, '#02030a');
    sky.addColorStop(0.7, '#0c1330');
    sky.addColorStop(1, '#1a2350');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, hz + H * 0.02);
    // 街明かりのグロー(地平線に滲む都市の光)
    for (const [gx2, colG] of [[W * 0.20, '255,150,80'], [W * 0.78, '90,170,255']]) {
      const cg = ctx.createRadialGradient(gx2, hz, 0, gx2, hz, W * 0.34);
      cg.addColorStop(0, 'rgba(' + colG + ',0.10)');
      cg.addColorStop(1, 'rgba(' + colG + ',0)');
      ctx.fillStyle = cg;
      ctx.fillRect(gx2 - W * 0.34, hz - W * 0.34, W * 0.68, W * 0.34);
    }
    ctx.fillStyle = '#070912';
    ctx.fillRect(0, hz + H * 0.02, W, H - hz);
    // 地表(高架の下の街)へなだらかに落とす
    const grd = ctx.createLinearGradient(0, hz - H * 0.06, 0, hz + H * 0.20);
    grd.addColorStop(0, 'rgba(26,35,80,0)');
    grd.addColorStop(0.45, 'rgba(14,18,42,.95)');
    grd.addColorStop(1, '#070912');
    ctx.fillStyle = grd;
    ctx.fillRect(0, hz - H * 0.06, W, H * 0.26);
    const shift = -(heading * W * 0.55);
    ctx.save();
    ctx.translate(shift, 0);
    ctx.fillStyle = '#dfe6ff';
    for (const st of stars) { ctx.globalAlpha = st.a; ctx.fillRect(st.x * W * 1.6 - W * 0.3, st.y * hz * 1.9, 2, 2); }

    ctx.fillStyle = '#02030a';

  function render() {
    // カメラは自車の後方にあるので、描画はカメラの居るセグメントから始める
    camZ = Math.max(0, posZ - CAMERA_BACK);
    const baseSeg = findSegment(camZ);
    const basePct = (camZ % SEG_LEN) / SEG_LEN;
    const carSeg = findSegment(posZ);
    const carPct = (posZ % SEG_LEN) / SEG_LEN;

    const roadY = baseSeg.p1y + (baseSeg.p2y - baseSeg.p1y) * basePct;
    // カメラは車の横移動を少し遅れて追う(壁際でも視界が破綻しない)

    camX = camXm * M2U;
    camY = roadY + CAMERA_H - Math.sin(baseSeg.bank) * camX;
    const camYaw = heading * 0.42;
    camCos = Math.cos(camYaw); camSin = Math.sin(camYaw);

    // カメラロール(横G+バンクでわずかに傾ける)
    const roll = -aLat * 0.0026 - baseSeg.bank * 0.22;
    ctx.save();
    ctx.translate(W / 2 + (Math.random() - .5) * shake, H / 2 + (Math.random() - .5) * shake);
    ctx.rotate(roll);

    const theme = course.theme;
    // 走行ラインに沿った中心線を積算

    const rows = [];

    for (let n = 0; n < DRAW_DIST; n++) {
      const i = baseSeg.index + n;
      if (i >= segments.length) break;
      const s = segments[i];
      const z1 = s.z, z2 = s.z + SEG_LEN;
      const x1 = cx;
      cx += dx; dx += s.curve;
      const x2 = cx;
      const bs = Math.sin(s.bank), bc = Math.cos(s.bank);
      // 左右エッジ(バンクで高さが変わる=真の3D)

      if (!L1 || !R1 || !L2 || !R2) continue;
      const dark = Math.floor(r.i / 3) % 2 === 0;
      const fog = Math.min(0.86, r.n / DRAW_DIST * 1.15);
      const near = r.n < NEAR_DETAIL;
      const bs = Math.sin(s.bank), bc = Math.cos(s.bank);

      // ---- 沿道の景観(道路より外側なので先に描く) ----
      if (!s.tunnel) {
        if (r.i % 7 === 0 && r.n > 14) {
          for (const sgn of [-1, 1]) {
            const hs = hash(r.i * 3 + (sgn > 0 ? 1 : 0));
            if (hs < 0.34) continue;
            const bw = (8 + hs * 18) * M2U;
            const bh = (12 + hash(r.i + 91) * 58) * M2U;
            const off = (24 + hash(r.i + 7) * 46) * M2U;

          }
        }
        // 照明ポール
        if (r.i % 8 === 0 && near) {
          for (const sgn of [-1, 1]) {
            const px = r.x1 + sgn * ROAD_HW * 1.14;
            const pTop = s.p1y + 8.5 * M2U;
            quad(p3(px - 0.14 * M2U, s.p1y, r.z1), p3(px + 0.14 * M2U, s.p1y, r.z1),
                 p3(px + 0.14 * M2U, pTop, r.z1), p3(px - 0.14 * M2U, pTop, r.z1),
                 shade(48, 54, 78, fog));
            const lamp = p3(px - sgn * 0.9 * M2U, pTop, r.z1);
            glow(lamp, 6 * M2U, theme.pole, (1 - fog) * 0.5, 130);
            dot(lamp, 0.3 * M2U, theme.pole, 1 - fog, 12);
            const lbase = p3(px - sgn * 0.9 * M2U, s.p1y, r.z1);
            if (lamp && lbase) fxL.push({ x: lamp.x, y0: lbase.y, sc: lamp.sc, col: theme.pole, a: 1 - fog });
          }

        // 吊り橋の主塔とケーブル

            const th = 58 * M2U, tw = 1.5 * M2U;
            quad(p3(tx2 - tw, s.p1y, r.z1), p3(tx2 + tw, s.p1y, r.z1),
                 p3(tx2 + tw, s.p1y + th, r.z1), p3(tx2 - tw, s.p1y + th, r.z1),
                 shade(46, 58, 94, fog));
            dot(p3(tx2, s.p1y + th, r.z1), 0.5 * M2U, '#ff5555',
                (1 - fog) * (Math.floor(performance.now() / 600) % 2 ? 1 : 0.3), 10);
          }
        }
        if (s.bridge && r.i % 3 === 0) {
          for (const sgn of [-1, 1]) {
            const bx2 = r.x1 + sgn * ROAD_HW * 1.22;
            const a = p3(bx2, s.p1y, r.z1), b = p3(bx2, s.p1y + 26 * M2U, r.z1);

              ctx.lineWidth = Math.max(0.6, a.sc * 90);

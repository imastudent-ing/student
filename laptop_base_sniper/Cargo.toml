[package]
name = "laptop_base_sniper"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Base Flashblocks-driven same-block buy bot for a single Uniswap v4 launch (LAPTOP)"
publish = false

[dependencies]
alloy = { version = "1.8", default-features = false, features = [
    "std",
    "consensus",
    "eips",
    "network",
    "signers",
    "signer-local",
    "sol-types",
    "k256",
] }
anyhow = "1"
dotenvy = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "signal"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tokio = { version = "1", features = ["process", "net"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1

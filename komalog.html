<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f4">
<title>KOMALOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f4f4; --card:#ececec; --card2:#e4e4e4; --line:#e2e2e2; --white:#fff;
    --tx:#111; --dim:#8a8a8a; --dim2:#b3b3b3;
    --pink:#e24fd2; --pink2:#f5c6ee; --pink3:#fce6f8; --rose:#e2677f;
    --mint:#5fd6bd; --yel:#fff3c4; --red:#ef5a5a; --grn:#2fae80;
    --r:30px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--tx);
    font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN',system-ui,sans-serif;}
  body{min-height:100vh; display:flex; justify-content:center; overflow-x:hidden;}
  body::after{content:""; position:fixed; inset:0; pointer-events:none; z-index:99;
    box-shadow:inset 0 0 0 3px #ee8ce4, inset 0 0 38px rgba(238,140,228,.4);}
  button{font-family:inherit; color:inherit; cursor:pointer; border:none; background:none; padding:0; font-size:inherit;}
  button:disabled{cursor:default;}
  #app{width:100%; max-width:480px; min-height:100vh; padding:calc(16px + env(safe-area-inset-top)) 16px 140px;}

  /* ---------- header ---------- */
  .hd{display:flex; justify-content:space-between; align-items:center; padding:8px 12px 0;}
  .logo{font-family:'Anton',Impact,'Arial Narrow',sans-serif; font-size:44px; color:var(--mint); letter-spacing:.5px; line-height:1;
    transform:scaleY(1.12); transform-origin:left center;}
  .me-btn{width:62px; height:62px; border-radius:50%; background:#fff; display:grid; place-items:center; box-shadow:0 6px 20px rgba(0,0,0,.08);}
  .av{border-radius:50%; display:grid; place-items:center; overflow:hidden; flex-shrink:0; line-height:1;}
  .hint{display:flex; align-items:center; gap:10px; margin:14px 12px 16px; color:var(--dim); font-weight:900; font-size:15px;}
  .hint .ic{width:26px; height:26px; border-radius:50%; background:var(--pink); display:grid; place-items:center; flex-shrink:0;}
  .demo-chip{margin-left:auto; font-size:11px; font-weight:900; color:var(--pink); background:var(--pink3); padding:5px 10px; border-radius:20px; white-space:nowrap;}

  /* ---------- week strip ---------- */
  .wkbar{display:flex; align-items:center; justify-content:space-between; margin:0 8px 8px; font-weight:900; font-size:13px; color:var(--dim);}
  .wkbar button{width:32px; height:32px; border-radius:50%; background:#fff; font-size:18px; font-weight:900; color:#333;}
  .wkbar button:disabled{opacity:.25;}
  .wk{display:flex; gap:7px; margin-bottom:18px;}
  .wk button{flex:1; background:#fff; border-radius:22px; padding:9px 0 8px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:2px; border:2px solid transparent;}
  .wk button small{font-size:12px; font-weight:900; color:var(--dim);}
  .wk button b{font-size:19px; font-weight:900;}
  .wk button.today{border-color:var(--pink2);}
  .wk button.today small{color:var(--pink);}
  .wk button.on{background:var(--tx); color:#fff;}
  .wk button.on small{color:#ccc;}
  .wdots{display:flex; gap:3px; height:6px;}
  .wdots i{width:5px; height:5px; border-radius:50%; background:var(--pink);}

  /* ---------- cards ---------- */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:20px 22px; margin-bottom:12px;}
  .sec-t{font-size:15px; color:var(--dim); font-weight:900; margin:24px 8px 10px; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .sec-t .r{font-size:12px; display:flex; align-items:center; gap:8px;}
  .note{font-size:12px; color:var(--dim); font-weight:700; margin:8px 4px 0; line-height:1.6;}
  .empty{text-align:center; color:var(--dim); font-weight:900; padding:22px 10px; font-size:14px; line-height:1.6;}

  /* who's here */
  .who{padding:18px 18px 14px;}
  .who-h{display:flex; align-items:center; gap:8px; margin:0 4px 12px;}
  .who-h b{font-size:19px; font-weight:900;}
  .who-h span{margin-left:auto; font-size:12px; font-weight:900; color:var(--pink); background:#fff; padding:5px 11px; border-radius:20px;}
  .who-row{display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; padding:2px 2px 4px;}
  .who-row::-webkit-scrollbar{display:none;}
  .who-p{width:74px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center;}
  .ring{position:relative; padding:3px; border-radius:50%; border:2.5px solid #d9d9d9;}
  .ring.on{border-color:var(--pink);}
  .ring .ck{position:absolute; right:-3px; bottom:-2px; width:21px; height:21px; border-radius:50%; background:var(--pink); color:#fff; font-size:11px; font-weight:900; display:grid; place-items:center; border:2px solid #fff; font-style:normal;}
  .who-p b{font-size:13px; font-weight:900;}
  .who-p small{font-size:10.5px; font-weight:900; color:var(--dim); width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .who-p small.on{color:var(--pink);}

  .sug{display:flex; align-items:center; gap:12px; background:var(--pink3); border:1.5px solid var(--pink2); border-radius:26px; padding:12px 12px 12px 16px; margin-bottom:10px;}
  .sug .stk{flex-shrink:0;}
  .sug p{margin:0; flex:1; font-size:14px; font-weight:700; line-height:1.45;}
  .sug p b{font-weight:900;}
  .sug button{background:var(--pink); color:#fff; font-weight:900; font-size:13px; padding:11px 14px; border-radius:20px; white-space:nowrap; flex-shrink:0;}
  .sug button.sent{background:#fff; color:var(--pink);}

  /* day header + record dots */
  .dayhd{display:flex; align-items:flex-end; justify-content:space-between; margin:26px 8px 4px; gap:10px;}
  .dayhd h2{margin:0; font-size:22px; font-weight:900;}
  .dayhd .rec{display:flex; align-items:center; gap:8px; font-size:12px; font-weight:900; color:var(--dim);}
  .legend{display:flex; gap:12px; flex-wrap:wrap; margin:6px 8px 12px; font-size:11px; font-weight:900; color:var(--dim);}
  .legend span{display:flex; align-items:center; gap:4px;}
  .dts{display:grid; gap:4px; grid-auto-flow:column; grid-template-rows:repeat(3,10px);}
  .dts.line{grid-template-rows:10px;}
  .dt{width:10px; height:10px; border-radius:50%; display:block; border:2px solid #c9c9c9; background:transparent;}
  .dt.in{background:var(--pink); border-color:var(--pink);}
  .dt.photo{background:var(--pink); border-color:var(--pink); border-radius:2px;}
  .dt.yet{border:none; background:#dedede; transform:scale(.55);}

  /* slot cards */
  .slot{position:relative; border-radius:var(--r); padding:16px 18px 16px; margin-bottom:12px; background:var(--c,#fff); overflow:hidden;
    display:flex; flex-direction:column; gap:4px; min-height:156px; text-align:left; width:100%; cursor:pointer;}
  .slot > *{position:relative; z-index:1;}
  .slot.now{box-shadow:0 0 0 3px var(--pink), 0 10px 24px rgba(226,79,210,.18);}
  .slot.ph{min-height:300px; color:#fff; background-color:#999; background-size:cover; background-position:center;}
  .slot.ph::before{content:""; position:absolute; inset:0; z-index:0; background:linear-gradient(180deg,rgba(0,0,0,.30),rgba(0,0,0,0) 32%,rgba(0,0,0,0) 50%,rgba(0,0,0,.62));}
  .slot .phemo{position:absolute; inset:0; display:grid; place-items:center; font-size:96px; z-index:0; opacity:.95;}
  .slot .top{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:900; flex-wrap:wrap;}
  .pl{background:rgba(255,255,255,.78); color:#333; padding:5px 10px; border-radius:20px;}
  .pl.now{background:var(--pink); color:#fff;}
  .pl.st{margin-left:auto;}
  .pl.st.in{background:var(--tx); color:#fff;}
  .pl.st.none{background:rgba(255,255,255,.55); color:#777;}
  .slot .ttl{font-size:23px; font-weight:900; line-height:1.25; margin-top:8px; word-break:break-all;}
  .slot .rm{font-size:13px; font-weight:700; opacity:.68;}
  .slot.ph .rm{opacity:.9;}
  .slot .cm{font-size:15px; font-weight:900; margin-top:4px; text-shadow:0 1px 6px rgba(0,0,0,.25);}
  .slot .bot{display:flex; align-items:center; gap:10px; margin-top:auto; padding-top:10px;}
  .slot .fl{flex:1; min-width:0; display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:900;}
  .slot .fl span.t{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .slot .aud{font-size:11px; font-weight:900; opacity:.8;}
  .go{background:var(--tx); color:#fff; border-radius:24px; padding:13px 22px; font-weight:900; font-size:16px; flex-shrink:0; box-shadow:0 4px 12px rgba(0,0,0,.12);}
  .go.lite{background:rgba(255,255,255,.9); color:var(--tx); font-size:14px; padding:11px 16px;}
  .later{font-size:13px; font-weight:900; opacity:.6; flex-shrink:0;}
  .slot.free{background:transparent; border:2px dashed #d8d8d8; min-height:0; padding:12px 16px;}
  .slot.lunch{background:var(--yel); min-height:0; padding:12px 16px;}
  .slot.after{background:#fff; min-height:0; padding:12px 16px;}
  .slot.free.ph,.slot.lunch.ph,.slot.after.ph{min-height:230px; border:none;}
  .slot.free .ttl,.slot.lunch .ttl,.slot.after .ttl{font-size:16px; margin-top:4px;}
  .slot.sm .bot{padding-top:6px;}
  .mini{background:#fff; border-radius:18px; padding:9px 14px; font-weight:900; font-size:13px; flex-shrink:0; box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .slot.lunch .mini{background:#fff;}
  .rxs{display:flex; gap:4px; align-items:center; background:rgba(255,255,255,.88); color:#333; border-radius:20px; padding:4px 10px; font-size:13px; font-weight:900; flex-shrink:0;}
  .stamp{position:absolute; right:16px; top:48px; z-index:2; transform:rotate(-11deg); border:3px solid var(--pink); color:var(--pink);
    font-family:'Anton',Impact,sans-serif; padding:1px 10px 2px; border-radius:10px; font-size:19px; letter-spacing:1px; background:rgba(255,255,255,.88); line-height:1.2;}
  .stamp small{display:block; font-family:'Zen Maru Gothic',sans-serif; font-weight:900; font-size:9px; letter-spacing:0; text-align:center; margin-top:-2px;}

  /* avatars stack */
  .stk{display:flex; padding-left:8px;}
  .stk .fa{position:relative; margin-left:-8px;}
  .stk .fa .av{border:2px solid #fff;}
  .stk .fa.on .av{border-color:var(--pink);}
  .stk .fa i{position:absolute; right:-3px; bottom:-3px; width:15px; height:15px; border-radius:50%; background:var(--pink); color:#fff; font-size:8px; font-style:normal; display:grid; place-items:center; border:1.5px solid #fff; font-weight:900;}

  /* friend rows */
  .row{display:flex; align-items:center; gap:12px; padding:13px 14px 13px 13px; width:100%; text-align:left; cursor:pointer;}
  .thumb{width:70px; height:70px; border-radius:18px; flex-shrink:0; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.08);
    display:grid; place-items:center; font-size:32px; overflow:hidden; background-size:cover; background-position:center;}
  .row .mid{flex:1; min-width:0;}
  .row .name{font-size:18px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .fac{font-size:11px; font-weight:900; color:var(--dim); background:#fff; padding:2px 8px; border-radius:10px; margin-left:4px; vertical-align:3px;}
  .row .st{font-size:13.5px; font-weight:900; margin-top:4px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row .st.new{color:var(--pink);}
  .row .st small{color:var(--dim2); font-weight:700; margin-left:8px; font-size:12px;}
  .dwrap{display:flex; flex-direction:column; align-items:center; gap:4px; flex-shrink:0;}
  .dwrap em{font-style:normal; font-size:10px; font-weight:900; color:var(--dim);}
  .smile{width:46px; height:46px; border-radius:50%; background:var(--pink2); border:1.5px solid var(--rose); display:grid; place-items:center; flex-shrink:0; transition:transform .15s;}
  .smile.done{background:var(--pink);}
  .smile.done svg *{stroke:#fff;} .smile.done svg circle{fill:#fff;}
  .smile:disabled{opacity:.35;}
  .smile:active{transform:scale(.88);}
  .pop{animation:pop .45s ease;}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3) rotate(-10deg)}100%{transform:scale(1)}}
  .chev{flex-shrink:0;}

  /* reactions bar (friend posts) */
  .rx{display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:10px;}
  .rx button{width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.9); font-size:19px; border:2px solid transparent;}
  .rx button.on{border-color:var(--pink); background:var(--pink3);}
  .rx button.say{width:auto; padding:0 14px; border-radius:20px; font-size:13px; font-weight:900; color:#333;}
  .said{font-size:12px; font-weight:900; margin-top:6px; background:rgba(255,255,255,.88); color:var(--pink); display:inline-block; padding:4px 10px; border-radius:14px; align-self:flex-start;}

  /* bottom nav */
  .nav{position:fixed; left:0; right:0; bottom:0; padding:0 16px calc(20px + env(safe-area-inset-bottom)); display:flex; justify-content:center; z-index:20; pointer-events:none;}
  .nav-in{width:100%; max-width:448px; display:flex; justify-content:space-between; align-items:center; pointer-events:auto;}
  .circ{width:70px; height:70px; border-radius:50%; background:#fff; display:grid; place-items:center; box-shadow:0 8px 24px rgba(0,0,0,.09); position:relative;}
  .circ .badge{position:absolute; top:13px; right:15px; width:13px; height:13px; border-radius:50%; background:var(--pink); border:2px solid #fff;}
  .pill{background:#fff; border-radius:40px; padding:8px; display:flex; gap:4px; box-shadow:0 8px 24px rgba(0,0,0,.09);}
  .pill button{padding:14px 20px; border-radius:30px; font-size:17px; font-weight:900; color:#666; white-space:nowrap;}
  .pill button.on{background:var(--card2); color:var(--tx);}

  /* timetable grid */
  .ttc{padding:16px 12px 14px;}
  .ttc-h{display:flex; justify-content:space-between; align-items:center; margin:0 6px 12px; gap:8px;}
  .ttc-h b{font-size:18px; font-weight:900;}
  .lnk{font-size:12px; font-weight:900; color:var(--pink); background:#fff; padding:6px 11px; border-radius:16px;}
  .tt{display:grid; grid-template-columns:24px repeat(5,minmax(0,1fr)); gap:5px;}
  .tt .h{font-size:13px; font-weight:900; color:var(--dim); text-align:center; padding:2px 0 4px;}
  .tt .h.today{color:var(--pink);}
  .tt .p{font-size:12px; font-weight:900; color:var(--dim2); display:grid; place-items:center;}
  .cell{min-height:64px; border-radius:14px; background:#fff; padding:6px 5px; font-size:11px; font-weight:900; line-height:1.25; display:flex; flex-direction:column; justify-content:space-between;
    position:relative; text-align:left; overflow:hidden; word-break:break-all;}
  .cell .rm{font-size:9.5px; font-weight:700; opacity:.6;}
  .cell .mk{position:absolute; top:4px; right:4px; width:14px; height:14px; border-radius:50%; background:var(--pink); color:#fff; font-size:8px; display:grid; place-items:center; border:1.5px solid #fff;}
  .cell .gt{position:absolute; bottom:4px; right:4px; font-size:8.5px; font-family:'Anton',Impact,sans-serif; color:var(--pink); border:1.5px solid var(--pink); border-radius:5px; padding:0 3px; transform:rotate(-8deg); background:#fff; letter-spacing:.3px;}
  .cell.now{box-shadow:0 0 0 2.5px var(--pink);}
  .cell.add{border:1.5px dashed #dedede; background:transparent; color:#cfcfcf; font-size:18px; align-items:center; justify-content:center;}
  .cell.blank{background:transparent;}

  /* list rows */
  .cr{display:flex; align-items:center; gap:12px; padding:12px 2px; border-bottom:1px solid #dcdcdc;}
  .cr:last-child{border-bottom:none;}
  .cr .sw{width:10px; height:38px; border-radius:6px; flex-shrink:0;}
  .cr .t{flex:1; min-width:0;}
  .cr .t b{font-size:15px; font-weight:900; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cr .t span{font-size:12px; color:var(--dim); font-weight:700;}
  .addb{background:var(--tx); color:#fff; font-weight:900; font-size:13px; padding:9px 13px; border-radius:16px; white-space:nowrap; flex-shrink:0;}
  .addb:disabled{background:#ddd; color:#999;}
  .addb.done{background:#fff; color:var(--dim);}
  .tog{font-weight:900; font-size:12px; padding:8px 11px; border-radius:14px; background:#fff; color:var(--dim); white-space:nowrap; flex-shrink:0; border:1.5px solid #e2e2e2;}
  .tog.on{background:var(--pink3); color:var(--pink); border-color:var(--pink2);}
  .tog:disabled{opacity:.35;}
  .together{font-size:12px; font-weight:900; color:var(--pink); margin-top:2px;}
  .beta{font-size:11px; font-weight:900; color:#fff; background:var(--mint); padding:3px 9px; border-radius:10px;}

  /* screens / sheets */
  .screen{position:fixed; inset:0; background:var(--bg); z-index:30; overflow-y:auto; transform:translateX(105%); transition:transform .28s cubic-bezier(.2,.8,.2,1); visibility:hidden;}
  .screen.open{transform:none; visibility:visible;}
  .screen .in{max-width:480px; margin:0 auto; padding:calc(16px + env(safe-area-inset-top)) 16px 60px;}
  .back{display:flex; align-items:center; gap:10px; padding:6px 2px 14px;}
  .back > button{width:48px; height:48px; border-radius:50%; background:#fff; display:grid; place-items:center; box-shadow:0 4px 14px rgba(0,0,0,.06); flex-shrink:0;}
  .back h3{margin:0; font-size:20px; font-weight:900; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .shade{position:fixed; inset:0; background:rgba(20,20,20,.38); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s;}
  .shade.open{opacity:1; pointer-events:auto;}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:41; transform:translateY(105%); transition:transform .28s cubic-bezier(.2,.8,.2,1); display:flex; justify-content:center; visibility:hidden;}
  .sheet.open{transform:none; visibility:visible;}
  .sheet .in{width:100%; max-width:480px; background:var(--bg); border-radius:32px 32px 0 0; padding:12px 20px calc(24px + env(safe-area-inset-bottom)); max-height:90vh; overflow-y:auto;}
  .grab{width:44px; height:5px; border-radius:3px; background:#d0d0d0; margin:0 auto 14px;}
  .sheet h3{margin:0 0 4px; font-size:21px; font-weight:900;}
  .sub{font-weight:700; color:var(--dim); font-size:13.5px;}
  label.f{display:block; font-size:13px; font-weight:900; color:var(--dim); margin:14px 4px 6px;}
  input.tx,textarea.tx,select.tx{width:100%; padding:14px 16px; border-radius:18px; border:1.5px solid var(--line); background:#fff; font-size:16px; font-family:inherit; font-weight:700; color:var(--tx); outline:none;}
  input.tx:focus,textarea.tx:focus,select.tx:focus{border-color:var(--pink);}
  textarea.tx{resize:none; height:72px;}
  .chips{display:flex; gap:8px; flex-wrap:wrap;}
  .chips button{padding:10px 14px; border-radius:18px; background:#fff; font-size:13.5px; font-weight:900; color:#555; border:1.5px solid #e6e6e6;}
  .chips button.on{background:var(--pink3); color:var(--pink); border-color:var(--pink2);}
  .colors{display:flex; gap:10px; flex-wrap:wrap;}
  .colors button{width:36px; height:36px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1.5px #ddd;}
  .colors button.on{box-shadow:0 0 0 3px var(--tx);}
  .btn{display:block; width:100%; padding:17px; border-radius:24px; background:var(--tx); color:#fff; font-size:17px; font-weight:900; margin-top:18px; text-align:center;}
  .btn.pk{background:var(--pink);}
  .btn.ghost{background:#fff; color:var(--tx);}
  .btn.danger{background:none; color:var(--red); font-size:14px; margin-top:6px; padding:10px;}
  .btn:disabled{opacity:.35;}
  .bigin{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:22px; border-radius:28px; background:var(--tx); color:#fff; font-size:22px; font-weight:900; margin-top:16px;}
  .bigin.done{background:#fff; color:var(--tx); border:2px solid var(--tx); font-size:17px; padding:16px;}
  .shot{width:100%; aspect-ratio:4/3; border-radius:26px; background:#fff; border:2px dashed var(--pink2); display:grid; place-items:center; overflow:hidden;
    background-size:cover; background-position:center; text-align:center; color:var(--pink); font-weight:900; margin-top:6px;}
  .shot .big{font-size:40px; display:block; margin-bottom:6px;}
  .shot.has{border:none;}
  .phrow{display:flex; gap:8px; margin-top:8px;}
  .phrow button{flex:1; padding:11px; border-radius:16px; background:#fff; font-weight:900; font-size:13px;}
  .rule{background:#fff; border-radius:18px; padding:10px 14px; font-size:12px; font-weight:700; color:#666; line-height:1.6; margin-top:10px;}
  .rule b{color:var(--tx);}
  .crop{position:relative; width:100%; aspect-ratio:4/3; border-radius:24px; overflow:hidden; background:#222; touch-action:none; margin-top:8px;}

<script>

/* =========================================================

const DAYS = ['月','火','水','木','金'];
const PRESETS = {

const MY_SEED = [

// デモの友だち(本番では承認した友だちのデータがサーバーから届く)
const FDEF = [
  {id:'f1', name:'そうご', emoji:'🌅', bg:0, fac:'商学部', rate:.85, got:['英語コミュニケーション'], cls:[
    [0,1,'英語コミュニケーション','2-301'],[0,2,'簿記原理','8-201'],[1,2,'心理学概論','大講義室A'],[2,2,'プログラミング基礎','情報演習室'],
    [2,3,'マーケティング論','8-305'],[3,2,'経営学入門','8-101'],[4,3,'基礎ゼミ','研究棟402'],[4,4,'哲学','3-102']]},
  {id:'f2', name:'ゆい', emoji:'🍾', bg:4, fac:'文学部', rate:.8, got:['統計学入門'], cls:[
    [0,3,'統計学入門','5-102'],[1,2,'心理学概論','大講義室A'],[1,3,'日本文学史','3-305'],[2,1,'フランス語Ⅰ','2-202'],
    [2,4,'経済学原論','3-205'],[3,1,'韓国語Ⅰ','2-104'],[3,3,'メディア論','3-401'],[4,2,'美術史','3-110']]},
  {id:'f3', name:'けんと', emoji:'🏀', bg:5, fac:'法学部', rate:.65, got:[], cls:[
    [0,1,'英語コミュニケーション','2-301'],[0,4,'民法総論','法学棟201'],[1,1,'憲法','法学棟101'],[1,4,'社会学','3-201'],
    [2,3,'刑法総論','法学棟102'],[3,2,'政治学原論','3-301'],[3,3,'メディア論','3-401'],[4,2,'スポーツ科学','体育館']]},
  {id:'f4', name:'まな', emoji:'🎨', bg:3, fac:'総合政策学部', rate:.9, got:[], cls:[
    [0,2,'デザイン論','7-101'],[0,3,'統計学入門','5-102'],[1,3,'デザイン演習','アトリエ'],[2,2,'プログラミング基礎','情報演習室'],
    [3,4,'色彩論','7-202'],[4,3,'基礎ゼミ','研究棟402']]},
  {id:'f5', name:'はると', emoji:'🎸', bg:6, fac:'理工学部', rate:.75, got:[], cls:[
    [0,1,'線形代数','理工1-201'],[0,3,'統計学入門','5-102'],[1,1,'微分積分','理工1-101'],[2,3,'化学概論','理工2-301'],
    [3,2,'データ構造','理工3-201'],[4,1,'物理学実験','実験棟']]},
];

/* =========================================================
   ユーティリティ
   ========================================================= */
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key = c => `${c.name}|${c.day}|${c.period}`;
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0)/4294967296; }
const toMin = hm => { const [h,m]=hm.split(':').map(Number); return h*60+m; };
const fmtMin = m => `${Math.floor(m/60)%24}:${String(m%60).padStart(2,'0')}`;
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dateMs = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d).getTime(); };
const dayOfDate = s => { const w=new Date(dateMs(s)).getDay(); return (w>=1&&w<=5)? w-1 : -1; };
const md = s => { const [,m,d]=s.split('-').map(Number); return `${m}/${d}`; };
function names(list){ const n=list.map(f=>f.name); return n.length<=2 ? n.join('・') : `${n.slice(0,2).join('・')} ほか${n.length-2}人`; }

/* =========================================================
   状態(この端末に保存)
   ========================================================= */
const KEY = 'komalog.v2';
let demoAnchor = Date.now(); // デモ時刻は「設定した時刻 + 経過時間」で進む
let S = load();

function fresh(){
  const r = new Date(); const w = r.getDay(); const m = r.getHours()*60 + r.getMinutes();
  const realOk = w>=1 && w<=5 && m>=8*60+30 && m<=18*60;
  return {
    v:2, onboarded:false,
    me:{name:'', emoji:'🐣', bg:0, fac:'', handle:uid().slice(0,6)},
    classes:[], posts:[],
    groups:[{id:'g1', name:'統計のメンバー', members:['f2','f4']},{id:'g2', name:'軽音サークル', members:['f1','f3']}],
    friendState:{f1:'friend', f2:'friend', f3:'friend', f4:'friend', f5:'request'},
    sentReq:[], seen:{}, sent:{}, nudged:{}, notifs:[], notifSeen:0,
    settings:{ttAud:'friends', postAud:'friends', preset:90, demo:{on:!realOk, day:(w>=1&&w<=5)? w-1 : 2, min:11*60+20}},
    metrics:{openDays:[], checkins:0, photos:0, invites:0, reactions:0, nudges:0},
  };
}
function load(){
  try{ const j = JSON.parse(localStorage.getItem(KEY)); if(j && j.v===2) return Object.assign(fresh(), j); }catch(e){}
  return fresh();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch(e){ toast('端末の保存容量がいっぱいです。古い写真を消してね'); return false; }
}

/* =========================================================
   時刻(1日は午前4時から。デモ時刻にも対応)
   ========================================================= */
function now(){
  const dm = S.settings.demo;
  if(!dm.on) return new Date();
  const r = new Date(Date.now() - 4*3600e3); const w = r.getDay();
  const base = new Date(r.getFullYear(), r.getMonth(), r.getDate() + (w===0 ? -6 : 1-w) + dm.day, 0, dm.min);
  return new Date(base.getTime() + (Date.now() - demoAnchor));
}
const nowTs = () => now().getTime();
const logical = () => new Date(nowTs() - 4*3600e3);
const todayStr = () => ymd(logical());
function dayIdx(){ const w = logical().getDay(); return (w>=1&&w<=5)? w-1 : -1; }
function nowMin(){ const n = now(); let m = n.getHours()*60 + n.getMinutes(); if(n.getHours()<4) m += 1440; return m; }
function weekDates(off=0){
  const L = logical(); const w = L.getDay(); const diff = (w===0 ? -6 : 1-w) + off*7;
  return DAYS.map((_,i) => ymd(new Date(L.getFullYear(), L.getMonth(), L.getDate()+diff+i)));
}
function ago(ts){
  const s = (nowTs()-ts)/1000;
  if(s < 60) return 'たった今';
  if(s < 3600) return Math.floor(s/60)+'分前';
  if(s < 86400) return Math.floor(s/3600)+'時間前';
  return Math.floor(s/86400)+'日前';
}
const PER = () => PRESETS[S.settings.preset] || PRESETS[90];
function nowLabel(){
  const m = nowMin(), P = PER();
  if(m < toMin(P[0][0])) return '授業前';
  for(let i=0;i<P.length;i++){
    if(m >= toMin(P[i][0]) && m < toMin(P[i][1])) return `${i+1}限の途中`;
    if(i===1 && m >= toMin(P[1][1]) && m < toMin(P[2][0])) return '昼休み';
    if(i<P.length-1 && m >= toMin(P[i][1]) && m < toMin(P[i+1][0])) return '休み時間';
  }
  return '放課後';
}

/* =========================================================
   1日のコマ(授業・空きコマ・昼休み・放課後)
   ========================================================= */
function daySlots(classes, d){
  const P = PER();
  const cls = classes.filter(c => c.day===d).sort((a,b) => a.period-b.period);
  if(!cls.length) return [];
  const first = cls[0].period, last = cls[cls.length-1].period, out = [];
  const win = p => ({s:toMin(P[p-1][0]), e:toMin(P[p-1][1])});
  const lunch = {slot:'lunch', type:'lunch', win:{s:toMin(P[1][1]), e:toMin(P[2][0])}};
  for(let p=first; p<=last; p++){
    if(p===3 && first<=2) out.push(lunch);
    const c = cls.find(x => x.period===p);
    out.push(c ? {slot:'p'+p, type:'class', period:p, cls:c, win:win(p)} : {slot:'p'+p, type:'free', period:p, win:win(p)});
  }
  if(last<=2) out.push(lunch);
  const le = toMin(P[last-1][1]);
  out.push({slot:'after', type:'after', win:{s:le, e:le+180}});
  return out;
}
function slotName(s){
  if(s.type==='class') return `${s.period}限`;
  if(s.type==='free') return `${s.period}限 空きコマ`;
  if(s.type==='lunch') return '昼休み';
  return '放課後';
}
const slotTime = s => s.type==='after' ? `${fmtMin(s.win.s)}〜` : `${fmtMin(s.win.s)}–${fmtMin(s.win.e)}`;
function phaseOf(date, s){
  const t = todayStr();
  if(date < t) return 'past'; if(date > t) return 'future';
  const m = nowMin(); return m < s.win.s ? 'future' : m < s.win.e ? 'now' : 'past';
}
function canRecord(date, s){
  const t = todayStr();
  if(date > t || date < weekDates(0)[0]) return false;
  return date < t || nowMin() >= s.win.s - 30;
}
function postLabel(classes, p){
  if(p.slot==='lunch') return '昼休み';
  if(p.slot==='after') return '放課後';
  const per = +p.slot.slice(1);
  const c = classes.find(x => x.day===dayOfDate(p.date) && x.period===per);
  return c ? `${per}限 ${c.name}` : `${per}限 空きコマ`;
}
// 授業コマの記録状態: in=来た / photo=写真あり / none=記録なし / yet=これから  (※「欠席」は存在しない)
function recState(post, date, s){
  if(post) return (post.photo || post.ph) ? 'photo' : 'in';
  return phaseOf(date, s)==='future' ? 'yet' : 'none';
}
const REC_TXT = {in:'来た', photo:'写真あり', none:'記録なし', yet:'これから'};
function dotsHTML(states, line){
  const k = states.filter(s => s==='in'||s==='photo').length;
  const label = `記録 ${states.length}コマ中${k}コマ(` + states.map(s=>REC_TXT[s]).join('・') + ')';
  return `<span class="dts ${line?'line':''}" role="img" aria-label="${label}">${states.map(s=>`<i class="dt ${s}"></i>`).join('')}</span>`;
}
const LEGEND = `<div class="legend" aria-hidden="true"><span><i class="dt in"></i>来た</span><span><i class="dt photo"></i>写真あり</span><span><i class="dt none"></i>記録なし</span><span><i class="dt yet"></i>これから</span></div>`;

/* =========================================================
   デモの友だちデータ(時刻に合わせて生成)
   ========================================================= */
let FRIENDS = [];
function buildFriends(){
  FRIENDS = FDEF.map(fd => {
    const classes = fd.cls.map((c,i) => ({id:fd.id+'c'+i, day:c[0], period:c[1], name:c[2], room:c[3],
      color:COLORS[(i*3+fd.bg)%COLORS.length], got:fd.got.includes(c[2]), shareGot:fd.got.includes(c[2])}));
    const f = {...fd, classes}; f.posts = genPosts(f); return f;
  });
}
function genPosts(f){
  const today = todayStr(), m = nowMin(), P = PER(), posts = [];
  const mk = (date, slot, t, capKind, seed, classId, forcePhoto) => {
    const i = Math.floor(hash(seed+'i') * CAP[capKind].length);
    const photo = forcePhoto || hash(seed+'p') < .5;
    posts.push({id:`${f.id}-${date}-${slot}`, owner:f.id, date, slot, classId, checkin:!!classId, ts:dateMs(date)+t*60e3,
      ph: photo ? {bg:BGS[(i+slot.length)%BGS.length], emo:CAP[capKind][i][1]} : null,
      comment: (photo || hash(seed+'c') < .4) ? CAP[capKind][i][0] : '', aud:'friends'});
  };
  for(const off of [0,-1,-2]){
    weekDates(off).forEach((date,d) => {
      if(date > today) return;
      const cls = f.classes.filter(c => c.day===d).sort((a,b) => a.period-b.period);
      if(!cls.length) return;
      cls.forEach(c => {
        const seed = f.id+date+c.period;
        const t = toMin(P[c.period-1][0]) - 8 + Math.floor(hash(seed+'t')*14);
        if(date===today && m < t) return;
        if(hash(seed) > f.rate) return;
        mk(date, 'p'+c.period, t, 'p', seed, c.id, false);
      });
      const first = cls[0].period, last = cls[cls.length-1].period;
      const lt = toMin(P[1][1]) + 12 + Math.floor(hash(f.id+date+'lt')*20);
      if(first<=2 && last>=3 && !(date===today && m<lt) && hash(f.id+date+'L') < .55) mk(date, 'lunch', lt, 'lunch', f.id+date+'L', null, true);
      const at = toMin(P[last-1][1]) + 15;
      if(!(date===today && m<at) && hash(f.id+date+'A') < .3) mk(date, 'after', at, 'after', f.id+date+'A', null, true);
    });
  }
  return posts.sort((a,b) => a.ts-b.ts);
}
const friends = () => FRIENDS.filter(f => S.friendState[f.id]==='friend');
const fById = id => FRIENDS.find(f => f.id===id);
const fPost = (f, date, slot) => f.posts.find(p => p.date===date && p.slot===slot);
const myPost = (date, slot) => S.posts.find(p => p.date===date && p.slot===slot);
const friendsWith = c => c ? friends().filter(f => f.classes.some(x => key(x)===key(c))) : [];
// その時間に「お互い空いている」友だち(その日キャンパスにいて、そのコマに授業がない)
function freeFriends(d, s){
  return friends().filter(f => {
    const cl = f.classes.filter(c => c.day===d); if(!cl.length) return false;
    const ps = cl.map(c => c.period), first = Math.min(...ps), last = Math.max(...ps);
    if(s.type==='lunch') return first<=2 && last>=3;
    if(s.type==='free') return first<=s.period && s.period<=last && !ps.includes(s.period);
    return false;
  });
}

const SMILE = `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round"><circle cx="9.2" cy="10" r=".9" fill="#222"/><circle cx="14.8" cy="10" r=".9" fill="#222"/><path d="M7.5 13.6c1.1 1.9 2.7 2.8 4.5 2.8s3.4-.9 4.5-2.8"/></svg>`;

const STAR = w => `<svg viewBox="0 0 120 110" width="${w}" aria-hidden="true"><g stroke="#222" stroke-width="3" stroke-linecap="round" fill="none">

function audLabel(a){ const o = audOptions().find(x => x[0]===a); return o ? o[1] : '👥 友だち全員'; }
const photoStyle = p => p.photo ? `background-image:url('${p.photo}')` : p.ph ? `background:${p.ph.bg}` : '';
const phEmo = p => (!p.photo && p.ph) ? `<span class="phemo" aria-hidden="true">${p.ph.emo}</span>` : '';

let tab = 'home', viewWeek = 0, viewDay = null;
function selDay(){ if(viewDay==null){ const d = dayIdx(); viewDay = d<0 ? 4 : d; } return viewDay; }

function header(){
  const t = todayStr(), d = dayIdx();
  const dm = S.settings.demo;
  const lbl = d<0 ? `${md(t)}(${'日月火水木金土'[logical().getDay()]})・週末` : `${md(t)}(${DAYS[d]})・いまは${nowLabel()}`;
  return `<div class="hd"><div class="logo">KOMALOG</div>
    <button class="me-btn" data-act="settings" aria-label="プロフィールと設定">${avatar(S.me.emoji,S.me.bg,42)}</button></div>
    <div class="hint"><span class="ic">${CAM}</span>${lbl}
      ${dm.on ? `<button class="demo-chip" data-act="settings">デモ時刻 ${DAYS[dm.day]} ${fmtMin(dm.min)}</button>` : ''}</div>`;

function weekStrip(wd, d){
  const t = todayStr();
  const title = viewWeek===0 ? '今週' : viewWeek===-1 ? '先週' : `${md(wd[0])}の週`;
  return `<div class="wkbar"><button data-act="wk" data-v="-1" aria-label="前の週" ${viewWeek<=-2?'disabled':''}>‹</button><span>${title}</span>
      <button data-act="wk" data-v="1" aria-label="次の週" ${viewWeek>=0?'disabled':''}>›</button></div>
    <div class="wk">${wd.map((dt,i) => { const n = S.posts.filter(p => p.date===dt).length;
      return `<button data-act="day" data-v="${i}" class="${i===d?'on':''} ${dt===t?'today':''}" aria-label="${DAYS[i]}曜 ${md(dt)}${dt===t?' 今日':''} 記録${n}件" aria-pressed="${i===d}">
        <small>${dt===t?'今日':DAYS[i]}</small><b>${+dt.slice(8)}</b><span class="wdots">${'<i></i>'.repeat(Math.min(4,n))}</span></button>`; }).join('')}</div>`;

function whoCard(){
  const fr = friends(); const t = todayStr(), d = dayIdx();
  if(!fr.length) return `<div class="card who"><div class="who-h"><b>今日、誰がいる？</b></div>
    <div class="empty">まだ友だちがいません。<br><button class="lnk" data-act="settings">友だちを招待する</button></div></div>`;
  const P = PER(), m = nowMin();
  const curP = P.findIndex(p => m >= toMin(p[0]) && m < toMin(p[1])) + 1;
  const list = fr.map(f => {
    const ps = f.posts.filter(p => p.date===t);
    const cur = curP ? f.classes.find(c => c.day===d && c.period===curP) : null;
    let cap, on = ps.some(p => p.checkin);
    if(cur && ps.some(p => p.slot==='p'+curP)) cap = `${curP}限 ${cur.name}`;
    else if(ps.length) cap = postLabel(f.classes, ps[ps.length-1]);
    else cap = f.classes.some(c => c.day===d) ? '記録なし' : '今日は授業なし';
    return {f, cap, on: on || ps.length>0, last: ps.length ? ps[ps.length-1].ts : 0};
  }).sort((a,b) => (b.on-a.on) || (b.last-a.last));
  const here = list.filter(x => x.on).length;
  return `<div class="card who"><div class="who-h">${SPARK}<b>今日、誰がいる？</b><span>来てる ${here}人</span></div>
    <div class="who-row">${list.map(x => `<button class="who-p" data-act="friend" data-v="${x.f.id}" aria-label="${x.f.name}: ${x.cap}">
      <span class="ring ${x.on?'on':''}">${avatar(x.f.emoji,x.f.bg,52)}${x.on?'<i class="ck">✓</i>':''}</span>
      <b>${x.f.name}</b><small class="${x.on?'on':''}">${esc(x.cap)}</small></button>`).join('')}</div></div>`;
}

function suggestions(){
  const d = dayIdx(); if(d<0) return [];
  const t = todayStr(), m = nowMin(), out = [];
  const slots = daySlots(S.classes, d);
  for(const s of slots){
    if(s.type!=='class' || m > s.win.e - 15 || m < s.win.s - 45) continue;
    if(myPost(t, s.slot)) continue;
    const here = friendsWith(s.cls).filter(f => fPost(f,t,s.slot)?.checkin);
    if(!here.length) continue;
    out.push({k:`go:${t}:${s.slot}`, to:here, text:`<b>${names(here)}</b> がもう<b>${esc(s.cls.name)}</b>に来てる`,
      btn:'🏃 俺も今から行く', msg:'俺も今から行く！', kind:'go'});
    break;
  }
  for(const s of slots){
    if(!(s.type==='free' || s.type==='lunch') || m >= s.win.e) continue;
    const fr = freeFriends(d, s); if(!fr.length) continue;
    const isNow = m >= s.win.s;
    const label = s.type==='lunch' ? '昼休み' : `${s.period}限の空きコマ`;
    const lunch = s.type==='lunch';
    out.push({k:`free:${t}:${s.slot}`, to:fr, text:`${isNow?'いま':'次の'}${label}、<b>${names(fr)}</b> も空いてる`,
      btn: lunch ? (isNow ? '🍙 ご飯行こう' : '🍙 終わったらご飯') : '☕️ 集まろ',
      msg: lunch ? (isNow ? 'いまからご飯行こう！' : '終わったらご飯行こう！') : '空きコマどこいる？集まろ〜', kind: lunch ? 'lunch' : 'free'});
    break;
  }
  return out;
}
function suggestHTML(){
  return suggestions().map(s => { const sent = S.nudged[s.k];
    return `<div class="sug">${faceStack(s.to, null, null, 30)}<p>${s.text}</p>
      <button class="${sent?'sent':''}" data-act="nudge" data-v="${esc(s.k)}" ${sent?'disabled':''}>${sent?'送った ✓':s.btn}</button></div>`; }).join('');
}

function mySlotCard(date, s){
  const p = myPost(date, s.slot), ph = phaseOf(date, s), d = dayOfDate(date);
  const isNow = ph==='now';
  const photo = p && p.photo;
  const open = `data-act="slot" data-v="${date}|${s.slot}"`;
  const nowPl = isNow ? '<span class="pl now">いま</span>' : '';
  const rx = p && p.reactions && p.reactions.length ? `<span class="rxs" aria-label="リアクション${p.reactions.length}件">${p.reactions.slice(-3).map(r=>r.e).join('')} ${p.reactions.length}</span>` : '';
  const aud = p ? `<span class="aud">${audLabel(p.aud)}</span>` : '';
  if(s.type==='class'){
    const c = s.cls, fr = friendsWith(c);
    const st = recState(p, date, s);
    const on = fr.filter(f => fPost(f,date,s.slot)?.checkin);
    let fl = '';
    if(fr.length){
      const txt = on.length ? `${names(on)} ${ph==='past'&&date!==todayStr()?'も来てた':'が来てる'}` : `${names(fr)} も履修中`;
      fl = `${faceStack(fr, date, s.slot)}<span class="t">${txt}</span>`;
    }
    let right;
    if(p) right = rx || (photo ? '' : `<button class="go lite" ${open}>📷 写真</button>`);
    else if(canRecord(date, s)) right = `<button class="go" data-act="go" data-v="${date}|${s.slot}">${date===todayStr()?'来た！':'記録する'}</button>`;
    else right = `<span class="later">${ph==='future' ? fmtMin(s.win.s)+'〜' : ''}</span>`;
    return `<div class="slot ${photo?'ph':''} ${isNow?'now':''}" style="${photo ? `background-image:url('${photo}')` : `--c:${c.color}`}" ${open} role="button" tabindex="0"
        aria-label="${s.period}限 ${esc(c.name)} ${REC_TXT[st]}">
      <div class="top"><span class="pl">${s.period}限 ${slotTime(s)}</span>${nowPl}<span class="pl st ${st==='in'||st==='photo'?'in':'none'}">${st==='photo'?'📷 ':st==='in'?'✓ ':''}${REC_TXT[st]}</span></div>
      <div class="ttl">${esc(c.name)}</div><div class="rm">📍 ${esc(c.room||'教室未設定')}</div>
      ${p && p.comment ? `<div class="cm">${esc(p.comment)}</div>` : ''}
      ${c.got ? `<span class="stamp">単位GET<small>${c.shareGot?'友だちに公開':'自分だけ'}</small></span>` : ''}
      <div class="bot"><div class="fl">${fl}</div>${aud}${right}</div></div>`;
  }
  // 空きコマ・昼休み・放課後
  const fr = (s.type==='free'||s.type==='lunch') && date===todayStr() ? freeFriends(d, s) : [];
  const cls = s.type==='lunch' ? 'lunch' : s.type==='after' ? 'after' : 'free';
  const fl = fr.length ? `${faceStack(fr, null, null, 26)}<span class="t">${names(fr)} も空いてる</span>` : '';
  let right = '';
  if(p) right = rx;
  else if(canRecord(date, s)) right = `<button class="mini" ${open}>＋ 一枚残す</button>`;
  const hasPh = p && (p.photo || p.ph);
  return `<div class="slot sm ${cls} ${hasPh?'ph':''} ${isNow?'now':''}" style="${p ? photoStyle(p) : ''}" ${open} role="button" tabindex="0" aria-label="${slotName(s)}">
    ${p ? phEmo(p) : ''}
    <div class="top"><span class="pl">${slotName(s)} ${slotTime(s)}</span>${nowPl}</div>
    ${p && p.comment ? `<div class="cm">${esc(p.comment)}</div>` : !p ? `<div class="ttl">${s.type==='lunch'?'🍙 お昼なにする？':s.type==='after'?'🌇 今日の締めの一枚':'☕️ 空きコマ'}</div>` : ''}
    ${(fl || right || aud) ? `<div class="bot"><div class="fl">${fl}</div>${p?aud:''}${right}</div>` : ''}</div>`;
}

function friendRow(f, date){
  const t = todayStr(), d = dayOfDate(date);
  const ps = f.posts.filter(p => p.date===date);
  const slots = daySlots(f.classes, d).filter(s => s.type==='class');
  const states = slots.map(s => recState(fPost(f,date,s.slot), date, s));
  const k = states.filter(s => s==='in'||s==='photo').length;
  const last = ps[ps.length-1];
  let st;
  if(last){
    const lbl = postLabel(f.classes, last);
    st = last.ts > (S.seen[f.id]||0) ? `<div class="st new">${esc(lbl)}${last.classId?'に来た':'の一枚'}${last.ph?' 📷':''}</div>`
      : `<div class="st">閲覧済み<small>${ago(last.ts)}</small></div>`;
  } else if(date > t) st = `<div class="st">予定 ${slots.length}コマ</div>`;
  else st = `<div class="st">${slots.length ? '記録なし' : 'この日は授業なし'}</div>`;
  const lp = [...ps].reverse().find(p => p.ph || p.photo);
  const thumb = lp ? `<div class="thumb" style="${photoStyle(lp)}">${lp.ph ? lp.ph.emo : ''}</div>` : `<div class="thumb" style="background:${BGS[f.bg]}">${f.emoji}</div>`;
  const sm = last && (S.sent[last.id]||{e:[]}).e.includes('😊');
  return `<div class="card row" data-act="friend" data-v="${f.id}" role="button" tabindex="0">${thumb}
    <div class="mid"><div class="name">${f.name}<span class="fac">${f.fac}</span></div>${st}</div>
    ${slots.length ? `<div class="dwrap">${dotsHTML(states)}<em>${k}/${slots.length}</em></div>` : ''}
    <button class="smile ${sm?'done':''}" data-act="smile" data-v="${last?last.id:''}" ${last?'':'disabled'} aria-label="${f.name}の最新の投稿に😊" aria-pressed="${!!sm}">${SMILE}</button>${CHEV}</div>`;
}

function homeView(){
  const wd = weekDates(viewWeek), d = selDay(), date = wd[d], t = todayStr(), isToday = date===t;
  let h = header() + weekStrip(wd, d);
  if(isToday) h += whoCard() + suggestHTML();
  const slots = daySlots(S.classes, d);
  const cs = slots.filter(s => s.type==='class');
  const states = cs.map(s => recState(myPost(date, s.slot), date, s));
  const k = states.filter(s => s==='in'||s==='photo').length;
  h += `<div class="dayhd"><h2>${isToday ? 'きょうのわたし' : `${md(date)}(${DAYS[d]})のわたし`}</h2>
    ${cs.length ? `<span class="rec">${dotsHTML(states, true)} ${k}/${cs.length} 記録</span>` : ''}</div>`;
  if(cs.length) h += LEGEND + slots.map(s => mySlotCard(date, s)).join('');
  else h += `<div class="card" style="text-align:center">${STAR(84)}<div class="empty" style="padding:8px 0 4px">${S.classes.length ? 'この日は授業なし。' : 'まだ時間割がありません。<br>まずは1コマだけでOK！'}</div>
    ${S.classes.length ? '' : '<button class="btn" data-act="tab" data-v="tt">時間割に授業を追加</button>'}</div>`;
  if(isToday || date < t){
    const fr = friends().filter(f => f.classes.some(c => c.day===d) || f.posts.some(p => p.date===date));
    if(fr.length){
      const rows = fr.map(f => { const ps = f.posts.filter(p => p.date===date); const last = ps.length ? ps[ps.length-1].ts : 0;
        return {f, last, isNew: last > (S.seen[f.id]||0)}; }).sort((a,b) => (b.isNew-a.isNew) || (b.last-a.last));
      h += `<div class="sec-t"><span>友だちの${isToday?'きょう':md(date)}</span></div>` + rows.map(r => friendRow(r.f, date)).join('');
    }
  }
  h += `<p class="note" style="text-align:center;margin-top:18px">「来た」は本人の自己申告です。大学の正式な出席記録ではありません。<br>記録がないことは欠席を意味しません。</p>`;
  return h;
}

let showAllPool = false;
function gridHTML(){
  const wd = weekDates(0), td = dayIdx(), P = PER(), m = nowMin();
  const curP = P.findIndex(p => m >= toMin(p[0]) && m < toMin(p[1])) + 1;
  const maxP = Math.max(5, ...S.classes.map(c => c.period));
  let h = `<div class="tt"><div></div>` + DAYS.map((x,i) => `<div class="h ${i===td?'today':''}">${x}</div>`).join('');
  for(let p=1; p<=maxP; p++){
    h += `<div class="p">${p}</div>`;
    for(let d=0; d<5; d++){
      const c = S.classes.find(x => x.day===d && x.period===p);
      if(c){
        const rec = myPost(wd[d], 'p'+p);
        h += `<button class="cell ${d===td&&p===curP?'now':''}" style="background:${c.color}" data-act="cell" data-v="${c.id}" aria-label="${DAYS[d]}${p}限 ${esc(c.name)}${rec?' 今週来た':''}">
          <span>${esc(c.name)}</span><span class="rm">${esc(c.room||'')}</span>${rec?'<span class="mk">✓</span>':''}${c.got?'<span class="gt">GET</span>':''}</button>`;
      } else h += `<button class="cell add" data-act="addcell" data-v="${d}-${p}" aria-label="${DAYS[d]}${p}限に授業を追加">+</button>`;
    }
  }
  return h + '</div>';
}
function friendClassPool(){
  const map = new Map();
  friends().forEach(f => f.classes.forEach(c => { const k = key(c); if(!map.has(k)) map.set(k, {c, fr:[]}); map.get(k).fr.push(f); }));
  return [...map.values()].filter(x => !S.classes.some(m => key(m)===key(x.c)))
    .sort((a,b) => b.fr.length-a.fr.length || a.c.day-b.c.day || a.c.period-b.c.period);
}
function poolRow(x){
  const clash = S.classes.find(m => m.day===x.c.day && m.period===x.c.period);
  return `<div class="cr"><span class="sw" style="background:${x.c.color}"></span>
    <div class="t"><b>${esc(x.c.name)}</b><span>${DAYS[x.c.day]}${x.c.period}限 ・ ${esc(x.c.room)}</span></div>${faceStack(x.fr, null, null, 26)}
    <button class="addb" data-act="addk" data-v="${esc(key(x.c))}" ${clash?'disabled':''}>${clash?'かぶり':'＋ 追加'}</button></div>`;
}
function ttView(){
  let h = header();
  h += `<div class="card ttc"><div class="ttc-h"><b>今週の時間割</b><button class="lnk" data-act="settings">${audLabel(S.settings.ttAud)}に公開</button></div>
    ${gridHTML()}<p class="note"><span style="color:var(--pink)">✓</span> 今週「来た」を記録　<span style="color:var(--pink);font-family:Anton,Impact">GET</span> 単位GET　＋ で授業を追加</p></div>`;
  const pool = friendClassPool();
  if(pool.length){
    h += `<div class="sec-t"><span>友だちの授業から追加</span><span class="r">入力なしでワンタップ</span></div>
      <div class="card" style="padding:4px 16px">${(showAllPool ? pool : pool.slice(0,4)).map(poolRow).join('')}
      ${pool.length>4 ? `<button class="btn ghost" style="margin:6px 0 12px;padding:12px;font-size:14px" data-act="more">${showAllPool?'閉じる':`ほか${pool.length-4}件を見る`}</button>` : ''}</div>`;
  }
  if(S.classes.length){
    const got = S.classes.filter(c => c.got).length;
    h += `<div class="sec-t"><span>学期のしめくくり</span><span class="beta">学期末に</span></div>
      <div class="card" style="padding:14px 18px 8px">
        <p class="note" style="margin:0 0 6px">取れた授業に「単位GET」スタンプを押せます。<b>初期設定は自分だけ</b>。見せたい授業だけ友だちに公開できます。取れなかった授業や成績は表示されません。</p>
        ${[...S.classes].sort((a,b) => a.day-b.day || a.period-b.period).map(c => {
          const tog = c.got ? friendsWith(c).filter(f => f.classes.find(x => key(x)===key(c))?.shareGot) : [];
          return `<div class="cr"><span class="sw" style="background:${c.color}"></span><div class="t"><b>${esc(c.name)}</b>
            <span>${DAYS[c.day]}${c.period}限</span>${tog.length ? `<div class="together">🎉 ${names(tog)} と一緒に取れた！</div>` : ''}</div>
            <button class="tog ${c.got?'on':''}" data-act="got" data-v="${c.id}" aria-pressed="${!!c.got}">${c.got?'✓ 単位GET':'単位GET'}</button>
            <button class="tog ${c.shareGot?'on':''}" data-act="share" data-v="${c.id}" ${c.got?'':'disabled'} aria-pressed="${!!c.shareGot}">${c.shareGot?'👥 公開中':'🔒 自分だけ'}</button></div>`; }).join('')}
        ${got ? `<p class="note">自分だけに表示: ${got}コマ 単位GET</p>` : ''}</div>`;
  }
  return h;
}

/* =========================================================
   記録(来た / 写真 / ひとこと)
   ========================================================= */
function slotOf(date, slot){ return daySlots(S.classes, dayOfDate(date)).find(s => s.slot===slot); }
function quickCheckin(date, slot){
  const s = slotOf(date, slot); if(!s || myPost(date, slot) || !canRecord(date, s)) return;
  const p = {id:uid(), date, slot, classId:s.cls ? s.cls.id : null, checkin:true, ts:nowTs(), photo:null, comment:'', aud:S.settings.postAud, reactions:[]};
  S.posts.push(p); S.metrics.checkins++; save(); render();
  toast(`✓ ${s.cls ? s.cls.name : slotName(s)} に来た！ カードから写真も足せます`);
  simReact(p);
}

let draft = null;
function openPost(date, slot){
  const s = slotOf(date, slot); if(!s) return;
  const p = myPost(date, slot);
  if(!p && !canRecord(date, s)){ toast(phaseOf(date,s)==='future' ? `${fmtMin(s.win.s)}の30分前から記録できます` : '今週より前の日は記録できません'); return; }
  draft = {date, slot, s, id:p ? p.id : null, photo:p ? p.photo : null, comment:p ? p.comment : '', aud:p ? p.aud : S.settings.postAud};
  renderPostSheet(); openSheet();
}
function renderPostSheet(){
  const {s, date} = draft; const p = draft.id ? S.posts.find(x => x.id===draft.id) : null;
  const isClass = s.type==='class';
  const title = isClass ? s.cls.name : slotName(s);
  const fr = isClass ? friendsWith(s.cls) : [];

  if(fr.length) h += `<div style="display:flex;align-items:center;gap:8px;margin-top:10px">${faceStack(fr, date, s.slot)}<span style="font-size:13px;font-weight:900;color:var(--pink)">${names(fr)} も履修中</span></div>`;
  if(isClass){
    h += p ? `<div class="bigin done">✓ 来た　<small style="font-weight:700;color:var(--dim)">${fmtMin(new Date(p.ts).getHours()*60+new Date(p.ts).getMinutes())} に記録</small></div>`
           : `<button class="bigin" data-act="psave" data-v="checkin">来た！</button><p class="note" style="text-align:center">ワンタップでOK。写真とひとことは任意です。</p>`;
  }
  h += `<label class="f">写真(任意)</label>`;
  h += draft.photo
    ? `<div class="shot has" style="background-image:url('${draft.photo}')" role="img" aria-label="添付した写真"></div>
       <div class="phrow"><button data-act="pphoto">撮り直す・選び直す</button><button data-act="pdelphoto">写真を外す</button></div>`
    : `<button class="shot" data-act="pphoto"><div><span class="big">📷</span>${isClass?'机の上の一枚でOK':'この時間の一枚を残す'}<div style="font-size:12px;color:var(--dim);margin-top:4px">撮影 or 写真を選ぶ → 投稿前にトリミング</div></div></button>`;
  h += `<div class="rule">📌 <b>撮影のルール</b>：人の顔、スライド・配布資料・板書は写さないでね。授業中の撮影は先生の指示に従ってください。机・飲み物・窓の外などで十分です。</div>`;
  h += `<label class="f">ひとこと(任意)</label><textarea class="tx" id="pCm" maxlength="60" placeholder="${isClass?'前の席とれた / ねむい など':'学食のカレー / 図書館こもる など'}">${esc(draft.comment)}</textarea>`;
  h += `<label class="f">公開範囲</label><div class="chips">${audOptions().map(([v,l]) => `<button data-act="paud" data-v="${v}" class="${draft.aud===v?'on':''}" aria-pressed="${draft.aud===v}">${esc(l)}</button>`).join('')}</div>`;
  h += `<button class="btn pk" data-act="psave">${p ? '保存する' : isClass ? '来た！ で投稿' : '投稿する'}</button>`;
  if(p) h += `<button class="btn danger" data-act="pdel">この記録を取り消す</button>`;
  h += `<p class="note" style="text-align:center">「来た」は自己申告の記録です。大学の出席とは関係ありません。</p>`;
  document.getElementById('sheetIn').innerHTML = h;
  const cm = document.getElementById('pCm'); cm.oninput = () => { draft.comment = cm.value; };
}
function savePost(onlyCheckin){
  const {s, date} = draft;
  const comment = onlyCheckin ? draft.comment : (document.getElementById('pCm')?.value || '').trim();
  if(s.type!=='class' && !draft.photo && !comment){ toast('写真かひとことを入れてね'); return; }
  let p = draft.id ? S.posts.find(x => x.id===draft.id) : null;
  const isNew = !p;
  const hadPhoto = p && p.photo;
  const backup = p ? {...p} : null;
  if(!p){ p = {id:uid(), date, slot:draft.slot, classId:s.cls ? s.cls.id : null, checkin:s.type==='class', ts:nowTs(), reactions:[]}; S.posts.push(p); }
  Object.assign(p, {photo:draft.photo, comment, aud:draft.aud});
  if(!save()){ // 容量オーバー: 変更を戻す
    if(isNew) S.posts = S.posts.filter(x => x !== p); else Object.assign(p, backup);
    return;
  }
  if(isNew && s.type==='class') S.metrics.checkins++;
  if(draft.photo && !hadPhoto) S.metrics.photos++;
  save(); closeSheet(); render();
  toast(isNew ? (s.type==='class' ? `✓ ${s.cls.name} に来た！` : '一枚残しました') : '保存しました');
  if(isNew || (draft.photo && !hadPhoto)) simReact(p);
}

/* ---------- 写真: 選択 → トリミング(4:3) ---------- */
let crop = null;
document.getElementById('fileIn').onchange = e => {
  const file = e.target.files[0]; e.target.value = ''; if(!file) return;
  const url = URL.createObjectURL(file); const img = new Image();
  img.onload = () => { URL.revokeObjectURL(url); openCrop(img); };
  img.onerror = () => { URL.revokeObjectURL(url); toast('画像を読み込めませんでした'); };
  img.src = url;
};
function openCrop(img){
  const W = 800, H = 600;
  const base = Math.max(W/img.width, H/img.height);
  crop = {img, W, H, base, zoom:1, x:(W - img.width*base)/2, y:(H - img.height*base)/2};
  document.getElementById('sheetIn').innerHTML = `<h3>トリミング</h3><div class="sub">ドラッグで位置、スライダーで拡大。人の顔や資料が入らないように。</div>
    <div class="crop"><canvas id="cv" width="${W}" height="${H}"></canvas><div class="grid"></div></div>
    <input type="range" id="zm" min="1" max="3" step="0.01" value="1" aria-label="拡大">
    <div class="phrow"><button data-act="ccancel">やめる</button><button data-act="cok" style="background:var(--pink);color:#fff">この範囲で使う</button></div>`;
  const cv = document.getElementById('cv');
  drawCrop();
  let drag = null;
  cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); drag = {x:e.clientX, y:e.clientY}; };
  cv.onpointermove = e => { if(!drag) return; const k = W / cv.clientWidth;
    crop.x += (e.clientX-drag.x)*k; crop.y += (e.clientY-drag.y)*k; drag = {x:e.clientX, y:e.clientY}; drawCrop(); };
  cv.onpointerup = cv.onpointercancel = () => { drag = null; };
  document.getElementById('zm').oninput = e => {
    const oldS = crop.base*crop.zoom; crop.zoom = +e.target.value; const nS = crop.base*crop.zoom;
    crop.x = W/2 - (W/2 - crop.x) * nS/oldS; crop.y = H/2 - (H/2 - crop.y) * nS/oldS; drawCrop();
  };
}
function drawCrop(){
  const c = crop, cv = document.getElementById('cv'); if(!cv) return;
  const sc = c.base*c.zoom, dw = c.img.width*sc, dh = c.img.height*sc;
  c.x = Math.min(0, Math.max(c.W - dw, c.x)); c.y = Math.min(0, Math.max(c.H - dh, c.y));
  const ctx = cv.getContext('2d'); ctx.fillStyle = '#222'; ctx.fillRect(0,0,c.W,c.H);
  ctx.drawImage(c.img, c.x, c.y, dw, dh);
}

/* ---------- デモ: 友だちの反応(本番では実際の友だちから届く) ---------- */
function simReact(post){
  if(post.aud==='private' || post.simmed) return;
  post.simmed = true; save();
  let pool = post.classId ? friendsWith(S.classes.find(c => c.id===post.classId)) : [];
  if(post.aud && post.aud.startsWith('g:')){ const g = S.groups.find(x => 'g:'+x.id===post.aud); const mem = g ? g.members : [];
    pool = (pool.length ? pool : friends()).filter(f => mem.includes(f.id)); if(!pool.length) pool = friends().filter(f => mem.includes(f.id)); }
  if(!pool.length) pool = friends();
  if(!pool.length) return;
  const f = pool[Math.floor(Math.random()*pool.length)];
  setTimeout(() => {
    const p = S.posts.find(x => x.id===post.id); if(!p) return;
    const e = EMO[Math.floor(Math.random()*EMO.length)];
    (p.reactions = p.reactions || []).push({from:f.id, e, ts:nowTs()});
    addNotif(f.id, `が あなたの${postLabel(S.classes, p)}に ${e}`);
    save(); if(!document.getElementById('sheet').classList.contains('open')) render();
    toast(`${f.emoji} ${f.name} が ${e} しました`);
  }, 3500 + Math.random()*2500);
}
function addNotif(from, text){ S.notifs.push({id:uid(), from, text, ts:nowTs()}); if(S.notifs.length > 80) S.notifs.shift(); }

function sendNudge(k){
  const sg = suggestions().find(x => x.k===k); if(!sg || S.nudged[k]) return;
  S.nudged[k] = nowTs(); S.metrics.nudges++; save(); render();
  toast(`${names(sg.to)} に「${sg.msg}」を送りました`);
  const f = sg.to[0];
  const rep = {go:['はやく〜 前の席とっといた','待ってる！'], lunch:['いいね！学食前集合で','行く〜🍜'], free:['図書館2Fいるよ','ラウンジいる！']}[sg.kind];
  setTimeout(() => { const r = rep[Math.floor(Math.random()*rep.length)]; addNotif(f.id, `「${r}」`); save(); updateBell(); toast(`${f.emoji} ${f.name}「${r}」`); }, 2600);
}

let FV = null;
function openFriend(id){
  const f = fById(id); if(!f || S.friendState[id]!=='friend') return;
  FV = {id, week:viewWeek, day:tab==='home' ? selDay() : (dayIdx()<0 ? 4 : dayIdx())};
  const lt = f.posts.length ? f.posts[f.posts.length-1].ts : 0;
  S.seen[id] = Math.max(S.seen[id]||0, lt); save();
  renderFriend(true); openScreen();
}
function friendSlotCard(f, date, s){
  const p = fPost(f, date, s.slot), ph = phaseOf(date, s);
  const isClass = s.type==='class';
  if(!isClass && !p) return '';
  const st = isClass ? recState(p, date, s) : null;
  const hasPh = p && (p.photo || p.ph);
  const mine = isClass && S.classes.find(m => key(m)===key(s.cls));
  const style = hasPh ? photoStyle(p) : isClass ? `--c:${s.cls.color}` : '';
  let h = `<div class="slot ${isClass?'':'sm '+(s.type==='lunch'?'lunch':s.type==='after'?'after':'free')} ${hasPh?'ph':''}" style="${style};cursor:default">
    ${p ? phEmo(p) : ''}
    <div class="top"><span class="pl">${isClass ? s.period+'限 '+slotTime(s) : slotName(s)}</span>${ph==='now'?'<span class="pl now">いま</span>':''}
      ${isClass ? `<span class="pl st ${st==='in'||st==='photo'?'in':'none'}">${REC_TXT[st]}</span>` : ''}</div>
    ${isClass ? `<div class="ttl">${esc(s.cls.name)}</div><div class="rm">📍 ${esc(s.cls.room)}${mine?' ・ 🤝 あなたも履修':''}</div>` : ''}
    ${p && p.comment ? `<div class="cm">${esc(p.comment)}</div>` : ''}
    ${isClass && s.cls.shareGot ? '<span class="stamp">単位GET</span>' : ''}
    ${p ? `<div class="bot" style="flex-direction:column;align-items:stretch;gap:0"><span class="aud" style="opacity:.85">${ago(p.ts)}</span>${rxBar(p)}</div>` : ''}</div>`;
  return h;
}
function rxBar(p){
  const sent = S.sent[p.id] || {e:[], t:[]};
  return `<div class="rx">${EMO.map(e => `<button class="${sent.e.includes(e)?'on':''}" data-act="rx" data-v="${p.id}|${e}" aria-label="${e}" aria-pressed="${sent.e.includes(e)}">${e}</button>`).join('')}
    <button class="say" data-act="say" data-v="${p.id}">💬 ひとこと</button></div>
    ${sent.t.length ? `<span class="said">あなた「${sent.t.map(esc).join('」「')}」</span>` : ''}`;
}
function renderFriend(resetScroll){
  const f = fById(FV.id); if(!f) return;
  const wd = weekDates(FV.week), date = wd[FV.day], t = todayStr();
  // 共通点
  const same = f.classes.filter(c => S.classes.some(m => key(m)===key(c)));

  for(let d=0; d<5; d++){
    daySlots(S.classes, d).forEach(s => { if((s.type==='free'||s.type==='lunch') && freeFriends(d, s).includes(f)) mutual.push(`${DAYS[d]}${s.type==='lunch'?'昼':s.period}`); });
  }
  let h = `<div class="back"><button data-act="close" aria-label="戻る">${BACK}</button>${avatar(f.emoji,f.bg,44)}<h3>${f.name}<span class="fac">${f.fac}</span></h3></div>`;
  h += `<div class="card" style="background:var(--pink3);border-color:var(--pink2);padding:14px 18px">
    <div style="font-weight:900;font-size:14px;color:var(--pink)">🤝 同じ授業 ${same.length}コマ</div>
    <div style="font-size:13px;font-weight:700;margin-top:2px">${same.length ? same.map(c => esc(`${DAYS[c.day]}${c.period} ${c.name}`)).join(' / ') : 'なし。別の学部の時間割をのぞいてみよう'}</div>
    <div style="font-weight:900;font-size:14px;color:var(--pink);margin-top:8px">☕️ お互い空いてる時間</div>
    <div style="font-size:13px;font-weight:700;margin-top:2px">${mutual.length ? mutual.join('・') : 'なし'}</div></div>`;
  h += `<div class="wkbar"><button data-act="fwk" data-v="-1" ${FV.week<=-2?'disabled':''} aria-label="前の週">‹</button><span>${FV.week===0?'今週':FV.week===-1?'先週':md(wd[0])+'の週'}</span><button data-act="fwk" data-v="1" ${FV.week>=0?'disabled':''} aria-label="次の週">›</button></div>
    <div class="wk">${wd.map((dt,i) => { const n = f.posts.filter(p => p.date===dt).length;
      return `<button data-act="fday" data-v="${i}" class="${i===FV.day?'on':''} ${dt===t?'today':''}" aria-pressed="${i===FV.day}"><small>${dt===t?'今日':DAYS[i]}</small><b>${+dt.slice(8)}</b><span class="wdots">${'<i></i>'.repeat(Math.min(4,n))}</span></button>`; }).join('')}</div>`;
  const slots = daySlots(f.classes, FV.day);
  const cards = slots.map(s => friendSlotCard(f, date, s)).join('');
  h += cards || `<div class="card"><div class="empty">この日は授業なし</div></div>`;
  // 時間割(自分にも追加できる)
  h += `<div class="sec-t"><span>${f.name}の時間割</span><span class="r">ワンタップで自分にも追加</span></div><div class="card" style="padding:4px 16px">`;
  h += [...f.classes].sort((a,b) => a.day-b.day || a.period-b.period).map(c => {
    const have = S.classes.some(m => key(m)===key(c));
    const clash = !have && S.classes.find(m => m.day===c.day && m.period===c.period);
    return `<div class="cr"><span class="sw" style="background:${c.color}"></span><div class="t"><b>${esc(c.name)}${c.shareGot?' <span style="color:var(--pink);font-size:11px">単位GET</span>':''}</b><span>${DAYS[c.day]}${c.period}限 ・ ${esc(c.room)}</span></div>
      <button class="addb ${have?'done':''}" data-act="addk" data-v="${esc(key(c))}" ${have||clash?'disabled':''}>${have?'履修中':clash?'かぶり':'＋ 追加'}</button></div>`;
  }).join('') + '</div>';
  const sc = document.getElementById('scr'); const top = sc.scrollTop;
  document.getElementById('scrIn').innerHTML = h;
  sc.scrollTop = resetScroll ? 0 : top;
}
function openSay(pid){
  const p = FRIENDS.flatMap(f => f.posts).find(x => x.id===pid); if(!p) return;
  const f = fById(p.owner); const isToday = p.date===todayStr();
  const opts = [...(isToday ? ['俺も今から行く','終わったらご飯行こう'] : []), 'おつかれ〜','ノート見せて🙏','いい写真！','次いっしょに受けよ'];
  document.getElementById('sheetIn').innerHTML = `<h3>${f.name}にひとこと</h3><div class="sub">${esc(postLabel(f.classes,p))} への返信</div>
    <div class="chips" style="margin-top:14px">${opts.map(o => `<button data-act="phrase" data-v="${pid}|${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  openSheet();
}
function sendPhrase(pid, text){
  const s = S.sent[pid] || (S.sent[pid] = {e:[], t:[]});
  if(!s.t.includes(text)) s.t.push(text);
  S.metrics.reactions++; save(); closeSheet(); if(FV) renderFriend(false);
  const p = FRIENDS.flatMap(f => f.posts).find(x => x.id===pid); const f = p && fById(p.owner);
  toast(`「${text}」を送りました`);
  if(f && (text.includes('行く') || text.includes('ご飯'))){
    setTimeout(() => { const r = text.includes('ご飯') ? 'いいね！学食前で〜' : '前の席とっとく！'; addNotif(f.id, `「${r}」`); save(); updateBell(); toast(`${f.emoji} ${f.name}「${r}」`); }, 2600);
  }
}
function toggleRx(pid, e){
  const s = S.sent[pid] || (S.sent[pid] = {e:[], t:[]});
  const i = s.e.indexOf(e);
  if(i>=0) s.e.splice(i,1); else { s.e.push(e); S.metrics.reactions++; }
  save(); return i<0;
}

function saveClass(id){
  const c = id ? S.classes.find(x => x.id===id) : null;
  const name = document.getElementById('eName').value.trim();
  if(!name){ toast('授業名を入れてね'); return; }
  const nd = {name, day:+document.getElementById('eDay').value, period:+document.getElementById('ePer').value,
    room:document.getElementById('eRoom').value.trim(), color:editColor};
  const clash = S.classes.find(x => x.day===nd.day && x.period===nd.period && (!c || x.id!==c.id));
  if(clash){ toast(`${DAYS[nd.day]}${nd.period}限は「${clash.name}」が入っています`); return; }
  if(c){
    const moved = c.day!==nd.day || c.period!==nd.period;
    if(moved && S.posts.some(p => p.classId===c.id) && !confirm('曜日・時限を変えると、この授業のこれまでの記録は元のコマに残ります。変更しますか?')) return;
    Object.assign(c, nd);
  } else S.classes.push({id:uid(), got:false, shareGot:false, ...nd});
  save(); closeSheet(); render(); toast(c ? '保存しました' : `${name} を追加しました`);
}
function addFromKey(k){
  if(S.classes.some(m => key(m)===k)) return;
  const src = friends().flatMap(f => f.classes).find(c => key(c)===k); if(!src) return;
  if(S.classes.some(m => m.day===src.day && m.period===src.period)){ toast('そのコマには別の授業が入っています'); return; }
  S.classes.push({id:uid(), name:src.name, day:src.day, period:src.period, room:src.room, color:COLORS[S.classes.length % COLORS.length], got:false, shareGot:false});
  save(); render(); if(FV && document.getElementById('scr').classList.contains('open') && document.querySelector('#scrIn .wk')) renderFriend(false);
  toast(`✓ ${src.name}(${DAYS[src.day]}${src.period})を追加しました`);
}

function notifications(){
  const items = S.notifs.map(n => ({ts:n.ts, f:fById(n.from), text:n.text})).filter(x => x.f && S.friendState[x.f.id]==='friend');
  const t = todayStr(), n = nowTs();
  friends().forEach(f => f.posts.filter(p => p.date===t && p.ts<=n).forEach(p => {
    if(p.classId){ const c = f.classes.find(x => x.id===p.classId);
      if(S.classes.some(m => key(m)===key(c))) items.push({ts:p.ts, f, text:`が ${c.name} に来ました(同じ授業)`}); }
    else if(p.ph) items.push({ts:p.ts, f, text:`が ${postLabel(f.classes,p)}の一枚を投稿 📷`});
  }));
  return items.sort((a,b) => b.ts-a.ts).slice(0,40);
}

});
function plusAction(){
  const d = dayIdx(); if(d<0){ toast('今日は週末。平日に「来た」を記録できます'); return; }
  const t = todayStr(), m = nowMin();
  const slots = daySlots(S.classes, d);
  if(!slots.length){ toast('今日は授業がありません。時間割に追加してね'); tab = 'tt'; render(); return; }
  const s = slots.find(x => m >= x.win.s && m < x.win.e && x.type!=='after') || slots.find(x => x.type==='class' && m >= x.win.s-30 && m < x.win.s)
    || slots.find(x => m >= x.win.s && m < x.win.e) || [...slots].reverse().find(x => m >= x.win.s);
  if(!s){ toast(`今日の最初は ${fmtMin(slots[0].win.s)}〜。30分前から記録できます`); return; }
  openPost(t, s.slot);
}

/* =========================================================
   起動
   ========================================================= */
(function boot(){
  const real = ymd(new Date());
  if(!S.metrics.openDays.includes(real)){ S.metrics.openDays.push(real); save(); }
  buildFriends();
  if(!S.onboarded){ document.getElementById('onb').hidden = false; renderOnb(); }
  render();
  setInterval(() => {
    buildFriends();
    const busy = document.getElementById('sheet').classList.contains('open') || ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);
    if(!busy) render();
  }, 60000);
})();
</script>

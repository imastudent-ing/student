<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f4">
<title>KOMALOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f4f4; --card:#ececec; --line:#e2e2e2;
    --tx:#111; --dim:#8a8a8a; --dim2:#b8b8b8;
    --pink:#e24fd2; --pink2:#f5c6ee; --pink3:#fce6f8; --rose:#e2677f;
    --mint:#5fd6bd; --red:#e25555;
    --r:30px;
    color-scheme:light;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--tx);
    font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN',system-ui,sans-serif;}
  body{min-height:100vh; display:flex; justify-content:center; overflow-x:hidden;}
  body::after{content:""; position:fixed; inset:0; pointer-events:none; z-index:99;
    box-shadow:inset 0 0 0 3px #ee8ce4, inset 0 0 38px rgba(238,140,228,.4);}
  button{font-family:inherit; color:inherit; cursor:pointer; border:none; background:none; padding:0; font-size:inherit;}
  button:disabled{cursor:default;}
  #app{width:100%; max-width:480px; min-height:100vh; padding:calc(16px + env(safe-area-inset-top)) 16px 150px;}

  /* header */
  .hd{display:flex; justify-content:space-between; align-items:center; padding:8px 12px 0;}
  .logo{font-family:'Anton',Impact,'Arial Narrow',sans-serif; font-size:44px; color:var(--mint); letter-spacing:.5px; line-height:1;
    transform:scaleY(1.12); transform-origin:left center;}
  .me-btn{width:62px; height:62px; border-radius:50%; background:#fff; display:grid; place-items:center; box-shadow:0 6px 20px rgba(0,0,0,.08);}
  .av{border-radius:50%; display:grid; place-items:center; overflow:hidden; flex-shrink:0; line-height:1;}
  .hint{display:flex; align-items:center; gap:10px; margin:16px 12px 18px; color:var(--dim); font-weight:900; font-size:15px;}
  .hint .ic{width:26px; height:26px; border-radius:50%; background:var(--pink); display:grid; place-items:center; flex-shrink:0;}
  .hint .ht{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
  .demo-chip{margin-left:auto; flex-shrink:0; min-height:40px; font-size:11px; font-weight:900; color:var(--pink); background:var(--pink3); padding:9px 12px; border-radius:20px; white-space:nowrap;}

  /* cards */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:22px 24px; margin-bottom:12px;}
  .hero{padding:22px 22px 18px; margin-bottom:30px;}
  .hero .top{display:flex; gap:8px; align-items:flex-start;}
  .hero h2{margin:0 0 6px; font-size:23px; font-weight:900;}
  .hero p{margin:0; color:var(--dim); font-size:14px; line-height:1.6; font-weight:700;}
  .fstrip{display:flex; gap:12px; overflow-x:auto; scrollbar-width:none; margin:14px -22px 0 0; padding:4px 22px 2px 2px;}
  .fstrip::-webkit-scrollbar{display:none;}
  .fp{width:58px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:5px;}
  .fp b{font-size:12px; font-weight:900; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ring{position:relative; padding:2px; border-radius:50%; border:2.5px solid transparent;}
  .ring.ok{border-color:var(--pink);}
  .pb{position:absolute; right:-8px; bottom:-4px; height:19px; border-radius:10px; background:var(--pink); color:#fff; font-size:10px; font-weight:900;
    display:grid; place-items:center; padding:0 5px; border:2px solid #fff; font-style:normal; white-space:nowrap;}

  /* class rows (reference style) */
  .row{display:flex; align-items:center; gap:14px; padding:14px 14px; background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    margin-bottom:12px; width:100%; text-align:left; cursor:pointer; transition:box-shadow .2s;}
  .row.now{box-shadow:0 0 0 2.5px var(--pink);}
  .thumb{width:68px; height:68px; border-radius:18px; flex-shrink:0; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.08); position:relative;
    display:grid; place-items:center; overflow:hidden; background-size:cover; background-position:center;}
  .pn{font-family:'Anton',Impact,sans-serif; font-size:30px; color:rgba(0,0,0,.32); line-height:1;}
  .pn small{font-family:'Zen Maru Gothic',sans-serif; font-size:11px; font-weight:900; margin-left:1px;}
  .phe{font-size:30px;}
  .getb{position:absolute; right:3px; top:3px; font-family:'Anton',Impact,sans-serif; font-size:9.5px; color:var(--pink); background:#fff; border:1.5px solid var(--pink);
    border-radius:6px; padding:0 3px; transform:rotate(-8deg); letter-spacing:.3px; line-height:1.4;}
  .row .mid{flex:1; min-width:0;}
  .row .tm{font-size:12px; font-weight:900; color:var(--dim); display:flex; align-items:center; flex-wrap:wrap; gap:2px 6px; white-space:nowrap;}
  .nowtag{background:var(--pink); color:#fff; border-radius:10px; padding:1px 8px; font-size:11px; white-space:nowrap;}
  .row .name{font-size:18px; font-weight:900; margin-top:2px; line-height:1.3; line-break:strict;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .row .who{display:flex; align-items:center; gap:4px; margin-top:4px; font-size:13px; font-weight:900; color:var(--pink); min-width:0;}
  .row .who.gray{color:var(--dim);}
  .row .who .t{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
  .row .who .v{flex-shrink:0; white-space:nowrap;}
  .stk{display:flex; padding-left:6px; flex-shrink:0;}
  .stk .av{margin-left:-6px; border:1.5px solid #fff;}
  .smile{width:48px; height:48px; border-radius:50%; background:var(--pink2); border:1.5px solid var(--rose); display:grid; place-items:center; flex-shrink:0; transition:transform .15s;}
  .smile.done{background:var(--pink); border-color:var(--pink);}
  .smile.done svg *{stroke:#fff;} .smile.done svg circle{fill:#fff;}
  .smile.past{background:#fff; border-color:var(--pink2);}
  .smile.wait{background:#fff; border-color:#d6d6d6; opacity:.6;}
  .smile:active{transform:scale(.88);}
  .pop{animation:pop .45s ease;}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28) rotate(-10deg)}100%{transform:scale(1)}}
  @media (max-width:400px){ .row{gap:10px; padding:12px;} .row .thumb{width:56px; height:56px; border-radius:16px;} .row .pn{font-size:24px;} }
  .empty{text-align:center; color:var(--dim); font-weight:900; padding:26px 10px; font-size:14px; line-height:1.7;}
  .note{font-size:12px; color:var(--dim); font-weight:700; margin:8px 4px 0; line-height:1.6;}
  .foot{text-align:center; margin-top:26px; color:var(--dim2);}
  .lnk{font-size:13px; font-weight:900; color:var(--pink); background:#fff; padding:11px 16px; border-radius:20px; display:inline-block; margin-top:6px;}

  /* bottom nav */
  .nav{position:fixed; left:0; right:0; bottom:0; padding:0 16px calc(20px + env(safe-area-inset-bottom)); display:flex; justify-content:center; z-index:20; pointer-events:none;}
  .nav-in{width:100%; max-width:448px; display:flex; justify-content:space-between; align-items:center; pointer-events:auto;}
  .circ{width:70px; height:70px; border-radius:50%; background:#fff; display:grid; place-items:center; box-shadow:0 8px 24px rgba(0,0,0,.09); position:relative;}
  .circ .badge{position:absolute; top:13px; right:14px; width:13px; height:13px; border-radius:50%; background:var(--pink); border:2px solid #fff;}
  .circ.on{background:var(--pink3);}
  .smile.skip{background:#fff3c4; border-color:#e6c65a; font-size:24px;}
  .skipbtn{display:block; width:100%; margin-top:8px; padding:13px; border-radius:22px; background:#fff; font-weight:900; font-size:15px; color:#8a6d00;}
  .post .cm{display:block; padding:0 14px 12px 62px; margin-top:-6px; font-size:14px; font-weight:700; line-height:1.5;}
  .nbadge{position:absolute; top:6px; right:4px; min-width:22px; height:22px; border-radius:11px; background:var(--pink); color:#fff; font-size:11.5px; font-weight:900; display:grid; place-items:center; padding:0 6px; border:2px solid #fff;}
  .post{background:var(--card); border:1px solid var(--line); border-radius:26px; overflow:hidden; margin-bottom:12px; width:100%; text-align:left; display:block;}
  .post .pp{width:100%; aspect-ratio:4/3; background-size:cover; background-position:center; display:grid; place-items:center; font-size:64px;}
  .post .pm{display:flex; align-items:center; gap:10px; padding:12px 14px;}
  .post .pm .t{flex:1; min-width:0;}
  .post .pm b{display:block; font-size:15px; font-weight:900;}
  .post .pm span{display:block; font-size:12.5px; font-weight:700; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .post .pm time{font-size:12px; font-weight:900; color:var(--pink); white-space:nowrap;}
  .pill{background:#fff; border-radius:40px; padding:8px; display:flex; gap:4px; box-shadow:0 8px 24px rgba(0,0,0,.09);}
  .pill button{padding:14px 26px; border-radius:30px; font-size:17px; font-weight:900; color:#666; white-space:nowrap;}
  .pill button.on{background:#e4e4e4; color:var(--tx);}

  /* timetable grid */
  .ttc{padding:14px 12px 14px;}
  .wkbar{display:flex; align-items:center; justify-content:space-between; margin:0 2px 12px;}
  .wkbar b{font-size:17px; font-weight:900;}
  .wkbar button{width:44px; height:44px; border-radius:50%; background:#fff; font-size:20px; font-weight:900; color:#333;}
  .wkbar button:disabled{opacity:.25;}
  .tt{display:grid; grid-template-columns:22px repeat(5,minmax(0,1fr)); gap:5px;}
  .tt .h{font-size:13px; font-weight:900; color:var(--dim); text-align:center; padding:2px 0 3px; line-height:1.2;}
  .tt .h small{display:block; font-size:10px; font-weight:700;}
  .tt .h.today{color:var(--pink);}
  .tt .p{font-size:12px; font-weight:900; color:var(--dim2); display:grid; place-items:center;}
  .cell{min-height:70px; border-radius:14px; background:#fff; padding:6px 5px; font-size:11px; font-weight:900; line-height:1.25; display:flex; flex-direction:column; justify-content:space-between;
    position:relative; text-align:left; overflow:hidden; word-break:normal; overflow-wrap:anywhere; line-break:strict; background-size:cover; background-position:center;}
  .cell > *{position:relative; z-index:1;}
  .cell:has(.mk,.same){padding-top:19px;}
  .cell:has(.gt,.fr){padding-bottom:18px;}
  .cell .rm{font-size:9.5px; font-weight:700; opacity:.6;}
  .cell.ph{color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.5);}
  .cell.ph::before{content:""; position:absolute; inset:0; z-index:0; background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.05) 60%,rgba(0,0,0,.25));}
  .cell.ph .rm{opacity:.9;}
  .cell .mk{position:absolute; top:3px; right:3px; width:15px; height:15px; border-radius:50%; background:var(--pink); color:#fff; font-size:8px; display:grid; place-items:center; border:1.5px solid #fff; text-shadow:none; z-index:2;}
  .cell .same{position:absolute; top:2px; left:3px; font-size:11px; z-index:2; text-shadow:none;}
  .cell .gt{position:absolute; bottom:3px; left:3px; font-size:8.5px; font-family:'Anton',Impact,sans-serif; color:var(--pink); border:1.5px solid var(--pink); border-radius:5px; padding:0 3px;
    transform:rotate(-8deg); background:#fff; letter-spacing:.3px; text-shadow:none; z-index:2;}
  .cell .fr{position:absolute; right:3px; bottom:3px; z-index:2;}
  .cell .fr .stk .av{border-width:1px;}
  .cell.now{box-shadow:0 0 0 2.5px var(--pink);}
  .cell.add{background:rgba(255,255,255,.4); color:#d6d6d6; font-size:16px; align-items:center; justify-content:center;}
  .cell.blank{background:rgba(255,255,255,.35);}

  /* screens / sheets */
  .screen{position:fixed; inset:0; background:var(--bg); z-index:30; overflow-y:auto; transform:translateX(105%); transition:transform .28s cubic-bezier(.2,.8,.2,1); visibility:hidden;}
  .screen.open{transform:none; visibility:visible;}
  .screen .wrap{max-width:480px; margin:0 auto; padding:calc(16px + env(safe-area-inset-top)) 16px 60px;}
  .back{display:flex; align-items:center; gap:12px; padding:6px 2px 14px;}
  .back > button{width:48px; height:48px; border-radius:50%; background:#fff; display:grid; place-items:center; box-shadow:0 4px 14px rgba(0,0,0,.06); flex-shrink:0;}
  .back h3{margin:0; font-size:21px; font-weight:900;}
  .sec-t{font-size:14px; color:var(--dim); font-weight:900; margin:26px 8px 10px;}
  .shade{position:fixed; inset:0; background:rgba(20,20,20,.38); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s;}
  .shade.open{opacity:1; pointer-events:auto;}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:41; transform:translateY(105%); transition:transform .28s cubic-bezier(.2,.8,.2,1); display:flex; justify-content:center; visibility:hidden;}
  .sheet.open{transform:none; visibility:visible;}
  .sheet .body{width:100%; max-width:480px; background:var(--bg); border-radius:32px 32px 0 0; padding:12px 20px calc(24px + env(safe-area-inset-bottom)); max-height:90vh; overflow-y:auto; outline:none;}
  .grab{display:block; width:100%; height:26px; margin:-8px 0 8px; position:relative;}
  .grab::after{content:""; position:absolute; left:50%; top:10px; transform:translateX(-50%); width:44px; height:5px; border-radius:3px; background:#d0d0d0;}
  .sheet .body{transition:transform .2s;}
  .phead{display:block; width:100%; text-align:left;}
  .pbar{display:flex; flex-wrap:wrap; gap:6px; padding:0 12px 12px 12px;}
  .rxc{min-height:34px; padding:4px 6px; background:none; font-size:15px; font-weight:900; display:flex; align-items:center; gap:3px; color:#555;}
  .rxc.on{color:var(--pink);}
  .clist{display:flex; flex-direction:column; gap:12px; margin-top:14px;}
  .ci{display:flex; gap:10px; align-items:flex-start;}
  .ci p{margin:0; font-size:14px; font-weight:700; line-height:1.5; flex:1; min-width:0; word-break:break-word;}
  .ci p b{font-weight:900; margin-right:6px;}
  .ci time{font-size:11px; color:var(--dim2); font-weight:700; white-space:nowrap; padding-top:2px;}
  .cform .csend{width:44px; height:44px; border-radius:50%; background:var(--pink); display:grid; place-items:center; flex-shrink:0;}
  .cform .csend svg{width:20px; height:20px;}
  .rxc.add{color:var(--dim);}
  .rxc.cmb{flex-shrink:0;}
  .pbar{align-items:center;}
  .rxe{font-size:19px; line-height:1; padding:4px 1px;}
  .rxe.on{filter:drop-shadow(0 0 3px rgba(226,79,210,.6));}
  .rxmore{font-size:14px; font-weight:900; color:var(--dim); padding:0 2px;}
  .ctk{flex:1; min-width:0; height:26px; overflow:hidden; display:flex; justify-content:flex-end; align-items:center;}
  .ctk-in{display:inline-flex; align-items:center; gap:5px; max-width:100%; font-size:12.5px; font-weight:700; color:#555; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; animation:ctkIn .5s ease both;}
  .ctk-in .av{flex-shrink:0;}
  .ctk-in.still{animation:none;}
  @keyframes ctkIn{from{transform:translateY(110%); opacity:0} to{transform:none; opacity:1}}
  @media (prefers-reduced-motion: reduce){ .ctk-in{animation:none;} }
  .rxpick{display:flex; gap:6px; padding:0 12px 12px;}
  .rxpick button{width:42px; height:42px; border-radius:50%; background:#fff; font-size:21px;}
  .cform{display:flex; gap:8px; margin-top:14px;}
  .cform input{flex:1; min-width:0;}
  .sheet h3{margin:0 0 4px; font-size:22px; font-weight:900;}
  .sub{font-weight:700; color:var(--dim); font-size:13.5px; line-height:1.6;}
  label.f,.f{display:block; font-size:13px; font-weight:900; color:var(--dim); margin:18px 4px 8px;}
  input.tx,select.tx{width:100%; padding:14px 16px; border-radius:18px; border:1.5px solid var(--line); background:#fff; font-size:16px; font-family:inherit; font-weight:700; color:var(--tx); outline:none;}
  input.tx:focus,select.tx:focus{border-color:var(--pink);}
  select.tx:disabled,input.tx:disabled{opacity:.5;}
  .chips{display:flex; gap:8px; flex-wrap:wrap;}
  .chips button{padding:11px 14px; border-radius:18px; background:#fff; font-size:13.5px; font-weight:900; color:#555; border:1.5px solid #e6e6e6;}
  .chips button.on{background:var(--pink3); color:var(--pink); border-color:var(--pink2);}
  .seg{display:flex; background:#fff; border-radius:20px; padding:5px; gap:4px; margin-top:14px;}
  .seg button{flex:1; padding:11px 4px; border-radius:16px; font-size:14px; font-weight:900; color:var(--dim);}
  .seg button.on{background:var(--tx); color:#fff;}
  .colors{display:flex; gap:10px; flex-wrap:wrap;}
  .colors button{width:40px; height:40px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1.5px #ddd;}
  .colors button.on{box-shadow:0 0 0 3px var(--tx);}
  .btn{display:block; width:100%; padding:17px; border-radius:24px; background:var(--tx); color:#fff; font-size:17px; font-weight:900; margin-top:20px; text-align:center;}
  .btn.pk{background:var(--pink);}
  .btn.ghost{background:#fff; color:var(--tx);}
  .btn.danger{background:none; color:var(--red); font-size:14px; margin-top:6px; padding:13px;}
  .btn.quiet{background:none; color:var(--dim); font-size:14px; margin-top:6px; padding:13px;}
  .herebtn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:18px; border-radius:28px; background:var(--pink); color:#fff; font-size:21px; font-weight:900; margin-top:18px;}
  .herebtn svg *{stroke:#fff;} .herebtn svg circle{fill:#fff;}
  .herest{display:flex; align-items:center; gap:10px; width:100%; padding:12px 14px; border-radius:24px; background:#fff; font-size:16px; font-weight:900; margin-top:18px;}
  .herest .smile{width:40px; height:40px;}
  .herest small{color:var(--dim); font-weight:700; font-size:13px;}
  .herest .undo{margin-left:auto; font-size:12px; color:var(--dim); font-weight:900; padding:12px;}
  .herest .ib{width:44px; height:44px; border-radius:50%; background:var(--bg); font-size:19px; display:grid; place-items:center; flex-shrink:0;}
  .herest .ib:first-of-type{margin-left:auto;}
  .postbtn{display:flex; align-items:center; justify-content:center; width:100%; height:60px; margin-top:18px; border-radius:30px; background:var(--pink); box-shadow:0 8px 20px rgba(226,79,210,.3);}
  .composer{background:#fff; border:2px solid var(--pink2); border-radius:28px; padding:12px; margin-top:16px; box-shadow:0 6px 18px rgba(226,79,210,.1);}
  .cmp-top{display:flex; align-items:center; gap:10px;}
  .cmp-top .seg{flex:1; margin-top:0; background:var(--bg);}
  .cmp-top .seg small{font-size:10.5px; font-weight:700; opacity:.8;}
  .cmp-in{display:block; width:calc(100% - 12px); margin:12px 6px 6px; border:none; outline:none; font-family:inherit; font-size:16px; font-weight:700; color:var(--tx); padding:0 2px;
    height:34px; background:linear-gradient(90deg, #d9d9d9 50%, transparent 0) 0 100% / 8px 2px repeat-x;}
  .cmp-in:focus{background:linear-gradient(90deg, var(--pink2) 50%, transparent 0) 0 100% / 8px 2px repeat-x;}
  .composer .phrow button{background:var(--bg);}
  .composer .audb{background:var(--bg); width:56px; height:56px; font-size:22px;}
  .composer .postbtn{height:56px;}
  .postbtn:disabled{opacity:.35; box-shadow:none;}
  .postrow{display:flex; gap:10px; align-items:center; margin-top:18px;}
  .postrow .postbtn{margin-top:0; flex:1;}
  .audb{width:60px; height:60px; border-radius:50%; background:#fff; font-size:24px; flex-shrink:0; display:grid; place-items:center;}
  .edb{width:34px; height:34px; border-radius:50%; background:transparent; font-size:15px; opacity:.55; flex-shrink:0; display:grid; place-items:center;}
  .postbtn:active{transform:scale(.97);}
  .toast button{color:#fff; font-weight:900; font-size:14px;}
  .herest.wait{color:var(--dim); justify-content:center; padding:16px;}
  .fline{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .fchip{display:flex; align-items:center; gap:6px; background:#fff; border-radius:22px; padding:5px 12px 5px 5px; min-height:40px; font-size:13px; font-weight:900; border:1.5px solid transparent;}
  .fchip.ok{border-color:var(--pink); color:var(--pink);}
  .fchip small{color:var(--dim); font-weight:700;}
  .phline{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:12px; padding:15px; border-radius:22px; background:#fff; border:1.5px dashed var(--pink2); color:var(--pink); font-weight:900; font-size:14px;}
  .shot{display:block; width:100%; max-width:270px; margin:0 auto; aspect-ratio:3/4; border-radius:24px; overflow:hidden; background-size:cover; background-position:center;}
  .phrow{display:flex; gap:8px; margin-top:10px;}
  .phrow button{flex:1; padding:13px; border-radius:16px; background:#fff; font-weight:900; font-size:13px;}

<script>

/* ============================================================

/* ---------- ユーティリティ ---------- */
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key = c => `${c.name}|${c.day}|${c.period}`;
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0)/4294967296; }
const toMin = hm => { const [h,m] = hm.split(':').map(Number); return h*60+m; };
const fmtMin = m => `${Math.floor(m/60)%24}:${String(m%60).padStart(2,'0')}`;

const isWeekdayDaytime = r => { const w = r.getDay(), m = r.getHours()*60 + r.getMinutes(); return w>=1 && w<=5 && m>=8*60+30 && m<=18*60; };

/* ---------- 状態(この端末に保存) ---------- */

let demoAnchor = Date.now(); // デモ時刻は「設定した時刻 + 経過時間」で進む
let lastSaved = null;
let S = load();
S.talk = S.talk || {}; S.talkSeen = S.talkSeen || {}; S.rx = S.rx || {}; S.pcm = S.pcm || {};
S.groups.forEach(g => { g.members = g.members.filter(id => S.friendState[id]==='friend'); }); // グループには今の友だちだけ
function fresh(){
  return {
    v:3, onboarded:false,
    me:{name:'', emoji:'🐣', bg:0, univ:'', fac:'', handle:uid().slice(0,6)},
    classes:[], recs:[], talk:{}, talkSeen:{}, feedSeen:0, rx:{}, pcm:{},

    // 友だちは承認してはじめてつながる
    friendState:{f1:'request', f2:'request', f3:'request', f4:'request', f5:'request'},
    sentReq:[],
    settings:{aud:'friends', preset:90, demo:{on:false, day:2, min:11*60+20}},
  };
}
function load(){
  try{ lastSaved = localStorage.getItem(KEY); const j = JSON.parse(lastSaved); if(j && j.v===3) return Object.assign(fresh(), j); }catch(e){}
  lastSaved = null; return fresh();
}
// 保存できなかったときは、画面の状態も最後に保存できた状態へ戻す(保存されていない変更が残らないように)
function save(quiet){
  try{ const j = JSON.stringify(S); localStorage.setItem(KEY, j); lastSaved = j; return true; }
  catch(e){
    if(!quiet) toast('端末の保存容量がいっぱいです。古い写真を外してね');
    if(lastSaved){ try{ S = Object.assign(fresh(), JSON.parse(lastSaved)); }catch(_){} }
    return false;
  }
}

/* ---------- 時刻(1日は午前4時から。デモ時刻にも対応) ---------- */
function now(){
  const dm = S.settings.demo;
  if(!dm.on) return new Date();

}
const nowTs = () => now().getTime();

function nowMin(){ const n = now(); let m = n.getHours()*60 + n.getMinutes(); if(n.getHours()<4) m += 1440; return m; }
function weekDates(off=0){
  const L = logical(); const w = L.getDay(); const diff = (w===0 ? -6 : 1-w) + off*7;
  return DAYS.map((_,i) => ymd(new Date(L.getFullYear(), L.getMonth(), L.getDate()+diff+i)));
}

}

      color:COLORS[(i*3+fd.bg)%COLORS.length], got:fd.got.includes(c[2]), shareGot:fd.got.includes(c[2]), P: fd.per ? PRESETS[fd.per] : null}));
    const f = {...fd, classes}; f.recs = genRecs(f); return f;
  });
}
function genRecs(f){
  const today = todayStr(), m = nowMin(), P = PER(), recs = [];
  for(const off of [0,-1,-2]){
    weekDates(off).forEach((date, d) => {
      if(date > today) return;
      f.classes.filter(c => c.day===d).forEach(c => {
        const seed = f.id+date+c.period;
        const t = win(c).s - 8 + Math.floor(hash(seed+'t')*14);
        if(date===today && m < t) return;
        if(hash(seed) > f.rate){ // 出なかった日に、本人が「飛ぶ」を投稿することもある
          if(hash(seed+'s') < .4){ const i = Math.floor(hash(seed+'k')*SKIP_LINES.length);
            recs.push({id:`${f.id}-${date}-${c.id}`, classId:c.id, date, kind:'skip', ts:dateMs(date)+(t-25)*60e3, comment:SKIP_LINES[i][0],
              ph: hash(seed+'q') < .5 ? {bg:BGS[Math.floor(hash(seed+'b')*BGS.length)], emo:SKIP_LINES[i][1]} : null}); }
          return;
        }
        const photo = hash(seed+'p') < .5;
        recs.push({id:`${f.id}-${date}-${c.id}`, classId:c.id, date, ts:dateMs(date)+t*60e3,
          ph: photo ? {bg:BGS[Math.floor(hash(seed+'b')*BGS.length)], emo:DEMO_PH[Math.floor(hash(seed+'e')*DEMO_PH.length)]} : null});
      });
    });
  }

}

      const mk = !!r; // 表示するのは今週だけ(前の週は出さない)
      const came = isMe && isToday ? friendsIn(c).filter(x => fHere(x.f, x.fc, wd[d])).map(x => x.f) : [];
      const act = isMe ? `data-act="cls" data-v="${c.id}|${wd[d]}"` : `data-act="fpost" data-v="${owner.id}|${c.id}|${wd[d]}"`;
      h += `<button class="cell ${r&&(r.photo||r.ph)?'ph':''} ${isToday&&p===curP?'now':''}" style="${bg}" ${act}
          aria-label="${DAYS[d]}${p}限 ${esc(c.name)}${mk?(isSkip(r)?' 飛んだ':' 来た'):''}${came.length?` ${names(came)}が来た`:''}${got?' 単位GET':''}${same?' 同じ授業':''}">

  const c0 = S.classes.find(x => x.id===cid); if(!c0) return null;

  if(!existed && !(kind==='skip' ? (date <= todayStr() && date >= weekDates(0)[0]) : canRecord(date, c0))) return null;
  const apply = withPhoto => {
    const c = S.classes.find(x => x.id===cid); if(!c) return null;

    if(!r){
      r = {id:uid(), classId:cid, date, ts:nowTs(), late: date < todayStr() || nowMin() >= win(c).e, photo:null, aud:audFor(c, date)};

let crop = null;
document.getElementById('avIn').onchange = e => {

    const prev = S.me.photo; S.me.photo = cv.toDataURL('image/jpeg', .8);
    if(!save()){ S.me.photo = prev; return; }

document.getElementById('fileIn').onchange = e => {

  img.onload = () => { URL.revokeObjectURL(url); if(CS) openCrop(img); };
  img.onerror = () => { URL.revokeObjectURL(url); toast('画像を読み込めませんでした'); };

function openCrop(img){
  const W = 600, H = 800, base = Math.max(W/img.width, H/img.height);
  crop = {img, W, H, base, zoom:1, x:(W - img.width*base)/2, y:(H - img.height*base)/2};
  document.getElementById('sheetIn').innerHTML = `<h3>トリミング</h3>
    <div class="sub">ドラッグで位置、スライダーで拡大。点線の内側が行の小さな写真になるよ。人の顔やスライド・資料は入れないでね。授業中に撮るときは先生のルールに従ってね。</div>
    <div class="crop"><canvas id="cv" width="${W}" height="${H}"></canvas><div class="sq"></div></div>
    <input type="range" id="zm" min="1" max="3" step="0.01" value="1" aria-label="拡大">
    <div class="phrow"><button data-act="ccancel">やめる</button><button data-act="cok" style="background:var(--pink);color:#fff">この範囲でのせる</button></div>`;
  const cv = document.getElementById('cv');
  drawCrop();
  let drag = null;
  cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); drag = {x:e.clientX, y:e.clientY}; };
  cv.onpointermove = e => { if(!drag) return; const k = W / cv.clientWidth;
    crop.x += (e.clientX-drag.x)*k; crop.y += (e.clientY-drag.y)*k; drag = {x:e.clientX, y:e.clientY}; drawCrop(); };
  cv.onpointerup = cv.onpointercancel = () => { drag = null; };
  document.getElementById('zm').oninput = e => {
    const o = crop.base*crop.zoom; crop.zoom = +e.target.value; const n = crop.base*crop.zoom;
    crop.x = W/2 - (W/2 - crop.x)*n/o; crop.y = H/2 - (H/2 - crop.y)*n/o; drawCrop();
  };
}
function drawCrop(){
  const c = crop, cv = document.getElementById('cv'); if(!c || !cv) return;
  const sc = c.base*c.zoom, dw = c.img.width*sc, dh = c.img.height*sc;
  c.x = Math.min(0, Math.max(c.W - dw, c.x)); c.y = Math.min(0, Math.max(c.H - dh, c.y));
  const ctx = cv.getContext('2d'); ctx.fillStyle = '#222'; ctx.fillRect(0,0,c.W,c.H);
  ctx.drawImage(c.img, c.x, c.y, dw, dh);
}

   ============================================================ */
let FSID = null;
function friendSheetHTML(f){
  const d = dayIdx(), t = todayStr();
  const today = d<0 ? [] : f.classes.filter(c => c.day===d).sort((a,b) => a.period-b.period);
  let h = `<div class="fhead">${avatar(f.emoji,f.bg,60)}<div style="flex:1;min-width:0"><h3>${f.name}</h3><span class="fac">${f.univ} ${f.fac}</span></div>
    <button class="edb" data-act="unfriend" data-v="${f.id}" aria-label="友だちをやめる"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.6 6.5-5.6s5.9 2 6.5 5.6"/><path d="M16 11h6"/></svg></button></div>`;
  if(!sameUniv(f)) h += `<p class="rule">${f.name}はちがう大学。授業の時間も${f.name}の大学のものです。</p>`;
  if(d>=0){
    h += `<div class="f">きょう</div><div class="card" style="padding:4px 16px">` + (today.length ? today.map(c => {
      const r = fRec(f, c, t), ph = phaseOf(t, c);
      return `<div class="li">${thumbHTML(c, r, c.shareGot)}<div class="t"><span>${c.period}限 ${timeText(c)}</span><b>${esc(c.name)}</b></div>
        <span class="st ${r&&!isSkip(r)?'ok':''}">${isSkip(r) ? '🏃' : r ? '☺︎ 来た' : ph==='future' ? '⏳' : ''}</span></div>`; }).join('')
      : '<div class="empty" style="padding:16px">きょうは授業なし</div>') + '</div>';
  }
  h += `<div class="f">時間割</div><div class="card ttc">${gridHTML(f.classes, weekDates(0), f)}</div>
    ${sameUniv(f) ? '<p class="rule">🤝 = 同じ授業 ・ マスをタップで投稿を見る</p>' : ''}`;
  return h;
}
function openFriend(id){
  const f = fById(id); if(!f || S.friendState[id]!=='friend') return;
  CS = null; ADD = null; FSID = id; FPV = null; CMV = null;
  document.getElementById('sheetIn').innerHTML = friendSheetHTML(f); openSheet();
}
let FPV = null;
function openFriendPost(v){
  FPV = v; CMV = null;
  const [fid, cid, date] = v.split('|'); const f = fById(fid); const c = f && f.classes.find(x => x.id===cid); if(!c) return;
  const r = fRec(f, c, date), k = key(c);
  const canAdd = sameUniv(f) && !S.classes.some(m => key(m)===k) && !S.classes.some(m => m.day===c.day && m.period===c.period);
  let h = `<button class="sbk" data-act="friend" data-v="${f.id}" aria-label="戻る">${BACK}</button>
    <h3>${esc(c.name)}</h3><div class="sub">${md(date)}(${DAYS[c.day]}) ${c.period}限 ${timeText(c)}</div><div style="margin-top:14px">`;
  h += r ? postCard({f, c, r}, false) : `<div class="empty">${date > todayStr() ? '⏳' : '—'}</div>`;
  h += '</div>';
  if(canAdd) h += `<button class="btn" data-act="fadd" data-v="${esc(k)}">＋ 自分の時間割にも追加</button>`;
  else if(sameUniv(f) && S.classes.some(m => key(m)===k)) h += `<p class="rule" style="text-align:center">🤝 同じ授業</p>`;
  const b = document.querySelector('#sheet .body'); $('sheetIn').innerHTML = h; b.scrollTop = 0;
}
function refreshFriendSheet(){
  const f = fById(FSID); if(!f) return;
  const b = document.querySelector('#sheet .body'), y = b.scrollTop;
  keepFocus(() => { document.getElementById('sheetIn').innerHTML = friendSheetHTML(f); b.scrollTop = y; });
}
function addFromKey(k){
  if(S.classes.some(m => key(m)===k)){ toast('もう時間割に入っています'); return false; }
  const src = friends().flatMap(f => f.classes).find(c => key(c)===k); if(!src) return false;
  const clash = S.classes.find(m => m.day===src.day && m.period===src.period);
  if(clash){ toast(`${DAYS[src.day]}${src.period}限は「${clash.name}」が入っています`); return false; }
  S.classes.push({id:uid(), name:src.name, day:src.day, period:src.period, room:src.room, color:COLORS[S.classes.length % COLORS.length], got:false, shareGot:false});
  if(!save()){ render(); return false; }
  render(); toast(`✓ ${src.name}(${DAYS[src.day]}${src.period}限)を追加しました`); return true;
}

/* ============================================================
   授業の追加・編集
   ============================================================ */
let ADD = null, editColor = null;
function friendPool(){
  const map = new Map();
  friends().filter(sameUniv).forEach(f => f.classes.forEach(c => { const k = key(c); if(!map.has(k)) map.set(k, {c, fr:[]}); map.get(k).fr.push(f); }));
  return [...map.values()].filter(x => !S.classes.some(m => key(m)===key(x.c)))
    .sort((a,b) => b.fr.length-a.fr.length || a.c.day-b.c.day || a.c.period-b.c.period);
}
function slotPool(){
  const {d, p} = ADD; let pool = friendPool();
  if(d!=null) pool = pool.filter(x => x.c.day===d && (p==null || x.c.period===p));
  return pool;
}
function openAdd(d, p){
  CS = null; FSID = null;
  ADD = {d, p, mode:'friends'};
  ADD.mode = slotPool().length ? 'friends' : 'manual';
  renderAdd(); openSheet();
}
function renderAdd(){ keepFocus(paintAdd, '.seg button.on'); }
function paintAdd(){
  const {d, p} = ADD;
  const pool = slotPool();
  const b = document.querySelector('#sheet .body'), y = b.scrollTop;
  let h = `<h3>授業を追加</h3><div class="sub">${d!=null ? `${d===dayIdx() && p==null ? 'きょう・' : ''}${DAYS[d]}曜${p!=null ? ` ${p}限` : ''}` : ''}</div>
    <div class="seg"><button data-act="amode" data-v="friends" class="${ADD.mode==='friends'?'on':''}">友だちの授業から</button><button data-act="amode" data-v="manual" class="${ADD.mode==='manual'?'on':''}">自分で入力</button></div>`;
  if(ADD.mode==='friends'){
    const row = x => { const clash = S.classes.some(m => m.day===x.c.day && m.period===x.c.period);
      return `<div class="li"><span class="sw" style="background:${x.c.color}"></span><div class="t"><b>${esc(x.c.name)}</b><span>${DAYS[x.c.day]}${x.c.period}限 ・ ${esc(x.c.room)}</span></div>
        ${faces(x.fr, 24)}<button class="addb" data-act="addk" data-v="${esc(key(x.c))}" ${clash?'disabled':''}>${clash?'かぶり':'＋ 追加'}</button></div>`; };
    const taken = d!=null && p!=null && S.classes.find(m => m.day===d && m.period===p);
    if(!pool.length) h += `<div class="empty">${taken ? `このコマには「${esc(taken.name)}」が入っています` : d==null ? '友だちの授業はぜんぶ追加済みです'
      : `${p!=null ? 'このコマ' : 'この日'}に友だちの授業はありません。<br>「自分で入力」から追加できます。`}</div>`;
    else if(d!=null) h += `<div class="card" style="padding:4px 16px;margin-top:14px">${pool.map(row).join('')}</div>`;
    else h += byDayTodayFirst(pool).map(g => `<div class="f">${g.d===dayIdx() ? 'きょう・' : ''}${DAYS[g.d]}曜</div><div class="card" style="padding:4px 16px">${g.items.map(row).join('')}</div>`).join('');
  } else h += classForm({day: d!=null ? d : Math.max(0, dayIdx()), period: p!=null ? p : 1, name:'', room:'', color:COLORS[S.classes.length % COLORS.length]}, true);
  document.getElementById('sheetIn').innerHTML = h; b.scrollTop = y;
}
function classForm(c, isNew){
  editColor = c.color;
  return `<label class="f" for="eName">授業名</label><input class="tx" id="eName" value="${esc(c.name)}" placeholder="例:心理学概論" maxlength="30">
    <div style="display:flex;gap:10px">
      <div style="flex:1"><label class="f" for="eDay">曜日</label><select class="tx" id="eDay">${DAYS.map((x,i) => `<option value="${i}" ${i===c.day?'selected':''}>${x}曜</option>`).join('')}</select></div>
      <div style="flex:1"><label class="f" for="ePer">時限</label><select class="tx" id="ePer">${PER().map((p,i) => `<option value="${i+1}" ${i+1===c.period?'selected':''}>${i+1}限 ${p[0]}〜</option>`).join('')}</select></div>
    </div>
    <label class="f" for="eS">時間(この授業だけ違うときに変更)</label>
    <div style="display:flex;align-items:center;gap:8px"><input class="tx" type="time" id="eS" style="flex:1;min-width:0" value="${fmtMin(win(c).s).padStart(5,'0')}"><span>–</span><input class="tx" type="time" id="eE" style="flex:1;min-width:0" value="${fmtMin(win(c).e).padStart(5,'0')}"></div>
    <label class="f" for="eRoom">教室(任意)</label><input class="tx" id="eRoom" value="${esc(c.room)}" placeholder="例:2-301" maxlength="20">
    <label class="f">色</label><div class="colors" id="eCol">${COLORS.map(x => `<button data-act="ecol" data-v="${x}" class="${x===c.color?'on':''}" style="background:${x}" aria-label="色"></button>`).join('')}</div>
    <button class="btn" data-act="esave" data-v="${isNew ? '' : c.id}">${isNew ? '追加する' : '保存する'}</button>`;
}
function openEdit(cid){
  const c = S.classes.find(x => x.id===cid); if(!c) return;
  CS = null; FSID = null; ADD = null;
  document.getElementById('sheetIn').innerHTML = `<h3>授業を編集</h3>` + classForm(c, false)
    + ((c.got || isSemEnd()) ? `<div id="semBox">${semHTML(c)}</div>` : '') + `<button class="btn danger" data-act="edel" data-v="${c.id}">この授業を削除</button>`;
  openSheet();
}
async function saveClass(id){
  const c = id ? S.classes.find(x => x.id===id) : null;
  const name = document.getElementById('eName').value.trim();
  if(!name){ toast('授業名を入れてね'); return; }
  const nd = {name, day:+document.getElementById('eDay').value, period:+document.getElementById('ePer').value,
    room:document.getElementById('eRoom').value.trim(), color:editColor};
  { const P = PER()[nd.period-1], sv = $('eS').value.replace(/^0(\d)/,'$1'), ev = $('eE').value.replace(/^0(\d)/,'$1');
    if(sv && ev && toMin(sv) >= toMin(ev)){ toast('終わりは始まりより後にしてね'); return; }
    nd.s = sv && sv!==P[0] ? sv : null; nd.e = ev && ev!==P[1] ? ev : null; }
  const clash = S.classes.find(x => x.day===nd.day && x.period===nd.period && (!c || x.id!==c.id));
  if(clash){ toast(`${DAYS[nd.day]}${nd.period}限は「${clash.name}」が入っています`); return; }
  if(c){
    const moved = c.day!==nd.day || c.period!==nd.period;
    if(moved && S.recs.some(r => r.classId===c.id)){
      if(!await ask('曜日・時限を変えると、この授業の ☺︎ と写真は消えます。変更しますか？', '変更する')) return;
      S.recs = S.recs.filter(r => r.classId!==c.id);
    }
    Object.assign(c, nd);
  } else S.classes.push({id:uid(), got:false, shareGot:false, ...nd});
  if(!save()){ render(); return; }
  closeSheet(); render(); toast(c ? '保存しました' : `${name} を追加しました`);
}

function finishOnb(demo){

function renderTalk(reset){
  const c = S.classes.find(x => x.id===TK); if(!c){ closeScreen(); return; }
  const k = key(c), ms = talkMsgs(c), fr = friendsIn(c).map(x => x.f);
  S.talkSeen[k] = nowTs(); save(true);
  const draft = $('tkIn') ? $('tkIn').value : '';
  let h = `<div class="back"><button data-act="close" aria-label="戻る">${BACK}</button><div style="min-width:0"><h3 style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.name)}</h3>

<div class="msgs">`;
  let last = '';
  ms.forEach(m => {
    const d = ymd(new Date(m.ts - 4*3600e3));
    if(d!==last){ h += `<span class="dsep">${d===todayStr() ? 'きょう' : md(d)}</span>`; last = d; }
    const f = m.from==='me' ? null : fById(m.from);

function sendTalk(){
  const c = S.classes.find(x => x.id===TK); const inp = $('tkIn'); const text = inp.value.trim(); if(!c || !text) return;
  const k = key(c); (S.talk[k] = S.talk[k] || []).push({id:uid(), from:'me', text, ts:nowTs()});
  if(!save()){ return; }
  inp.value = ''; renderTalk(false); $('tkIn').focus();
  const fr = friendsIn(c).map(x => x.f);
  if(fr.length){ // デモ: 同じ授業の友だちが返事をする
    const f = fr[Math.floor(Math.random()*fr.length)];

    setTimeout(() => { S.talk[k].push({id:uid(), from:f.id, text:rep, ts:nowTs()}); save(true);

    $('askMsg').textContent = msg; $('askYes').textContent = yes; $('ask').hidden = false; $('askYes').focus();

});
// 長押しで ☺︎(授業の行・時間割のマス)
let lp = null, lpFired = false;
document.addEventListener('pointerdown', e => {
  lpFired = false;
  const el = e.target.closest('#app [data-act=cls]'); if(!el || e.target.closest('.smile')) return;
  el.classList.add('pressing');
  lp = {el, x:e.clientX, y:e.clientY, t:setTimeout(() => { lpFired = true; el.classList.remove('pressing'); longPress(el.dataset.v); lp = null; }, 500)};
});
const lpCancel = () => { if(lp){ clearTimeout(lp.t); lp.el.classList.remove('pressing'); lp = null; } };
document.addEventListener('pointerup', lpCancel); document.addEventListener('pointercancel', lpCancel);
document.addEventListener('pointermove', e => { if(lp && Math.hypot(e.clientX-lp.x, e.clientY-lp.y) > 10) lpCancel(); });
document.addEventListener('click', e => { if(lpFired){ lpFired = false; e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener('contextmenu', e => { if(e.target.closest('#app [data-act=cls]')) e.preventDefault(); });
function longPress(v){
  const [cid, date] = v.split('|'); const c = S.classes.find(x => x.id===cid); if(!c) return;
  if(navigator.vibrate) try{ navigator.vibrate(15); }catch(e){}
  if(recOf(cid, date)){ toast('もう記録してあります'); return; }
  ACT.here(v);
}
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){ if(askDone){ askDone(false); return; } if($('sheet').classList.contains('open')) closeSheet(); else if($('scr').classList.contains('open')) closeScreen(); return; }
  if((e.key==='Enter' || e.key===' ') && e.target.matches('[role=button][data-act]')){ e.preventDefault(); e.target.click(); }
});

// シートは下にスワイプで閉じる
(() => {
  const body = $('sheet').querySelector('.body'); let y0 = null, dy = 0;
  body.addEventListener('touchstart', e => {
    if(e.target.closest('.crop, input[type=range]') || (body.scrollTop > 0 && !e.target.closest('.grab'))){ y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0;
  }, {passive:true});
  body.addEventListener('touchmove', e => {
    if(y0==null) return; dy = e.touches[0].clientY - y0;
    if(dy <= 0){ body.style.transform = ''; return; }
    e.preventDefault(); body.style.transition = 'none'; body.style.transform = `translateY(${dy}px)`;
  }, {passive:false});
  body.addEventListener('touchend', () => {
    if(y0==null) return; body.style.transition = ''; body.style.transform = ''; if(dy > 90) closeSheet(); y0 = null;
  });
})();

/* ---------- 起動 ---------- */
(function boot(){
  buildFriends();
  if('scrollRestoration' in history) history.scrollRestoration = 'manual';
  if(!S.onboarded){ $('onb').hidden = false; $('app').inert = true; $('nav').inert = true; renderOnb(); }
  render(); if(S.onboarded) scrollToNow();
  setInterval(() => {
    buildFriends();
    const a = document.activeElement;
    const busy = $('sheet').classList.contains('open') || ['INPUT','SELECT','TEXTAREA'].includes(a?.tagName);
    if(!busy) render();
  }, 60000);
})();
</script>

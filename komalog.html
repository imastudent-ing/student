<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f4">
<title>KOMALOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f4f4; --card:#ececec; --line:#e2e2e2;
    --tx:#111; --dim:#8a8a8a; --dim2:#b8b8b8;
    --pink:#e24fd2; --pink2:#f5c6ee; --pink3:#fce6f8; --rose:#e2677f;
    --mint:#5fd6bd; --red:#e25555;
    --r:30px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--tx);
    font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN',system-ui,sans-serif;}
  body{min-height:100vh; display:flex; justify-content:center; overflow-x:hidden;}
  body::after{content:""; position:fixed; inset:0; pointer-events:none; z-index:99;
    box-shadow:inset 0 0 0 3px #ee8ce4, inset 0 0 38px rgba(238,140,228,.4);}
  button{font-family:inherit; color:inherit; cursor:pointer; border:none; background:none; padding:0; font-size:inherit;}
  button:disabled{cursor:default;}
  #app{width:100%; max-width:480px; min-height:100vh; padding:calc(16px + env(safe-area-inset-top)) 16px 150px;}

  /* header */
  .hd{display:flex; justify-content:space-between; align-items:center; padding:8px 12px 0;}
  .logo{font-family:'Anton',Impact,'Arial Narrow',sans-serif; font-size:44px; color:var(--mint); letter-spacing:.5px; line-height:1;
    transform:scaleY(1.12); transform-origin:left center;}
  .me-btn{width:62px; height:62px; border-radius:50%; background:#fff; display:grid; place-items:center; box-shadow:0 6px 20px rgba(0,0,0,.08);}
  .av{border-radius:50%; display:grid; place-items:center; overflow:hidden; flex-shrink:0; line-height:1;}
  .hint{display:flex; align-items:center; gap:10px; margin:16px 12px 18px; color:var(--dim); font-weight:900; font-size:15px;}
  .hint .ic{width:26px; height:26px; border-radius:50%; background:var(--pink); display:grid; place-items:center; flex-shrink:0;}
  .hint .ht{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
  .demo-chip{margin-left:auto; flex-shrink:0; font-size:11px; font-weight:900; color:var(--pink); background:var(--pink3); padding:9px 12px; border-radius:20px; white-space:nowrap;}

  /* cards */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:22px 24px; margin-bottom:12px;}
  .hero{padding:22px 22px 18px; margin-bottom:30px;}
  .hero .top{display:flex; gap:8px; align-items:flex-start;}
  .hero h2{margin:0 0 6px; font-size:23px; font-weight:900;}
  .hero p{margin:0; color:var(--dim); font-size:14px; line-height:1.6; font-weight:700;}
  .fstrip{display:flex; gap:12px; overflow-x:auto; scrollbar-width:none; margin-top:14px; padding:4px 8px 2px 2px;}
  .fstrip::-webkit-scrollbar{display:none;}
  .fp{width:58px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:5px;}
  .fp b{font-size:12px; font-weight:900; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ring{position:relative; padding:2px; border-radius:50%; border:2.5px solid transparent;}
  .ring.ok{border-color:var(--pink);}
  .pb{position:absolute; right:-8px; bottom:-4px; height:19px; border-radius:10px; background:var(--pink); color:#fff; font-size:10px; font-weight:900;
    display:grid; place-items:center; padding:0 5px; border:2px solid #fff; font-style:normal; white-space:nowrap;}

  /* class rows (reference style) */
  .row{display:flex; align-items:center; gap:14px; padding:14px 14px; background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    margin-bottom:12px; width:100%; text-align:left; cursor:pointer; transition:box-shadow .2s;}
  .row.now{box-shadow:0 0 0 2.5px var(--pink);}
  .thumb{width:68px; height:68px; border-radius:18px; flex-shrink:0; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.08); position:relative;
    display:grid; place-items:center; overflow:hidden; background-size:cover; background-position:center;}
  .pn{font-family:'Anton',Impact,sans-serif; font-size:30px; color:rgba(0,0,0,.32); line-height:1;}
  .pn small{font-family:'Zen Maru Gothic',sans-serif; font-size:11px; font-weight:900; margin-left:1px;}
  .phe{font-size:30px;}
  .getb{position:absolute; right:3px; top:3px; font-family:'Anton',Impact,sans-serif; font-size:9.5px; color:var(--pink); background:#fff; border:1.5px solid var(--pink);
    border-radius:6px; padding:0 3px; transform:rotate(-8deg); letter-spacing:.3px; line-height:1.4;}
  .row .mid{flex:1; min-width:0;}
  .row .tm{font-size:12px; font-weight:900; color:var(--dim); display:flex; align-items:center; flex-wrap:wrap; gap:2px 6px; white-space:nowrap;}
  .nowtag{background:var(--pink); color:#fff; border-radius:10px; padding:1px 8px; font-size:11px; white-space:nowrap;}
  .row .name{font-size:18px; font-weight:900; margin-top:2px; line-height:1.3; line-break:strict;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .row .who{display:flex; align-items:center; gap:4px; margin-top:4px; font-size:13px; font-weight:900; color:var(--pink); min-width:0;}
  .row .who.gray{color:var(--dim);}
  .row .who .t{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
  .row .who .v{flex-shrink:0; white-space:nowrap;}
  .stk{display:flex; padding-left:6px; flex-shrink:0;}
  .stk .av{margin-left:-6px; border:1.5px solid #fff;}
  .smile{width:48px; height:48px; border-radius:50%; background:var(--pink2); border:1.5px solid var(--rose); display:grid; place-items:center; flex-shrink:0; transition:transform .15s;}
  .smile.done{background:var(--pink); border-color:var(--pink);}
  .smile.done svg *{stroke:#fff;} .smile.done svg circle{fill:#fff;}
  .smile.past{background:#fff; border-color:var(--pink2);}
  .smile.wait{background:#fff; border-color:#d6d6d6; opacity:.6;}
  .smile:active{transform:scale(.88);}
  .pop{animation:pop .45s ease;}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28) rotate(-10deg)}100%{transform:scale(1)}}
  @media (max-width:400px){ .row{gap:10px; padding:12px;} .row .thumb{width:56px; height:56px; border-radius:16px;} .row .pn{font-size:24px;} }
  .empty{text-align:center; color:var(--dim); font-weight:900; padding:26px 10px; font-size:14px; line-height:1.7;}
  .note{font-size:12px; color:var(--dim); font-weight:700; margin:8px 4px 0; line-height:1.6;}
  .foot{text-align:center; margin-top:26px; color:var(--dim2);}
  .lnk{font-size:13px; font-weight:900; color:var(--pink); background:#fff; padding:11px 16px; border-radius:20px; display:inline-block; margin-top:6px;}

  /* bottom nav */
  .nav{position:fixed; left:0; right:0; bottom:0; padding:0 16px calc(20px + env(safe-area-inset-bottom)); display:flex; justify-content:center; z-index:20; pointer-events:none;}
  .nav-in{width:100%; max-width:448px; display:flex; justify-content:space-between; align-items:center; pointer-events:auto;}
  .circ{width:70px; height:70px; border-radius:50%; background:#fff; display:grid; place-items:center; box-shadow:0 8px 24px rgba(0,0,0,.09); position:relative;}
  .circ .badge{position:absolute; top:13px; right:14px; width:13px; height:13px; border-radius:50%; background:var(--pink); border:2px solid #fff;}
  .pill{background:#fff; border-radius:40px; padding:8px; display:flex; gap:4px; box-shadow:0 8px 24px rgba(0,0,0,.09);}
  .pill button{padding:14px 26px; border-radius:30px; font-size:17px; font-weight:900; color:#666; white-space:nowrap;}
  .pill button.on{background:#e4e4e4; color:var(--tx);}

  /* timetable grid */
  .ttc{padding:14px 12px 14px;}
  .wkbar{display:flex; align-items:center; justify-content:space-between; margin:0 2px 12px;}
  .wkbar b{font-size:17px; font-weight:900;}
  .wkbar button{width:44px; height:44px; border-radius:50%; background:#fff; font-size:20px; font-weight:900; color:#333;}
  .wkbar button:disabled{opacity:.25;}
  .tt{display:grid; grid-template-columns:22px repeat(5,minmax(0,1fr)); gap:5px;}
  .tt .h{font-size:13px; font-weight:900; color:var(--dim); text-align:center; padding:2px 0 3px; line-height:1.2;}
  .tt .h small{display:block; font-size:10px; font-weight:700;}
  .tt .h.today{color:var(--pink);}
  .tt .p{font-size:12px; font-weight:900; color:var(--dim2); display:grid; place-items:center;}
  .cell{min-height:70px; border-radius:14px; background:#fff; padding:6px 5px; font-size:11px; font-weight:900; line-height:1.25; display:flex; flex-direction:column; justify-content:space-between;
    position:relative; text-align:left; overflow:hidden; word-break:normal; overflow-wrap:anywhere; line-break:strict; background-size:cover; background-position:center;}
  .cell > *{position:relative; z-index:1;}
  .cell:has(.mk,.same){padding-top:19px;}
  .cell:has(.gt,.fr){padding-bottom:18px;}
  .cell .rm{font-size:9.5px; font-weight:700; opacity:.6;}
  .cell.ph{color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.5);}
  .cell.ph::before{content:""; position:absolute; inset:0; z-index:0; background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.05) 60%,rgba(0,0,0,.25));}
  .cell.ph .rm{opacity:.9;}
  .cell .mk{position:absolute; top:3px; right:3px; width:15px; height:15px; border-radius:50%; background:var(--pink); color:#fff; font-size:8px; display:grid; place-items:center; border:1.5px solid #fff; text-shadow:none; z-index:2;}
  .cell .same{position:absolute; top:2px; left:3px; font-size:11px; z-index:2; text-shadow:none;}
  .cell .gt{position:absolute; bottom:3px; left:3px; font-size:8.5px; font-family:'Anton',Impact,sans-serif; color:var(--pink); border:1.5px solid var(--pink); border-radius:5px; padding:0 3px;
    transform:rotate(-8deg); background:#fff; letter-spacing:.3px; text-shadow:none; z-index:2;}
  .cell .fr{position:absolute; right:3px; bottom:3px; z-index:2;}
  .cell .fr .stk .av{border-width:1px;}
  .cell.now{box-shadow:0 0 0 2.5px var(--pink);}
  .cell.add{background:rgba(255,255,255,.4); color:#d6d6d6; font-size:16px; align-items:center; justify-content:center;}
  .cell.blank{background:rgba(255,255,255,.35);}

  /* screens / sheets */
  .screen{position:fixed; inset:0; background:var(--bg); z-index:30; overflow-y:auto; transform:translateX(105%); transition:transform .28s cubic-bezier(.2,.8,.2,1); visibility:hidden;}
  .screen.open{transform:none; visibility:visible;}
  .screen .wrap{max-width:480px; margin:0 auto; padding:calc(16px + env(safe-area-inset-top)) 16px 60px;}
  .back{display:flex; align-items:center; gap:12px; padding:6px 2px 14px;}
  .back > button{width:48px; height:48px; border-radius:50%; background:#fff; display:grid; place-items:center; box-shadow:0 4px 14px rgba(0,0,0,.06); flex-shrink:0;}
  .back h3{margin:0; font-size:21px; font-weight:900;}
  .sec-t{font-size:14px; color:var(--dim); font-weight:900; margin:26px 8px 10px;}
  .shade{position:fixed; inset:0; background:rgba(20,20,20,.38); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s;}
  .shade.open{opacity:1; pointer-events:auto;}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:41; transform:translateY(105%); transition:transform .28s cubic-bezier(.2,.8,.2,1); display:flex; justify-content:center; visibility:hidden;}
  .sheet.open{transform:none; visibility:visible;}
  .sheet .body{width:100%; max-width:480px; background:var(--bg); border-radius:32px 32px 0 0; padding:12px 20px calc(24px + env(safe-area-inset-bottom)); max-height:90vh; overflow-y:auto; outline:none;}
  .grab{width:44px; height:5px; border-radius:3px; background:#d0d0d0; margin:0 auto 16px;}
  .sheet h3{margin:0 0 4px; font-size:22px; font-weight:900;}
  .sub{font-weight:700; color:var(--dim); font-size:13.5px; line-height:1.6;}
  label.f,.f{display:block; font-size:13px; font-weight:900; color:var(--dim); margin:18px 4px 8px;}
  input.tx,select.tx{width:100%; padding:14px 16px; border-radius:18px; border:1.5px solid var(--line); background:#fff; font-size:16px; font-family:inherit; font-weight:700; color:var(--tx); outline:none;}
  input.tx:focus,select.tx:focus{border-color:var(--pink);}
  select.tx:disabled,input.tx:disabled{opacity:.5;}
  .chips{display:flex; gap:8px; flex-wrap:wrap;}
  .chips button{padding:11px 14px; border-radius:18px; background:#fff; font-size:13.5px; font-weight:900; color:#555; border:1.5px solid #e6e6e6;}
  .chips button.on{background:var(--pink3); color:var(--pink); border-color:var(--pink2);}
  .seg{display:flex; background:#fff; border-radius:20px; padding:5px; gap:4px; margin-top:14px;}
  .seg button{flex:1; padding:11px 4px; border-radius:16px; font-size:14px; font-weight:900; color:var(--dim);}
  .seg button.on{background:var(--tx); color:#fff;}
  .colors{display:flex; gap:10px; flex-wrap:wrap;}
  .colors button{width:40px; height:40px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1.5px #ddd;}
  .colors button.on{box-shadow:0 0 0 3px var(--tx);}
  .btn{display:block; width:100%; padding:17px; border-radius:24px; background:var(--tx); color:#fff; font-size:17px; font-weight:900; margin-top:20px; text-align:center;}
  .btn.pk{background:var(--pink);}
  .btn.ghost{background:#fff; color:var(--tx);}
  .btn.danger{background:none; color:var(--red); font-size:14px; margin-top:6px; padding:13px;}
  .btn.quiet{background:none; color:var(--dim); font-size:14px; margin-top:6px; padding:13px;}
  .herebtn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:18px; border-radius:28px; background:var(--pink); color:#fff; font-size:21px; font-weight:900; margin-top:18px;}
  .herebtn svg *{stroke:#fff;} .herebtn svg circle{fill:#fff;}
  .herest{display:flex; align-items:center; gap:10px; width:100%; padding:12px 14px; border-radius:24px; background:#fff; font-size:16px; font-weight:900; margin-top:18px;}
  .herest .smile{width:40px; height:40px;}
  .herest small{color:var(--dim); font-weight:700; font-size:13px;}
  .herest .undo{margin-left:auto; font-size:12px; color:var(--dim); font-weight:900; padding:12px;}
  .herest.wait{color:var(--dim); justify-content:center; padding:16px;}
  .fline{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .fchip{display:flex; align-items:center; gap:6px; background:#fff; border-radius:22px; padding:5px 12px 5px 5px; min-height:40px; font-size:13px; font-weight:900; border:1.5px solid transparent;}
  .fchip.ok{border-color:var(--pink); color:var(--pink);}
  .fchip small{color:var(--dim); font-weight:700;}
  .phline{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:12px; padding:15px; border-radius:22px; background:#fff; border:1.5px dashed var(--pink2); color:var(--pink); font-weight:900; font-size:14px;}
  .shot{display:block; width:100%; max-width:270px; margin:0 auto; aspect-ratio:3/4; border-radius:24px; overflow:hidden; background-size:cover; background-position:center;}
  .phrow{display:flex; gap:8px; margin-top:10px;}
  .phrow button{flex:1; padding:13px; border-radius:16px; background:#fff; font-weight:900; font-size:13px;}
  .rule{font-size:11.5px; font-weight:700; color:var(--dim); line-height:1.6; margin:8px 4px 0;}
  .sem{display:flex; align-items:center; flex-wrap:wrap; gap:8px; background:#fff; border-radius:22px; padding:12px 12px 12px 16px;}
  .sem > span{flex:1 1 120px; font-size:13px; font-weight:900; color:var(--dim); line-height:1.4;}
  .tog{font-weight:900; font-size:12.5px; padding:10px 12px; min-height:40px; border-radius:14px; background:var(--bg); color:var(--dim); white-space:nowrap; flex-shrink:0; border:1.5px solid #e2e2e2;}
  .tog.on{background:var(--pink3); color:var(--pink); border-color:var(--pink2);}
  .tog:disabled{opacity:.35;}
  .together{font-size:13px; font-weight:900; color:var(--pink); margin:8px 6px 0;}
  .crop{position:relative; width:100%; max-width:270px; aspect-ratio:3/4; border-radius:24px; overflow:hidden; background:#222; touch-action:none; margin:14px auto 0;}
  .crop canvas{width:100%; height:100%; display:block; cursor:grab;}
  .crop .sq{position:absolute; left:0; right:0; top:12.5%; bottom:12.5%; outline:1.5px dashed rgba(255,255,255,.75); pointer-events:none;}
  input[type=range]{width:100%; accent-color:var(--pink); margin-top:14px; height:28px;}
  .li{display:flex; align-items:center; gap:12px; padding:12px 2px; border-bottom:1px solid #dcdcdc; width:100%; text-align:left;}
  .li:last-child{border-bottom:none;}
  .li .sw{width:10px; height:38px; border-radius:6px; flex-shrink:0;}
  .li .t{flex:1; min-width:0;}
  .li .t b{font-size:15px; font-weight:900; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .li .t span{font-size:12px; color:var(--dim); font-weight:700;}
  .li .st{font-size:12px; font-weight:900; color:var(--dim); flex-shrink:0;}
  .li .st.ok{color:var(--pink);}
  .li .thumb{width:48px; height:48px; border-radius:14px;}
  .li .thumb .pn{font-size:20px;}
  .li .thumb .phe{font-size:22px;}
  .addb{background:#fff; color:var(--tx); border:1.5px solid #dcdcdc; font-weight:900; font-size:13px; padding:9px 13px; min-height:40px; border-radius:16px; white-space:nowrap; flex-shrink:0;}
  .addb.pk{background:var(--pink); color:#fff; border-color:var(--pink);}
  .addb:disabled{background:transparent; color:#aaa; border-color:#e6e6e6;}
  .fac{font-size:11px; font-weight:900; color:var(--dim); background:#fff; padding:2px 8px; border-radius:10px; vertical-align:3px;}
  .fhead{display:flex; align-items:center; gap:14px;}
  .fhead h3{margin:0 0 4px;}
  .req{display:flex; flex-wrap:wrap; gap:10px 12px; align-items:center; background:#fff; border-radius:24px; padding:12px 14px; margin-bottom:10px;}
  .req p{margin:0; flex:1 1 calc(100% - 60px); font-size:14px; font-weight:900; line-height:1.5;}
  .req p b{white-space:nowrap;}
  .req p small{display:block; font-weight:700; color:var(--dim); font-size:12px;}
  .req .acts{display:flex; gap:8px; width:100%; padding-left:56px;}
  .emoji-pick{display:flex; gap:8px; flex-wrap:wrap;}
  .emoji-pick button{width:46px; height:46px; border-radius:50%; background:#fff; font-size:24px; border:2px solid transparent;}
  .emoji-pick button.on{border-color:var(--pink);}
  .toast{position:fixed; left:50%; top:calc(18px + env(safe-area-inset-top)); transform:translate(-50%,-160%); background:var(--tx); color:#fff; font-weight:900;
    padding:12px 20px; border-radius:30px; z-index:70; transition:transform .3s; font-size:14px; width:max-content; max-width:calc(100vw - 32px); text-align:center;}
  .toast.on{transform:translate(-50%,0);}

  /* onboarding */
  .onb{position:fixed; inset:0; z-index:50; background:var(--bg); overflow-y:auto;}
  .onb .wrap{max-width:480px; margin:0 auto; padding:calc(36px + env(safe-area-inset-top)) 22px 32px; min-height:100%; display:flex; flex-direction:column;}
  .onb h1{font-size:26px; font-weight:900; margin:22px 0 10px; line-height:1.45;}
  .onb .lead{color:var(--dim); font-weight:700; font-size:15px; line-height:1.75; margin:0;}
  .inv{display:flex; align-items:center; gap:12px; background:#fff; border-radius:24px; padding:14px 16px; margin-top:26px; font-weight:900; font-size:14px;}
  .pick{display:flex; align-items:center; gap:12px; width:100%; background:#fff; border-radius:22px; padding:12px 14px; margin-bottom:8px; text-align:left; border:2px solid transparent;}
  .pick.on{border-color:var(--pink); background:var(--pink3);}
  .pick:disabled{opacity:.4;}
  .pick .sw{width:10px; height:38px; border-radius:6px; flex-shrink:0;}
  .pick .t{flex:1; min-width:0;}
  .pick .t b{display:block; font-size:15px; font-weight:900;}
  .pick .t span{font-size:12px; font-weight:700; color:var(--dim);}
  .pick .box{width:26px; height:26px; border-radius:50%; border:2px solid #ccc; display:grid; place-items:center; color:#fff; font-size:14px; font-weight:900; flex-shrink:0;}
  .pick.on .box{background:var(--pink); border-color:var(--pink);}
  .steps{display:flex; gap:6px;}
  .steps i{height:5px; flex:1; border-radius:3px; background:#ddd;}
  .steps i.on{background:var(--pink);}
</style>
</head>
<body>
<div id="app"></div>

<div class="screen" id="scr" role="dialog" aria-modal="true"><div class="wrap" id="scrIn"></div></div>
<div class="shade" id="shade" data-act="sclose"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="body" tabindex="-1"><div class="grab"></div><div id="sheetIn"></div></div></div>
<div class="onb" id="onb" hidden><div class="wrap" id="onbIn"></div></div>

  <button class="circ" data-act="friends" aria-label="友だち">

  </div>

    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg>
  </button>
</div></nav>

<script>
'use strict';
/* ============================================================
   KOMALOG — ただの時間割なのに、友だちの気配がする。
   できること: 時間割 / 着いたら☺︎(来た) / マスに写真を一枚 / 学期末の単位GET印 / 見える人を選ぶ
   ============================================================ */

/* ---------- 定数 ---------- */
const DAYS = ['月','火','水','木','金'];
const PRESETS = {
  90:  [['9:00','10:30'],['10:40','12:10'],['13:00','14:30'],['14:40','16:10'],['16:20','17:50'],['18:00','19:30']],
  100: [['9:00','10:40'],['10:50','12:30'],['13:20','15:00'],['15:10','16:50'],['17:00','18:40'],['18:50','20:30']],
};
const COLORS = ['#fbd5ef','#cdeee4','#fff0a8','#d6e4ff','#ffdcc9','#e5d8ff','#d9f2c9'];
const BGS = [
  'linear-gradient(135deg,#ffb88c,#de6262)','linear-gradient(135deg,#5fd6bd,#2a8f9c)','linear-gradient(135deg,#f6d365,#fda085)',
  'linear-gradient(135deg,#a18cd1,#fbc2eb)','linear-gradient(135deg,#89f7fe,#66a6ff)','linear-gradient(135deg,#3a3d40,#6b6f73)',
  'linear-gradient(135deg,#fccb90,#d57eeb)',
];
const ME_EMOJI = ['🐣','🐻','🐱','🦊','🐸','🐼','🍙','⭐️','🌙','🎧'];
const FACULTIES = ['文学部','法学部','経済学部','商学部','理工学部','総合政策学部','国際経営学部','国際情報学部'];
const DEMO_PH = ['📓','🪑','☕️','🪟','📒','✏️','💻','🥤'];
const MY_SEED = [
  [0,1,'英語コミュニケーション','2-301'],[0,3,'統計学入門','5-102'],[1,2,'心理学概論','大講義室A'],[1,4,'社会学','3-201'],
  [2,2,'プログラミング基礎','情報演習室'],[2,4,'経済学原論','3-205'],[3,1,'韓国語Ⅰ','2-104'],[3,3,'メディア論','3-401'],
  [4,2,'スポーツ科学','体育館'],[4,3,'基礎ゼミ','研究棟402'],
];
// デモの友だち(本番では、承認した友だちのデータがサーバーから届く)
const FDEF = [
  {id:'f1', name:'そうご', emoji:'🌅', bg:0, fac:'商学部', rate:.85, got:['英語コミュニケーション'], cls:[
    [0,1,'英語コミュニケーション','2-301'],[0,2,'簿記原理','8-201'],[1,2,'心理学概論','大講義室A'],[2,2,'プログラミング基礎','情報演習室'],
    [2,3,'マーケティング論','8-305'],[3,2,'経営学入門','8-101'],[4,3,'基礎ゼミ','研究棟402'],[4,4,'哲学','3-102']]},
  {id:'f2', name:'ゆい', emoji:'🍾', bg:4, fac:'文学部', rate:.8, got:['統計学入門'], cls:[
    [0,3,'統計学入門','5-102'],[1,2,'心理学概論','大講義室A'],[1,3,'日本文学史','3-305'],[2,1,'フランス語Ⅰ','2-202'],
    [2,4,'経済学原論','3-205'],[3,1,'韓国語Ⅰ','2-104'],[3,3,'メディア論','3-401'],[4,2,'美術史','3-110']]},
  {id:'f3', name:'けんと', emoji:'🏀', bg:5, fac:'法学部', rate:.65, got:[], cls:[
    [0,1,'英語コミュニケーション','2-301'],[0,4,'民法総論','法学棟201'],[1,1,'憲法','法学棟101'],[1,4,'社会学','3-201'],
    [2,3,'刑法総論','法学棟102'],[3,2,'政治学原論','3-301'],[3,3,'メディア論','3-401'],[4,2,'スポーツ科学','体育館']]},
  {id:'f4', name:'まな', emoji:'🎨', bg:3, fac:'総合政策学部', rate:.9, got:[], cls:[
    [0,2,'デザイン論','7-101'],[0,3,'統計学入門','5-102'],[1,3,'デザイン演習','アトリエ'],[2,2,'プログラミング基礎','情報演習室'],
    [3,4,'色彩論','7-202'],[4,3,'基礎ゼミ','研究棟402']]},
  {id:'f5', name:'はると', emoji:'🎸', bg:6, fac:'理工学部', rate:.75, got:[], cls:[
    [0,1,'線形代数','理工1-201'],[0,3,'統計学入門','5-102'],[1,1,'微分積分','理工1-101'],[2,3,'化学概論','理工2-301'],
    [3,2,'データ構造','理工3-201'],[4,1,'物理学実験','実験棟']]},
];

/* ---------- ユーティリティ ---------- */
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key = c => `${c.name}|${c.day}|${c.period}`;
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0)/4294967296; }
const toMin = hm => { const [h,m] = hm.split(':').map(Number); return h*60+m; };
const fmtMin = m => `${Math.floor(m/60)%24}:${String(m%60).padStart(2,'0')}`;
const hm = ts => { const d = new Date(ts); return fmtMin(d.getHours()*60+d.getMinutes()); };
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dateMs = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d).getTime(); };
const md = s => { const [,m,d] = s.split('-').map(Number); return `${m}/${d}`; };
function names(list){ const n = list.map(f => f.name); return n.length<=2 ? n.join('・') : `${n.slice(0,2).join('・')} ほか${n.length-2}人`; }
const isWeekdayDaytime = r => { const w = r.getDay(), m = r.getHours()*60 + r.getMinutes(); return w>=1 && w<=5 && m>=8*60+30 && m<=18*60; };

/* ---------- 状態(この端末に保存) ---------- */
const KEY = 'komalog.v3';
let demoAnchor = Date.now(); // デモ時刻は「設定した時刻 + 経過時間」で進む
let lastSaved = null;
let S = load();
function fresh(){
  return {
    v:3, onboarded:false,
    me:{name:'', emoji:'🐣', bg:0, fac:'', handle:uid().slice(0,6)},
    classes:[], recs:[],
    groups:[{id:'g1', name:'統計のメンバー', members:['f2','f4']}],
    // 友だちは承認してはじめてつながる
    friendState:{f1:'request', f2:'request', f3:'request', f4:'request', f5:'request'},
    sentReq:[],
    settings:{aud:'friends', preset:90, demo:{on:false, day:2, min:11*60+20}},
  };
}
function load(){
  try{ lastSaved = localStorage.getItem(KEY); const j = JSON.parse(lastSaved); if(j && j.v===3) return Object.assign(fresh(), j); }catch(e){}
  lastSaved = null; return fresh();
}
// 保存できなかったときは、画面の状態も最後に保存できた状態へ戻す(保存されていない変更が残らないように)
function save(quiet){
  try{ const j = JSON.stringify(S); localStorage.setItem(KEY, j); lastSaved = j; return true; }
  catch(e){
    if(!quiet) toast('端末の保存容量がいっぱいです。古い写真を外してね');
    if(lastSaved){ try{ S = Object.assign(fresh(), JSON.parse(lastSaved)); }catch(_){} }
    return false;
  }
}

/* ---------- 時刻(1日は午前4時から。デモ時刻にも対応) ---------- */
function now(){
  const dm = S.settings.demo;
  if(!dm.on) return new Date();
  const r = new Date(Date.now() - 4*3600e3); const w = r.getDay();
  const base = new Date(r.getFullYear(), r.getMonth(), r.getDate() + (w===0 ? -6 : 1-w) + dm.day, 0, dm.min);
  return new Date(base.getTime() + (Date.now() - demoAnchor));
}
const nowTs = () => now().getTime();
const logical = () => new Date(nowTs() - 4*3600e3);
const todayStr = () => ymd(logical());
function dayIdx(){ const w = logical().getDay(); return (w>=1&&w<=5) ? w-1 : -1; }
function nowMin(){ const n = now(); let m = n.getHours()*60 + n.getMinutes(); if(n.getHours()<4) m += 1440; return m; }
function weekDates(off=0){
  const L = logical(); const w = L.getDay(); const diff = (w===0 ? -6 : 1-w) + off*7;
  return DAYS.map((_,i) => ymd(new Date(L.getFullYear(), L.getMonth(), L.getDate()+diff+i)));
}
// 学期末(前期: 7/10〜9/20、後期: 1/10〜3/31)
function isSemEnd(){ const L = logical(), m = L.getMonth()+1, d = L.getDate();
  return (m===7 && d>=10) || m===8 || (m===9 && d<=20) || (m===1 && d>=10) || m===2 || m===3; }
const PER = () => PRESETS[S.settings.preset] || PRESETS[90];
function nowLabel(){
  const m = nowMin(), P = PER();
  if(m < toMin(P[0][0])) return '授業前';
  for(let i=0;i<P.length;i++){
    if(m >= toMin(P[i][0]) && m < toMin(P[i][1])) return `${i+1}限`;
    if(i===1 && m < toMin(P[2][0])) return '昼休み';
    if(i<P.length-1 && m < toMin(P[i+1][0])) return '休み時間';
  }
  return '放課後';
}

/* ---------- 授業のコマ ---------- */
const win = c => { const p = PER()[c.period-1]; return {s:toMin(p[0]), e:toMin(p[1])}; };
const timeText = c => { const w = win(c); return `${fmtMin(w.s)}–${fmtMin(w.e)}`; };
function phaseOf(date, c){
  const t = todayStr();
  if(date < t) return 'past'; if(date > t) return 'future';
  const m = nowMin(), w = win(c); return m < w.s ? 'future' : m < w.e ? 'now' : 'past';
}
// ☺︎ を押せるのは授業開始30分前から。今週の過ぎた日は、あとからでも押せる
function canRecord(date, c){
  const t = todayStr();
  if(date > t || date < weekDates(0)[0]) return false;
  return date < t || nowMin() >= win(c).s - 30;
}
const recOf = (cid, date) => S.recs.find(r => r.classId===cid && r.date===date);

/* ---------- デモの友だち ---------- */
let FRIENDS = [];
function buildFriends(){
  FRIENDS = FDEF.map(fd => {
    const classes = fd.cls.map((c,i) => ({id:fd.id+'c'+i, day:c[0], period:c[1], name:c[2], room:c[3],
      color:COLORS[(i*3+fd.bg)%COLORS.length], got:fd.got.includes(c[2]), shareGot:fd.got.includes(c[2])}));
    const f = {...fd, classes}; f.recs = genRecs(f); return f;
  });
}
function genRecs(f){
  const today = todayStr(), m = nowMin(), P = PER(), recs = [];
  for(const off of [0,-1,-2]){
    weekDates(off).forEach((date, d) => {
      if(date > today) return;
      f.classes.filter(c => c.day===d).forEach(c => {
        const seed = f.id+date+c.period;
        const t = toMin(P[c.period-1][0]) - 8 + Math.floor(hash(seed+'t')*14);
        if(date===today && m < t) return;
        if(hash(seed) > f.rate) return;
        const photo = hash(seed+'p') < .5;
        recs.push({id:`${f.id}-${date}-${c.id}`, classId:c.id, date, ts:dateMs(date)+t*60e3,
          ph: photo ? {bg:BGS[Math.floor(hash(seed+'b')*BGS.length)], emo:DEMO_PH[Math.floor(hash(seed+'e')*DEMO_PH.length)]} : null});
      });
    });
  }
  return recs;
}
const friends = () => FRIENDS.filter(f => S.friendState[f.id]==='friend');
const fById = id => FRIENDS.find(f => f.id===id);
const fRec = (f, c, date) => f.recs.find(r => r.classId===c.id && r.date===date);
// 同じ授業(授業名・曜日・時限が同じ)を受けている友だち
const friendsIn = c => friends().map(f => ({f, fc:f.classes.find(x => key(x)===key(c))})).filter(x => x.fc);

/* ---------- 見える人 ---------- */
function audOptions(){ return [['friends','👥 友だち全員'], ...S.groups.map(g => ['g:'+g.id, '🏷 '+g.name]), ['private','🔒 自分だけ']]; }
const audName = a => (audOptions().find(o => o[0]===a) || [0,'🔒 自分だけ'])[1];
const audFor = (c, date) => (CS && CS.cid===c.id && CS.date===date) ? CS.aud : (c.aud || S.settings.aud);

/* ---------- 部品 ---------- */
const avatar = (emoji, bg, size=42) => `<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.52)}px;background:${BGS[bg]||BGS[0]}">${emoji}</span>`;
const faces = (list, size) => `<span class="stk">${list.slice(0,3).map(f => avatar(f.emoji, f.bg, size)).join('')}</span>`;
const SMILE = `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="9.2" cy="10" r=".9" fill="#222"/><circle cx="14.8" cy="10" r=".9" fill="#222"/><path d="M7.5 13.6c1.1 1.9 2.7 2.8 4.5 2.8s3.4-.9 4.5-2.8"/></svg>`;
const MINI_SMILE = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="10" r=".6" fill="#fff"/><circle cx="15" cy="10" r=".6" fill="#fff"/><path d="M7.5 14c1.1 1.8 2.7 2.7 4.5 2.7s3.4-.9 4.5-2.7"/></svg>`;
const CHEV = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="m9 5 7 7-7 7"/></svg>`;
const BACK = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>`;
const STAR = w => `<svg viewBox="0 0 120 110" width="${w}" aria-hidden="true" style="flex-shrink:0"><g stroke="#222" stroke-width="3" stroke-linecap="round" fill="none">
  <path d="M60 14 72 42 101 44 79 63 86 92 60 76 34 92 41 63 19 44 48 42Z" fill="#fbeea8" stroke-linejoin="round"/>
  <path d="M28 18l6 7M92 18l-6 7M8 58l10-3M112 58l-10-3M60 100v8"/>
  <path d="M55 46v7M66 44v7" stroke-width="3.4"/><ellipse cx="60" cy="61" rx="4" ry="3.2"/></g></svg>`;
function thumbHTML(c, rec, got){
  const g = got ? '<span class="getb">GET</span>' : '';
  if(rec && rec.photo) return `<span class="thumb" style="background-image:url('${rec.photo}')">${g}</span>`;
  if(rec && rec.ph) return `<span class="thumb" style="background:${rec.ph.bg}"><span class="phe">${rec.ph.emo}</span>${g}</span>`;
  return `<span class="thumb" style="background:${c.color}"><span class="pn">${c.period}<small>限</small></span>${g}</span>`;
}
// 今日の曜日を先頭にして、曜日ごとに並べる
function byDayTodayFirst(list){
  const di = dayIdx(), order = [0,1,2,3,4].sort((a,b) => (b===di) - (a===di) || a-b);
  return order.map(d => ({d, items:list.filter(x => x.c.day===d)})).filter(g => g.items.length);
}

/* ============================================================
   画面: きょう
   ============================================================ */
let tab = 'today', viewWeek = 0;
function header(){
  const dm = S.settings.demo;
  return `<div class="hd"><div class="logo">KOMALOG</div>
    <button class="me-btn" data-act="me" aria-label="プロフィールと設定">${avatar(S.me.emoji,S.me.bg,42)}</button></div>
    <div class="hint"><span class="ic">${MINI_SMILE}</span><span class="ht">着いたら ☺︎ をタップ</span>
      ${dm.on ? `<button class="demo-chip" data-act="me" aria-label="デモ時刻の設定">デモ ${DAYS[dm.day]}${fmtMin(dm.min)}</button>` : ''}</div>`;
}
function heroHTML(){
  const d = dayIdx(), t = todayStr(), fr = friends();
  const list = d<0 ? [] : fr.map(f => {
    const rs = f.recs.filter(r => r.date===t).sort((a,b) => a.ts-b.ts);
    const last = rs[rs.length-1];
    return {f, lc: last ? f.classes.find(c => c.id===last.classId) : null, has: f.classes.some(c => c.day===d)};
  }).filter(x => x.has || x.lc).sort((a,b) => (!!b.lc) - (!!a.lc));
  const came = list.filter(x => x.lc).length;
  const inNow = list.filter(x => x.lc && phaseOf(t, x.lc)==='now').length;
  let line;
  if(d<0) line = `${md(t)} ・ 授業のない日。`;
  else if(!fr.length) line = `${md(t)} ・ いまは${nowLabel()}<br>友だちとつながると、ここに気配が出ます。`;
  else line = `${md(t)} ・ いまは${nowLabel()}<br>${inNow ? `いま友だち${inNow}人が授業に来てる。` : came ? `きょうは友だち${came}人が来た。` : 'まだ誰も ☺︎ を押していません。'}`;
  const strip = list.length ? `<div class="fstrip">${list.map(x => `<button class="fp" data-act="friend" data-v="${x.f.id}" aria-label="${x.f.name}${x.lc ? `、${x.lc.period}限 ${esc(x.lc.name)}に来た` : ''}">
      <span class="ring ${x.lc?'ok':''}">${avatar(x.f.emoji,x.f.bg,46)}${x.lc ? `<i class="pb">${x.lc.period}限</i>` : ''}</span><b>${x.f.name}</b></button>`).join('')}</div>`
    : (!fr.length ? `<button class="lnk" data-act="friends">友だちとつながる</button>` : '');
  return `<div class="card hero"><div class="top"><div style="flex:1;min-width:0"><h2>${d<0 ? '週末' : `${DAYS[d]}曜日`}</h2><p>${line}</p></div>${STAR(86)}</div>${strip}</div>`;
}
function classRow(c, date, isNext){
  const r = recOf(c.id, date), ph = phaseOf(date, c), can = canRecord(date, c);
  const fr = friendsIn(c), came = fr.filter(x => fRec(x.f, x.fc, date));
  let who = '';
  if(came.length) who = `<div class="who"><span class="t">${names(came.map(x=>x.f))}</span><span class="v">が${ph==='past'?'来てた':'来てる'}</span></div>`;
  else if(fr.length) who = `<div class="who gray"><span class="t">${names(fr.map(x=>x.f))}</span><span class="v">も受けてる</span></div>`;
  const label = r ? '来た(記録済み)' : can ? '来た を記録' : `${fmtMin(win(c).s-30)} から押せます`;
  const sc = r ? 'done' : !can ? 'wait' : ph==='past' ? 'past' : '';
  return `<div class="row ${ph==='now'?'now':''} ${isNext?'next':''}" data-act="cls" data-v="${c.id}|${date}" role="button" tabindex="0" aria-label="${c.period}限 ${esc(c.name)}">
    ${thumbHTML(c, r, c.got)}
    <div class="mid"><div class="tm">${c.period}限 ${timeText(c)}${ph==='now'?'<span class="nowtag">いま</span>':''}</div>
      <div class="name">${esc(c.name)}</div>${who}</div>
    <button class="smile ${sc}" data-act="here" data-v="${c.id}|${date}" aria-label="${label}" aria-pressed="${!!r}">${SMILE}</button></div>`;
}
function todayView(){
  const d = dayIdx(), t = todayStr();
  let h = header() + heroHTML();
  if(d<0) h += `<div class="empty">週末はおやすみ。<br><button class="lnk" data-act="tab" data-v="week">今週の時間割を見る</button></div>`;
  else {
    const cls = S.classes.filter(c => c.day===d).sort((a,b) => a.period-b.period);
    const next = cls.find(c => phaseOf(t, c)==='future');
    if(cls.length) h += cls.map(c => classRow(c, t, c===next)).join('');
    else if(S.classes.length) h += `<div class="empty">きょうは授業なし。<br><button class="lnk" data-act="add" data-v="today">＋ きょうの授業を追加</button></div>`;

/* ============================================================
   画面: 週(ふつうの時間割。写真はマスに一枚)
   ============================================================ */
function gridHTML(classes, wd, owner){
  const t = todayStr(), td = wd.indexOf(t), m = nowMin(), P = PER();
  const curP = P.findIndex(p => m >= toMin(p[0]) && m < toMin(p[1])) + 1;
  const maxP = Math.max(5, ...classes.map(c => c.period));
  const isMe = owner==='me';
  let h = `<div class="tt"><div></div>` + DAYS.map((x,i) => `<div class="h ${i===td?'today':''}">${x}<small>${md(wd[i])}</small></div>`).join('');
  for(let p=1; p<=maxP; p++){
    h += `<div class="p">${p}</div>`;
    for(let d=0; d<5; d++){
      const c = classes.find(x => x.day===d && x.period===p);
      if(!c){ h += isMe ? `<button class="cell add" data-act="add" data-v="${d}-${p}" aria-label="${DAYS[d]}${p}限に授業を追加">+</button>` : '<div class="cell blank"></div>'; continue; }
      const isToday = d===td;
      const r = isMe ? recOf(c.id, wd[d]) : fRec(owner, c, wd[d]);
      const bg = r && r.photo ? `background-image:url('${r.photo}')` : r && r.ph ? `background:${r.ph.bg}` : `background:${c.color}`;
      const got = isMe ? c.got : c.shareGot;
      const same = !isMe && S.classes.some(x => key(x)===key(c));
      const mk = r && (isMe || isToday); // 友だちの ✓ は今日だけ(過去の出欠表にしない)
      const came = isMe && isToday ? friendsIn(c).filter(x => fRec(x.f, x.fc, wd[d])).map(x => x.f) : [];
      const act = isMe ? `data-act="cls" data-v="${c.id}|${wd[d]}"` : `data-act="fadd" data-v="${esc(key(c))}"`;
      h += `<button class="cell ${r&&(r.photo||r.ph)?'ph':''} ${isToday&&p===curP?'now':''}" style="${bg}" ${act}
          aria-label="${DAYS[d]}${p}限 ${esc(c.name)}${mk?' 来た':''}${came.length?` ${names(came)}が来た`:''}${got?' 単位GET':''}${same?' 同じ授業':''}">
        <span>${esc(c.name)}</span><span class="rm">${esc(c.room||'')}</span>
        ${same ? '<span class="same">🤝</span>' : ''}${mk ? '<span class="mk">✓</span>' : ''}${got ? '<span class="gt">GET</span>' : ''}${came.length ? `<span class="fr">${faces(came,14)}</span>` : ''}</button>`;
    }
  }
  return h + '</div>';
}
// 前の週は、いちばん古い記録の週まで(最低8週)さかのぼれる
function minWeek(){
  if(!S.recs.length) return -8;
  const oldest = Math.min(...S.recs.map(r => dateMs(r.date)));
  return Math.min(-8, -Math.ceil((dateMs(weekDates(0)[0]) - oldest) / (7*864e5)));
}
function weekView(){
  const wd = weekDates(viewWeek);
  const title = viewWeek===0 ? '今週' : viewWeek===-1 ? '先週' : `${md(wd[0])}の週`;
  return header() + `<div class="card ttc"><div class="wkbar"><button data-act="wk" data-v="-1" aria-label="前の週" ${viewWeek<=minWeek()?'disabled':''}>‹</button><b>${title}</b>
      <button data-act="wk" data-v="1" aria-label="次の週" ${viewWeek>=0?'disabled':''}>›</button></div>${gridHTML(S.classes, wd, 'me')}</div>
    <p class="note" style="text-align:center">マスをタップで ☺︎ と写真。空いたマスで授業を追加。</p>`;
}

function render(){
  const a = document.activeElement, app = document.getElementById('app');
  const refocus = a && app.contains(a) && a.dataset && a.dataset.act ? [a.dataset.act, a.dataset.v] : null;
  document.querySelectorAll('.pill button').forEach(b => { const on = b.dataset.v===tab; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
  app.innerHTML = tab==='today' ? todayView() : weekView();
  document.getElementById('frBadge').hidden = !FDEF.some(f => S.friendState[f.id]==='request');
  if(refocus){ const n = [...app.querySelectorAll(`[data-act="${refocus[0]}"]`)].find(x => x.dataset.v===refocus[1]); if(n) n.focus({preventScroll:true}); }
}

// ☺︎(来た)を記録。photo を渡すと写真も付ける。容量不足で写真が入らないときは「来た」だけ残す
function checkIn(cid, date, photo){
  const c0 = S.classes.find(x => x.id===cid); if(!c0) return null;
  const existed = !!recOf(cid, date);
  if(!existed && !canRecord(date, c0)) return null;
  const apply = withPhoto => {
    const c = S.classes.find(x => x.id===cid); if(!c) return null;
    let r = recOf(cid, date);
    if(!r){
      r = {id:uid(), classId:cid, date, ts:nowTs(), late: date < todayStr() || nowMin() >= win(c).e, photo:null, aud:audFor(c, date)};
      S.recs.push(r);
    }
    if(withPhoto && photo !== undefined) r.photo = photo;
    return save(true) ? r : null;
  };
  let r = apply(true);
  if(r) return r;
  if(photo && !existed){ r = apply(false); if(r){ r.dropped = true; return r; } }
  toast('端末の保存容量がいっぱいです。古い写真を外してね');
  return null;
}

/* ---------- 写真: 選ぶ → トリミング(3:4) → マスに一枚 ---------- */
let crop = null;
document.getElementById('fileIn').onchange = e => {
  const file = e.target.files[0]; e.target.value = ''; if(!file || !CS) return;
  const url = URL.createObjectURL(file); const img = new Image();
  img.onload = () => { URL.revokeObjectURL(url); if(CS) openCrop(img); };
  img.onerror = () => { URL.revokeObjectURL(url); toast('画像を読み込めませんでした'); };
  img.src = url;
};
function openCrop(img){
  const W = 600, H = 800, base = Math.max(W/img.width, H/img.height);
  crop = {img, W, H, base, zoom:1, x:(W - img.width*base)/2, y:(H - img.height*base)/2};
  document.getElementById('sheetIn').innerHTML = `<h3>トリミング</h3>
    <div class="sub">ドラッグで位置、スライダーで拡大。点線の内側が行の小さな写真になるよ。人の顔やスライド・資料は入れないでね。授業中に撮るときは先生のルールに従ってね。</div>
    <div class="crop"><canvas id="cv" width="${W}" height="${H}"></canvas><div class="sq"></div></div>
    <input type="range" id="zm" min="1" max="3" step="0.01" value="1" aria-label="拡大">
    <div class="phrow"><button data-act="ccancel">やめる</button><button data-act="cok" style="background:var(--pink);color:#fff">この範囲でのせる</button></div>`;
  const cv = document.getElementById('cv');
  drawCrop();
  let drag = null;
  cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); drag = {x:e.clientX, y:e.clientY}; };
  cv.onpointermove = e => { if(!drag) return; const k = W / cv.clientWidth;
    crop.x += (e.clientX-drag.x)*k; crop.y += (e.clientY-drag.y)*k; drag = {x:e.clientX, y:e.clientY}; drawCrop(); };
  cv.onpointerup = cv.onpointercancel = () => { drag = null; };
  document.getElementById('zm').oninput = e => {
    const o = crop.base*crop.zoom; crop.zoom = +e.target.value; const n = crop.base*crop.zoom;
    crop.x = W/2 - (W/2 - crop.x)*n/o; crop.y = H/2 - (H/2 - crop.y)*n/o; drawCrop();
  };
}
function drawCrop(){
  const c = crop, cv = document.getElementById('cv'); if(!c || !cv) return;
  const sc = c.base*c.zoom, dw = c.img.width*sc, dh = c.img.height*sc;
  c.x = Math.min(0, Math.max(c.W - dw, c.x)); c.y = Math.min(0, Math.max(c.H - dh, c.y));
  const ctx = cv.getContext('2d'); ctx.fillStyle = '#222'; ctx.fillRect(0,0,c.W,c.H);
  ctx.drawImage(c.img, c.x, c.y, dw, dh);
}

      ${groups.map(g => `<div class="f">${g.d===dayIdx() ? 'きょう・' : ''}${DAYS[g.d]}曜</div>` + g.items.map(x => { const k = key(x.c), on = ONB.pick.has(k);

function finishOnb(demo){
  if(demo){
    S.classes = MY_SEED.map((c,i) => ({id:uid(), day:c[0], period:c[1], name:c[2], room:c[3], color:COLORS[i%COLORS.length], got:false, shareGot:false}));
    ['f1','f2','f3','f4'].forEach(id => { S.friendState[id] = 'friend'; });
    const r = new Date(), w = r.getDay();
    S.settings.demo.on = !isWeekdayDaytime(r);   // 夜・週末に開いたときだけ、デモ時刻で授業中の様子を見せる
    if(w>=1 && w<=5) S.settings.demo.day = w-1;
    if(!S.me.fac) S.me.fac = '文学部';
  } else {
    const src = friends().flatMap(f => f.classes);
    [...ONB.pick].forEach((k,i) => { const c = src.find(x => key(x)===k);
      if(c) S.classes.push({id:uid(), day:c.day, period:c.period, name:c.name, room:c.room, color:COLORS[i%COLORS.length], got:false, shareGot:false}); });
    S.settings.demo.on = false; // 実際に使う人は、いつも本当の時刻
  }
  if(!S.me.name) S.me.name = 'あなた';
  S.onboarded = true; save();
  document.getElementById('onb').hidden = true;
  tab = 'today'; applyTime(); scrollToNow();
  if(!demo) toast(S.classes.some(c => c.day===dayIdx()) ? '準備OK。教室に着いたら ☺︎' : S.classes.length ? '準備OK。授業の日に ☺︎ が出ます' : '授業は ＋ からいつでも追加できます');
}

/* ============================================================
   シート / スクリーン / トースト(フォーカスも管理)
   ============================================================ */
let lastFocus = null;
const $ = id => document.getElementById(id);
function openSheet(){
  const sh = $('sheet'), wasOpen = sh.classList.contains('open');
  if(!wasOpen) lastFocus = document.activeElement;
  sh.classList.add('open'); $('shade').classList.add('open');
  $('app').inert = true; $('nav').inert = true; $('scr').inert = true;
  const body = sh.querySelector('.body'); body.scrollTop = 0; body.focus({preventScroll:true});
}
function closeSheet(){
  $('sheet').classList.remove('open'); $('shade').classList.remove('open');
  crop = null; CS = null; ADD = null; FSID = null;
  const scrOpen = $('scr').classList.contains('open');
  $('app').inert = scrOpen; $('nav').inert = scrOpen; $('scr').inert = false;
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus({preventScroll:true});
  else if(lastFocus && lastFocus.dataset && lastFocus.dataset.act){
    const n = [...document.querySelectorAll(`[data-act="${lastFocus.dataset.act}"]`)].find(x => x.dataset.v===lastFocus.dataset.v);
    if(n) n.focus({preventScroll:true});
  }
  lastFocus = null;
}
function paintScreen(h, resetScroll){
  const sc = $('scr'); const top = sc.scrollTop;
  $('scrIn').innerHTML = h; sc.classList.add('open'); sc.scrollTop = resetScroll ? 0 : top;
  $('app').inert = true; $('nav').inert = true;
  if(resetScroll) sc.querySelector('.back button').focus({preventScroll:true});
}
function closeScreen(){ $('scr').classList.remove('open'); $('app').inert = false; $('nav').inert = false; render(); }
let toastT;
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2800); }

/* ============================================================
   操作(クリックはまとめて委譲)
   ============================================================ */
const ACT = {
  tab: v => { tab = v; render(); if(v==='today') scrollToNow(); else window.scrollTo(0,0); },
  wk: v => { viewWeek = Math.min(0, Math.max(minWeek(), viewWeek + +v)); render(); },
  cls: v => { const [cid, date] = v.split('|'); openClass(cid, date); },
  here: v => {
    const [cid, date] = v.split('|'); const c = S.classes.find(x => x.id===cid); if(!c) return;
    if(recOf(cid, date)){ if(!CS) openClass(cid, date); return; }
    if(!canRecord(date, c)){ toast(phaseOf(date,c)==='future' ? `${fmtMin(win(c).s-30)} から押せます` : '今週より前は記録できません'); return; }
    const r = checkIn(cid, date); if(!r) return;
    if(CS) renderClass();
    render();
    const b = [...document.querySelectorAll('#app .smile')].find(x => x.dataset.v===v); if(b) b.classList.add('pop');
    toast(`☺︎ 来た ・ ${audName(r.aud)}に見える`);
  },
  undo: () => { if(!confirm('☺︎ を取り消しますか？ この日の写真も外れます。')) return;
    S.recs = S.recs.filter(r => !(r.classId===CS.cid && r.date===CS.date)); save(); renderClass(); render(); },
  pick: () => $('fileIn').click(),
  unphoto: () => { const r = recOf(CS.cid, CS.date); if(r){ r.photo = null; save(); } renderClass(); render(); },
  cok: () => { const url = $('cv').toDataURL('image/jpeg', .72); crop = null;
    const had = !!recOf(CS.cid, CS.date); const r = checkIn(CS.cid, CS.date, url);
    if(r && r.dropped){ delete r.dropped; toast('☺︎ 来た ・ 写真は容量がいっぱいでのせられませんでした'); }
    else if(r) toast(had ? `写真をのせました(${audName(r.aud)}に見える)` : `☺︎ 来た ・ 写真も ${audName(r.aud)}に見える`);
    renderClass(); render(); },
  ccancel: () => { crop = null; renderClass(); },
  aud: v => { const c = S.classes.find(x => x.id===CS.cid); if(!c) return;
    CS.aud = v; c.aud = v; const r = recOf(CS.cid, CS.date); if(r) r.aud = v;
    if(!save()) CS.aud = (recOf(CS.cid, CS.date) || {}).aud || (S.classes.find(x => x.id===CS.cid) || {}).aud || S.settings.aud;
    renderClass(); },
  got: v => { const c = S.classes.find(x => x.id===v); if(!c) return; c.got = !c.got; if(!c.got) c.shareGot = false;
    const ok = save(); refreshSem(v); if(ok && c.got) toast('🎉 単位GET！(自分だけに表示)'); },
  share: v => { const c = S.classes.find(x => x.id===v); if(!c || !c.got) return; c.shareGot = !c.shareGot;
    const ok = save(); refreshSem(v); if(ok) toast(c.shareGot ? '友だちに見せています' : '自分だけに戻しました'); },
  edit: v => openEdit(v),
  friend: v => openFriend(v),
  fadd: v => {
    const [name, d, p] = v.split('|');
    if(S.classes.some(m => key(m)===v)){ toast('あなたも受けている授業です 🤝'); return; }
    const clash = S.classes.find(m => m.day===+d && m.period===+p);
    if(clash){ toast(`${DAYS[+d]}${p}限は「${clash.name}」が入っています`); return; }
    if(confirm(`「${name}」(${DAYS[+d]}${p}限)を自分の時間割にも追加しますか？`) && addFromKey(v)) refreshFriendSheet();
  },
  add: v => { if(v==='today') openAdd(dayIdx(), null); else if(v){ const [d,p] = v.split('-').map(Number); openAdd(d, p); } else openAdd(null, null); },
  amode: v => { ADD.mode = v; renderAdd(); },
  addk: v => { if(addFromKey(v)) renderAdd(); },
  ecol: (v, el) => { editColor = v; document.querySelectorAll('#eCol button').forEach(b => b.classList.toggle('on', b===el)); },
  esave: v => saveClass(v),
  edel: v => { const c = S.classes.find(x => x.id===v); if(!c || !confirm(`「${c.name}」を削除しますか？ この授業の ☺︎ と写真も消えます。`)) return;
    S.classes = S.classes.filter(x => x.id!==v); S.recs = S.recs.filter(r => r.classId!==v); save(); closeSheet(); render(); },
  sclose: () => closeSheet(),
  close: () => closeScreen(),
  friends: () => { closeSheet(); renderFriends(true); },
  me: () => { closeSheet(); renderMe(true); },
  approve: v => { S.friendState[v] = 'friend'; if(!save()){ renderFriends(false); return; } renderFriends(false); render(); toast(`${fById(v).name} とつながりました`); },
  decline: v => { S.friendState[v] = 'later'; save(); renderFriends(false); render(); },
  unfriend: v => { const f = fById(v); if(!f || !confirm(`${f.name} には、あなたの時間割と ☺︎・写真が見えなくなります。友だちをやめますか？`)) return;
    S.friendState[v] = 'none'; S.groups.forEach(g => { g.members = g.members.filter(x => x!==v); });
    save(); closeSheet(); render(); if($('scr').classList.contains('open') && $('audSel')) renderFriends(false); toast(`${f.name} とのつながりを解除しました`); },
  invite: async () => {
    const text = `KOMALOGで時間割つなごう。ID: @${S.me.handle}`;
    try{ if(navigator.share){ await navigator.share({text}); return; } await navigator.clipboard.writeText(text); toast('招待メッセージをコピーしました'); }
    catch(e){ if(e && e.name==='AbortError') return; toast(text); }
  },
  addfr: () => { const v = $('addId').value.trim().replace(/^@/, ''); if(!v){ toast('IDを入れてね'); return; }
    if(!S.sentReq.includes(v)) S.sentReq.push(v); if(!save()){ renderFriends(false); return; } renderFriends(false); toast('申請しました。承認されると時間割が見えます'); },
  gmem: v => { const i = grpDraft.members.indexOf(v); if(i>=0) grpDraft.members.splice(i,1); else grpDraft.members.push(v); renderFriends(false); },
  gadd: () => { const name = grpDraft.name.trim(); if(!name){ toast('グループ名を入れてね'); return; }
    S.groups.push({id:uid(), name, members:[...grpDraft.members]});
    if(!save()){ renderFriends(false); return; }
    grpDraft = {name:'', members:[]}; renderFriends(false); toast('グループを作りました'); },
  gdel: v => { const g = S.groups.find(x => x.id===v);
    if(!g || !confirm(`「${g.name}」を削除しますか？\nこのグループに見せていた ☺︎ と写真は「自分だけ」になります。`)) return;
    const a = 'g:'+v, wasDefault = S.settings.aud===a;
    S.groups = S.groups.filter(x => x.id!==v);
    if(wasDefault) S.settings.aud = 'private'; // 見える範囲を勝手に広げない
    S.recs.forEach(r => { if(r.aud===a) r.aud = 'private'; });
    S.classes.forEach(c => { if(c.aud===a) c.aud = 'private'; });
    if(!save()){ renderFriends(false); return; }
    renderFriends(false);
    toast(wasDefault ? '削除しました。いつもの見える人も「自分だけ」になりました' : '削除しました。このグループに見せていた ☺︎ と写真は「自分だけ」になりました'); },
  memo: v => { S.me.emoji = v; save(); renderMe(false); render(); },
  mbg: v => { S.me.bg = +v; save(); renderMe(false); render(); },
  preset: v => { S.settings.preset = +v; save(); buildFriends(); renderMe(false); render(); },
  demo: v => { S.settings.demo.on = v==='1'; save(); applyTime(); renderMe(false); },
  reset: () => { if(!confirm('時間割・☺︎・写真・設定をすべて消して、最初からにしますか？')) return; localStorage.removeItem(KEY); location.reload(); },
  'onb-accept': () => { S.friendState.f1 = 'friend'; ONB.step = 1; renderOnb(); $('onb').scrollTop = 0; },
  'onb-next': () => { ONB.step++; renderOnb(); $('onb').scrollTop = 0; },
  'onb-back': () => { ONB.step = Math.max(0, ONB.step-1); if(ONB.step===0) S.friendState.f1 = 'request'; renderOnb(); },
  'onb-demo': () => finishOnb(true),
  'onb-emo': (v, el) => { S.me.emoji = v; document.querySelectorAll('#onbIn .emoji-pick button').forEach(b => b.classList.toggle('on', b===el)); },
  'onb-pick': v => { if(ONB.pick.has(v)) ONB.pick.delete(v); else ONB.pick.add(v); const o = $('onb'), t = o.scrollTop; renderOnb(); o.scrollTop = t; },
  'onb-done': () => finishOnb(false),
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if(!fn) return;
  e.preventDefault(); fn(el.dataset.v, el, e);
});
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){ if($('sheet').classList.contains('open')) closeSheet(); else if($('scr').classList.contains('open')) closeScreen(); return; }
  if((e.key==='Enter' || e.key===' ') && e.target.matches('[role=button][data-act]')){ e.preventDefault(); e.target.click(); }
});

/* ---------- 起動 ---------- */
(function boot(){
  buildFriends();
  if(!S.onboarded){ $('onb').hidden = false; renderOnb(); }
  render(); if(S.onboarded) scrollToNow();
  setInterval(() => {
    buildFriends();
    const a = document.activeElement;
    const busy = $('sheet').classList.contains('open') || ['INPUT','SELECT','TEXTAREA'].includes(a?.tagName);
    if(!busy) render();
  }, 60000);
})();
</script>
</body>
</html>

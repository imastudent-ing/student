<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4f4f4">
<title>KOMALOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f4f4; --card:#ececec; --card2:#e6e6e6; --line:#e2e2e2; --white:#fff;
    --tx:#111; --dim:#8e8e8e; --dim2:#b5b5b5;
    --pink:#e45fd6; --pink2:#f5c6ee; --pink3:#fbe3f7; --rose:#e2677f;
    --mint:#5fd6bd; --yel:#fbeea8; --red:#ef5a5a; --grn:#3fbf8f;
    --r:30px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--tx);
    font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN',system-ui,sans-serif;}
  body{min-height:100vh; display:flex; justify-content:center;}
  body::after{content:""; position:fixed; inset:0; pointer-events:none; z-index:99;
    box-shadow:inset 0 0 0 3px #ee8ce4, inset 0 0 38px rgba(238,140,228,.45);}
  button{font-family:inherit; color:inherit; cursor:pointer; border:none; background:none; padding:0;}
  #app{width:100%; max-width:480px; min-height:100vh; padding:calc(18px + env(safe-area-inset-top)) 16px 130px; position:relative;}

  /* header */
  .hd{display:flex; justify-content:space-between; align-items:center; padding:10px 14px 0;}
  .logo{font-family:'Anton',Impact,sans-serif; font-size:44px; color:var(--mint); letter-spacing:.5px; line-height:1;
    transform:scaleY(1.12); transform-origin:left center;}
  .me-btn{width:62px; height:62px; border-radius:50%; background:#fff; display:grid; place-items:center;
    box-shadow:0 6px 20px rgba(0,0,0,.08);}
  .av{border-radius:50%; display:grid; place-items:center; overflow:hidden; flex-shrink:0;}
  .me-btn .av{width:42px; height:42px; font-size:22px;}
  .hint{display:flex; align-items:center; gap:10px; margin:16px 14px 18px; color:var(--dim); font-weight:700; font-size:16px;}
  .hint .ic{width:26px; height:26px; border-radius:50%; background:var(--pink); display:grid; place-items:center;}

  /* cards */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:22px 24px; margin-bottom:12px;}
  .hero{display:flex; align-items:center; gap:10px; margin-bottom:30px;}
  .hero h2{margin:0 0 6px; font-size:22px; font-weight:900;}
  .hero p{margin:0; color:var(--dim); font-size:14px; line-height:1.5; font-weight:700;}
  .hero .mascot{flex-shrink:0; width:96px;}
  .row{display:flex; align-items:center; gap:14px; padding:14px 16px 14px 14px; width:100%; text-align:left;}
  .thumb{width:74px; height:74px; border-radius:18px; flex-shrink:0; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.08);
    display:grid; place-items:center; font-size:34px; position:relative; overflow:hidden; background-size:cover; background-position:center;}
  .thumb .mini{position:absolute; right:4px; bottom:4px; width:24px; height:24px; font-size:14px; border:2px solid #fff;}
  .row .mid{flex:1; min-width:0;}
  .row .name{font-size:19px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row .st{font-size:14px; font-weight:900; margin-top:4px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row .st.new{color:var(--pink);}
  .row .st small{color:var(--dim2); font-weight:700; margin-left:10px; font-size:13px;}
  .dots{display:grid; grid-template-columns:repeat(5,9px); gap:4px; flex-shrink:0;}
  .dots i{width:9px; height:9px; border-radius:50%; background:#dcdcdc; display:block;}
  .dots i.on{background:var(--pink2);}
  .dots i.today{background:var(--pink);}
  .smile{width:46px; height:46px; border-radius:50%; background:var(--pink2); border:1.5px solid var(--rose);
    display:grid; place-items:center; flex-shrink:0; transition:transform .15s;}
  .smile.done{background:var(--pink);}
  .smile.done svg path,.smile.done svg circle{stroke:#fff; fill:#fff;}
  .smile:active{transform:scale(.88);}
  .pop{animation:pop .45s ease;}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3) rotate(-10deg)}100%{transform:scale(1)}}
  .chev{flex-shrink:0; opacity:.85;}
  .sec-t{font-size:15px; color:var(--dim); font-weight:900; margin:26px 8px 10px; display:flex; justify-content:space-between; align-items:center;}

  /* bottom nav */
  .nav{position:fixed; left:0; right:0; bottom:0; padding:0 16px calc(22px + env(safe-area-inset-bottom)); display:flex; justify-content:center; z-index:20; pointer-events:none;}
  .nav-in{width:100%; max-width:448px; display:flex; justify-content:space-between; align-items:center; pointer-events:auto;}
  .circ{width:70px; height:70px; border-radius:50%; background:#fff; display:grid; place-items:center; box-shadow:0 8px 24px rgba(0,0,0,.08); position:relative;}
  .circ .badge{position:absolute; top:12px; right:14px; width:12px; height:12px; border-radius:50%; background:var(--pink); border:2px solid #fff;}
  .pill{background:#fff; border-radius:40px; padding:8px; display:flex; gap:4px; box-shadow:0 8px 24px rgba(0,0,0,.08);}
  .pill button{padding:14px 26px; border-radius:30px; font-size:18px; font-weight:900; color:#555;}
  .pill button.on{background:var(--card2); color:var(--tx);}

  /* timetable */
  .tt{display:grid; grid-template-columns:28px repeat(5,1fr); gap:5px;}
  .tt .h{font-size:13px; font-weight:900; color:var(--dim); text-align:center; padding:4px 0;}
  .tt .h.today{color:var(--pink);}
  .tt .p{font-size:12px; font-weight:900; color:var(--dim2); display:grid; place-items:center;}
  .cell{min-height:66px; border-radius:14px; background:#fff; border:1.5px dashed #e3e3e3; padding:6px 5px; font-size:11px; font-weight:900;
    line-height:1.25; display:flex; flex-direction:column; justify-content:space-between; position:relative; text-align:left; overflow:hidden; word-break:break-all;}
  .cell.has{border:none; color:#222;}
  .cell .rm{font-size:9.5px; font-weight:700; opacity:.6;}
  .cell .mk{position:absolute; top:4px; right:4px; width:9px; height:9px; border-radius:50%; background:var(--pink); border:1.5px solid #fff;}
  .cell .gt{position:absolute; bottom:4px; right:5px; font-size:10px;}
  .cell.now{outline:2.5px solid var(--pink); outline-offset:1px;}
  .cell.empty-add{color:#d0d0d0; font-size:18px; align-items:center; justify-content:center;}

  /* stats */
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px;}
  .stat{background:#fff; border-radius:22px; padding:14px 8px; text-align:center;}
  .stat b{display:block; font-size:24px; font-weight:900;}
  .stat b small{font-size:13px; color:var(--dim);}
  .stat span{font-size:11.5px; color:var(--dim); font-weight:900;}
  .bar{height:10px; border-radius:6px; background:#e2e2e2; overflow:hidden; margin-top:10px;}
  .bar i{display:block; height:100%; background:linear-gradient(90deg,var(--mint),var(--pink)); border-radius:6px;}

  /* log posts */
  .post{background:#fff; border-radius:26px; overflow:hidden; margin-bottom:12px;}
  .post .ph{aspect-ratio:4/3; background-size:cover; background-position:center; display:grid; place-items:center; font-size:60px; position:relative;}
  .post .ph .loc{position:absolute; left:12px; bottom:12px; background:rgba(0,0,0,.45); color:#fff; font-size:12px; font-weight:900; padding:5px 10px; border-radius:20px;}
  .post .bd{padding:12px 16px 14px; display:flex; gap:12px; align-items:center;}
  .post .bd .t{flex:1; min-width:0;}
  .post .bd .t b{font-size:15px; font-weight:900; display:block;}
  .post .bd .t span{font-size:12px; color:var(--dim); font-weight:700;}
  .post .cm{padding:0 16px 14px; font-size:14px; font-weight:700;}
  .chip{display:inline-block; font-size:11px; font-weight:900; padding:3px 9px; border-radius:20px; background:var(--pink3); color:var(--pink); margin-left:6px; vertical-align:2px;}
  .chip.g{background:#dff6ee; color:var(--grn);}
  .chip.r{background:#fde4e4; color:var(--red);}
  .chip.gr{background:#eee; color:var(--dim);}

  /* credit list */
  .cr{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid #e0e0e0;}
  .cr:last-child{border-bottom:none;}
  .cr .sw{width:12px; height:36px; border-radius:6px; flex-shrink:0;}
  .cr .t{flex:1; min-width:0;}
  .cr .t b{font-size:15px; font-weight:900; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cr .t span{font-size:12px; color:var(--dim); font-weight:700;}

  /* screens / sheets */
  .screen{position:fixed; inset:0; background:var(--bg); z-index:30; overflow-y:auto; transform:translateX(100%); transition:transform .28s cubic-bezier(.2,.8,.2,1);}
  .screen.open{transform:none;}
  .screen .in{max-width:480px; margin:0 auto; padding:calc(18px + env(safe-area-inset-top)) 16px 60px;}
  .back{display:flex; align-items:center; gap:10px; padding:8px 4px 14px;}
  .back button{width:48px; height:48px; border-radius:50%; background:#fff; display:grid; place-items:center; box-shadow:0 4px 14px rgba(0,0,0,.06);}
  .back h3{margin:0; font-size:20px; font-weight:900; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .shade{position:fixed; inset:0; background:rgba(20,20,20,.35); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s;}
  .shade.open{opacity:1; pointer-events:auto;}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:41; transform:translateY(105%); transition:transform .28s cubic-bezier(.2,.8,.2,1); display:flex; justify-content:center;}
  .sheet.open{transform:none;}
  .sheet .in{width:100%; max-width:480px; background:var(--bg); border-radius:32px 32px 0 0; padding:12px 20px calc(24px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;}
  .grab{width:44px; height:5px; border-radius:3px; background:#d4d4d4; margin:0 auto 14px;}
  .sheet h3{margin:0 0 14px; font-size:20px; font-weight:900;}
  label.f{display:block; font-size:13px; font-weight:900; color:var(--dim); margin:12px 4px 6px;}
  input.tx,textarea.tx,select.tx{width:100%; padding:14px 16px; border-radius:18px; border:1.5px solid var(--line); background:#fff; font-size:16px; font-family:inherit; font-weight:700; color:var(--tx); outline:none;}
  input.tx:focus,textarea.tx:focus,select.tx:focus{border-color:var(--pink2);}
  textarea.tx{resize:none; height:76px;}
  .seg{display:flex; background:#fff; border-radius:20px; padding:5px; gap:4px;}
  .seg button{flex:1; padding:11px 4px; border-radius:16px; font-size:14px; font-weight:900; color:var(--dim);}
  .seg button.on{background:var(--pink3); color:var(--pink);}
  .seg button.on.g{background:#dff6ee; color:var(--grn);}
  .seg button.on.r{background:#fde4e4; color:var(--red);}
  .colors{display:flex; gap:10px; flex-wrap:wrap;}
  .colors button{width:34px; height:34px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1.5px #ddd;}
  .colors button.on{box-shadow:0 0 0 2.5px var(--tx);}
  .btn{display:block; width:100%; padding:17px; border-radius:24px; background:var(--tx); color:#fff; font-size:17px; font-weight:900; margin-top:18px;}
  .btn.pk{background:var(--pink); }
  .btn.ghost{background:#fff; color:var(--tx);}
  .btn.danger{background:none; color:var(--red); font-size:14px; margin-top:8px; padding:10px;}
  .btn:disabled{opacity:.35;}
  .shot{aspect-ratio:4/3; border-radius:26px; background:#fff; border:2px dashed var(--pink2); display:grid; place-items:center; overflow:hidden; background-size:cover; background-position:center; text-align:center; color:var(--pink); font-weight:900;}
  .shot .big{font-size:44px; display:block; margin-bottom:6px;}
  .notif{display:flex; gap:12px; align-items:center; padding:12px 6px; border-bottom:1px solid #e4e4e4;}
  .notif .av{width:44px; height:44px; font-size:22px;}
  .notif p{margin:0; flex:1; font-size:14px; font-weight:700; line-height:1.45;}
  .notif p small{display:block; color:var(--dim2); font-size:12px;}
  .empty{text-align:center; color:var(--dim2); font-weight:900; padding:30px 10px; font-size:14px;}
  .toast{position:fixed; left:50%; top:calc(20px + env(safe-area-inset-top)); transform:translate(-50%,-140%); background:var(--tx); color:#fff; font-weight:900;
    padding:12px 20px; border-radius:30px; z-index:60; transition:transform .3s; font-size:14px; white-space:nowrap;}
  .toast.on{transform:translate(-50%,0);}
  .emoji-pick{display:flex; gap:8px; flex-wrap:wrap;}
  .emoji-pick button{width:46px; height:46px; border-radius:50%; background:#fff; font-size:24px; border:2px solid transparent;}
  .emoji-pick button.on{border-color:var(--pink);}
  .note{font-size:12px; color:var(--dim); font-weight:700; margin:10px 4px 0; line-height:1.5;}
</style>
</head>
<body>
<div id="app"></div>

<div class="screen" id="scr"><div class="in" id="scrIn"></div></div>
<div class="shade" id="shade"></div>
<div class="sheet" id="sheet"><div class="in"><div class="grab"></div><div id="sheetIn"></div></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="image/*" capture="environment" hidden>

<nav class="nav"><div class="nav-in">
  <button class="circ" id="bellBtn" aria-label="通知">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    <span class="badge" id="bellBadge" hidden></span>
  </button>
  <div class="pill">
    <button data-tab="tt">時間割</button>
    <button data-tab="log">ログ</button>
  </div>
  <button class="circ" id="plusBtn" aria-label="出席を記録">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3.2" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>
  </button>
</div></nav>

<script>
/* ============ 定数 ============ */
const DAYS = ['月','火','水','木','金'];
const PERIODS = [
  {n:1, s:'9:00',  e:'10:30'},
  {n:2, s:'10:40', e:'12:10'},
  {n:3, s:'13:00', e:'14:30'},
  {n:4, s:'14:40', e:'16:10'},
  {n:5, s:'16:20', e:'17:50'},
  {n:6, s:'18:00', e:'19:30'},
];
const COLORS = ['#fbd5ef','#cdeee4','#fbeea8','#d6e4ff','#ffd9c7','#e5d8ff','#d9f2c9'];
const BGS = [
  'linear-gradient(135deg,#ffb88c,#de6262)','linear-gradient(135deg,#5fd6bd,#2a8f9c)','linear-gradient(135deg,#f6d365,#fda085)',
  'linear-gradient(135deg,#a18cd1,#fbc2eb)','linear-gradient(135deg,#89f7fe,#66a6ff)','linear-gradient(135deg,#232526,#414345)',
  'linear-gradient(135deg,#fccb90,#d57eeb)',
];
const ME_EMOJI = ['🐣','🐻','🐱','🦊','🐸','🐼','🍙','⭐️','🌙','🎧'];
const GRAD_CREDITS = 124;
const STATUS = {taking:{t:'履修中',c:''}, got:{t:'単位取得',c:'g'}, failed:{t:'落単',c:'r'}};

/* ============ 日付ユーティリティ(1日は午前4時から) ============ */
function logicalNow(){ return new Date(Date.now() - 4*3600e3); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return ymd(logicalNow()); }
function dayIdx(d=logicalNow()){ const w=d.getDay(); return (w>=1&&w<=5)? w-1 : -1; } // 月=0 … 金=4, 土日=-1
function weekDates(){ // 今週の月〜金の日付文字列
  const d=logicalNow(); const w=d.getDay(); const diff = w===0 ? -6 : 1-w;
  return DAYS.map((_,i)=>{ const x=new Date(d); x.setDate(d.getDate()+diff+i); return ymd(x); });
}
function toMin(hm){ const [h,m]=hm.split(':').map(Number); return h*60+m; }
function currentPeriod(){ // 授業中 or 次の授業のコマ番号
  const n=new Date(); const m=n.getHours()*60+n.getMinutes();
  for(const p of PERIODS){ if(m < toMin(p.e)) return p.n; }
  return null;
}
function ago(ts){
  const s=(Date.now()-ts)/1000;
  if(s<60) return 'たった今';
  if(s<3600) return Math.floor(s/60)+'分前';
  if(s<86400) return Math.floor(s/3600)+' 時間前';
  return Math.floor(s/86400)+'日前';
}
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============ 状態 ============ */
const KEY='komalog.v1';
let S = load();
function load(){
  try{ const j=JSON.parse(localStorage.getItem(KEY)); if(j && j.me) return j; }catch(e){}
  return {
    me:{name:'あなた', emoji:'🐣', bg:0},
    classes:[
      {id:uid(), day:0, period:1, name:'英語コミュニケーション', room:'2-301', credits:2, status:'taking', color:COLORS[3]},
      {id:uid(), day:0, period:3, name:'統計学入門', room:'5-102', credits:2, status:'taking', color:COLORS[1]},
      {id:uid(), day:1, period:2, name:'心理学概論', room:'大講義室A', credits:2, status:'taking', color:COLORS[0]},
      {id:uid(), day:2, period:2, name:'プログラミング基礎', room:'情報演習室', credits:2, status:'taking', color:COLORS[2]},
      {id:uid(), day:2, period:4, name:'経済学原論', room:'3-205', credits:2, status:'taking', color:COLORS[4]},
      {id:uid(), day:3, period:1, name:'第二外国語(韓国語)', room:'2-104', credits:1, status:'taking', color:COLORS[5]},
      {id:uid(), day:4, period:3, name:'基礎ゼミ', room:'研究棟 402', credits:2, status:'taking', color:COLORS[6]},
    ],
    logs:[], // {id, classId, date, ts, photo, comment}
    past:{got:28, failed:2}, // 過去の取得単位(前期まで)
    fmeta:{}, // friendId -> {seen, reacted}
    reactions:[], // 自分の投稿へのリアクション(デモ)
    notifSeen:0,
  };
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('保存容量がいっぱいです。古い写真を削除してね'); }
}

/* ============ デモの友だち ============ */
const FRIENDS = buildFriends();
function buildFriends(){
  const wd=weekDates(); const today=todayStr(); const td=dayIdx();
  const now=Date.now();
  const mk=(id,name,emoji,bg,classes,attend,credits)=>{
    const cls=classes.map((c,i)=>({id:id+'c'+i, day:c[0], period:c[1], name:c[2], room:c[3], credits:c[4]||2, status:c[5]||'taking', color:COLORS[i%COLORS.length]}));
    const logs=[];
    cls.forEach((c,i)=>{
      const date=wd[c.day];
      if(date>today) return;
      if(date===today){ const p=PERIODS[c.period-1]; const n=new Date(); if(n.getHours()*60+n.getMinutes() < toMin(p.s)) return; }
      if(!attend(i,c)) return;
      const hoursAgo = date===today ? 1+ (i%4) : (td<0?5:td-c.day)*24 + (i%5);
      logs.push({id:id+'l'+i, classId:c.id, date, ts:now-hoursAgo*3600e3, photo:null, comment:['ねむい…','前の席とれた','出席カードギリギリ','今日小テストだった','友だちと受けてる'][i%5], bg:BGS[(i+2)%BGS.length], emo:['📚','🏫','✏️','💻','🧑‍🏫','☕️'][i%6]});
    });
    return {id,name,emoji,bg,classes:cls,logs,past:credits};
  };
  return [
    mk('f1','そうごとゆかいな仲間たち','🌅',0,[
      [0,1,'英語コミュニケーション','2-301'],[0,2,'線形代数','4-201'],[1,2,'心理学概論','大講義室A'],[1,3,'物理学実験','実験棟',2],
      [2,1,'微分積分','4-101'],[2,2,'プログラミング基礎','情報演習室'],[3,2,'データ構造','4-303'],[3,4,'体育実技','体育館',1],
      [4,1,'化学概論','5-201'],[4,3,'基礎ゼミ','研究棟 402'],[4,4,'哲学','3-102',2,'got'],
    ], (i)=>i%4!==3, {got:34, failed:0}),
    mk('f2','ゆい','🍾',4,[

function weekDots(classes,logs){
  const wd=weekDates(); const today=todayStr();
  const list=[...classes].sort((a,b)=>a.day-b.day||a.period-b.period).slice(0,15);
  const att=new Set(logs.map(l=>l.classId+'@'+l.date));
  return `<div class="dots" style="grid-template-rows:repeat(${Math.min(3,Math.ceil(list.length/5))},9px); grid-auto-flow:column;">`+
    list.map(c=>{ const d=wd[c.day]; const on=att.has(c.id+'@'+d); return `<i class="${on?(d===today?'today':'on'):''}"></i>`; }).join('')+`</div>`;
}
function stats(classes,logs,past){
  const wd=weekDates(); const today=todayStr(); const n=new Date(); const nm=n.getHours()*60+n.getMinutes();
  const done=classes.filter(c=>{ const d=wd[c.day]; if(d<today) return true; if(d>today) return false; return nm>=toMin(PERIODS[c.period-1].s); });
  const att=new Set(logs.map(l=>l.classId+'@'+l.date));
  const attended=done.filter(c=>att.has(c.id+'@'+wd[c.day])).length;
  const got=(past?.got||0)+classes.filter(c=>c.status==='got').reduce((a,c)=>a+Number(c.credits||0),0);
  const failed=(past?.failed||0)+classes.filter(c=>c.status==='failed').reduce((a,c)=>a+Number(c.credits||0),0);
  const taking=classes.filter(c=>c.status==='taking').reduce((a,c)=>a+Number(c.credits||0),0);
  return {rate: done.length? Math.round(attended/done.length*100) : null, attended, done:done.length, got, failed, taking};
}
function statsHTML(st){
  return `<div class="stats">
    <div class="stat"><b>${st.rate==null?'—':st.rate}<small>${st.rate==null?'':'%'}</small></b><span>今週の出席率</span></div>
    <div class="stat"><b>${st.got}<small>/${GRAD_CREDITS}</small></b><span>取得単位</span></div>
    <div class="stat"><b>${st.taking}</b><span>履修中の単位</span></div>
  </div>
  <div class="card" style="padding:16px 20px">
    <div style="display:flex;justify-content:space-between;font-weight:900;font-size:13px;color:var(--dim)"><span>卒業まで</span><span>あと ${Math.max(0,GRAD_CREDITS-st.got)} 単位${st.failed?` ・ 落単 ${st.failed}`:''}</span></div>
    <div class="bar"><i style="width:${Math.min(100,st.got/GRAD_CREDITS*100)}%"></i></div>
  </div>`;
}
function timetableHTML(classes,logs,{editable=false}={}){
  const wd=weekDates(); const today=todayStr(); const td=dayIdx(); const cp=currentPeriod();
  const att=new Set(logs.map(l=>l.classId+'@'+l.date));
  const maxP=Math.max(5,...classes.map(c=>c.period));
  let h=`<div class="tt"><div></div>`+DAYS.map((d,i)=>`<div class="h ${i===td?'today':''}">${d}</div>`).join('');
  for(let p=1;p<=maxP;p++){
    h+=`<div class="p">${p}</div>`;
    for(let d=0;d<5;d++){
      const c=classes.find(x=>x.day===d&&x.period===p);
      if(c){
        const on=att.has(c.id+'@'+wd[d]);
        const now = d===td && p===cp;
        h+=`<button class="cell has ${now?'now':''}" style="background:${c.color}" data-cls="${c.id}">
          <span>${esc(c.name)}</span><span class="rm">${esc(c.room||'')}</span>
          ${on?'<span class="mk"></span>':''}${c.status==='got'?'<span class="gt">✅</span>':c.status==='failed'?'<span class="gt">💀</span>':''}</button>`;
      } else {
        h+= editable ? `<button class="cell empty-add" data-add="${d}-${p}">+</button>` : `<div class="cell" style="border-style:solid;border-color:#eee;background:transparent"></div>`;
      }
    }
  }
  return h+`</div>`;
}
function postHTML(l,cls,owner){
  const c=cls.find(x=>x.id===l.classId);
  const p=PERIODS[(c?.period||1)-1];
  const phStyle = l.photo ? `background-image:url(${l.photo})` : `background:${l.bg||BGS[1]}`;
  return `<div class="post">
    <div class="ph" style="${phStyle}">${l.photo?'':(l.emo||'🏫')}<span class="loc">📍 ${esc(c?.room||'教室')}</span></div>
    <div class="bd">${avatar(owner.emoji,owner.bg,40)}<div class="t"><b>${esc(c?.name||'授業')}<span class="chip">出席</span></b>
      <span>${esc(owner.name)} ・ ${c?DAYS[c.day]+'曜'+c.period+'限 '+p.s+'〜':''} ・ ${ago(l.ts)}</span></div></div>
    ${l.comment?`<div class="cm">${esc(l.comment)}</div>`:''}
  </div>`;
}

function logView(){
  const td=dayIdx(); const today=todayStr();
  const mine=S.classes.filter(c=>c.day===td);
  const doneToday=S.logs.filter(l=>l.date===today).length;
  const heroText = td<0 ? '今日は授業なし。ゆっくり休もう。<br>1日は午前4時から翌午前4時までです。'
    : `今日は${DAYS[td]}曜日・${mine.length}コマ。${doneToday?`${doneToday}コマ出席済み🎉`:'まだ出席してないよ'}<br>1日は午前4時から翌午前4時までです。`;
  let h=`<button class="card hero" id="heroBtn" style="width:100%;text-align:left"><div style="flex:1"><h2>${esc(S.me.name)}の時間割</h2><p>${heroText}</p></div>${STAR}</button>`;
  // 友だち一覧(新しい出席がある順)
  const rows=FRIENDS.map(f=>{
    const last=f.logs.reduce((a,l)=>Math.max(a,l.ts),0);
    const m=fmeta(f.id); const isNew = last>m.seen;
    return {f,last,isNew};
  }).sort((a,b)=>(b.isNew-a.isNew)||(b.last-a.last));
  h+=rows.map(({f,last,isNew})=>{
    const todays=f.logs.filter(l=>l.date===today);
    let st;
    if(isNew){
      const l=f.logs.find(x=>x.ts===last); const c=f.classes.find(x=>x.id===l.classId);
      st=`<div class="st new">${todays.length?`${c?c.period+'限':''}に出席`:'新しい出席'}</div>`;
    } else st=`<div class="st">閲覧済み${last?`<small>${ago(last)}</small>`:''}</div>`;
    const thumbPhoto = f.logs.length ? `background:${BGS[f.bg]}` : 'background:#fff';
    return `<div class="card row" data-friend="${f.id}" role="button">
      <div class="thumb" style="${thumbPhoto}">${f.emoji}</div>
      <div class="mid"><div class="name">${esc(f.name)}</div>${st}</div>
      ${weekDots(f.classes,f.logs)}
      <button class="smile ${fmeta(f.id).reacted?'done':''}" data-react="${f.id}" aria-label="リアクション">${SMILE}</button>
      ${CHEV}</div>`;
  }).join('');
  // 自分の最近の出席
  const myRecent=[...S.logs].sort((a,b)=>b.ts-a.ts).slice(0,3);
  if(myRecent.length){
    h+=`<div class="sec-t"><span>あなたの出席ログ</span></div>`+myRecent.map(l=>postHTML(l,S.classes,S.me)).join('');
  }
  return h;
}

function openCapture(classId){
  if(!S.classes.length){ toast('まず時間割に授業を追加してね'); tab='tt'; render(); return; }
  capPhoto=null;
  const td=dayIdx(); const cp=currentPeriod();
  const guess = classId || (S.classes.find(c=>c.day===td&&c.period===cp) || S.classes.find(c=>c.day===td&&c.period>=(cp||9)) || S.classes.find(c=>c.day===td) || S.classes[0]).id;
  const sorted=[...S.classes].sort((a,b)=>(a.day===td?-1:0)-(b.day===td?-1:0)||a.day-b.day||a.period-b.period);
  openSheet(`<h3>出席を記録</h3>
    <button class="shot" id="shot" style="width:100%"><div><span class="big">📸</span>タップして教室を撮影<div style="font-size:12px;color:var(--dim);margin-top:4px">黒板・スライド・教室の様子など</div></div></button>
    <label class="f">授業</label>
    <select class="tx" id="cCls">${sorted.map(c=>`<option value="${c.id}" ${c.id===guess?'selected':''}>${DAYS[c.day]}${c.period} ${esc(c.name)}${c.day===td?'(今日)':''}</option>`).join('')}</select>
    <label class="f">ひとこと</label>
    <textarea class="tx" id="cCm" maxlength="80" placeholder="前の席とれた / 今日小テストだった など"></textarea>
    <button class="btn pk" id="cPost">出席をシェア</button>
    <p class="note">写真なしでも出席できます。記録は時間割の友だちに共有されます。</p>`);
  document.getElementById('shot').onclick=()=>document.getElementById('fileIn').click();
  document.getElementById('cPost').onclick=()=>{
    const cid=document.getElementById('cCls').value; const c=S.classes.find(x=>x.id===cid);
    const date = c.day===td ? todayStr() : weekDates()[c.day];
    S.logs.push({id:uid(), classId:cid, date, ts:Date.now(), photo:capPhoto, comment:document.getElementById('cCm').value.trim(), bg:BGS[1], emo:'🏫'});
    save(); closeSheet(); tab='log'; render();
    toast(`✓ ${c.name} に出席しました`);
    window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
  };
}
document.getElementById('fileIn').onchange=e=>{
  const file=e.target.files[0]; e.target.value=''; if(!file) return;
  const img=new Image(); const url=URL.createObjectURL(file);
  img.onload=()=>{
    const max=720; const r=Math.min(1,max/Math.max(img.width,img.height));
    const cv=document.createElement('canvas'); cv.width=Math.round(img.width*r); cv.height=Math.round(img.height*r);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    capPhoto=cv.toDataURL('image/jpeg',.72); URL.revokeObjectURL(url);
    const s=document.getElementById('shot'); if(s){ s.style.backgroundImage=`url(${capPhoto})`; s.innerHTML=''; }
  };
  img.onerror=()=>toast('画像を読み込めませんでした');
  img.src=url;
};

/* ============ 通知 ============ */
function notifications(){
  const items=[];
  FRIENDS.forEach(f=>{
    f.logs.forEach(l=>{ const c=f.classes.find(x=>x.id===l.classId); items.push({ts:l.ts, f, text:`<b>${esc(f.name)}</b> が ${esc(c.name)}(${DAYS[c.day]}${c.period})に出席しました📸`}); });
    f.classes.filter(c=>c.status!=='taking').forEach((c,i)=>items.push({ts:Date.now()-(30+i*7)*3600e3, f, text:`<b>${esc(f.name)}</b> が ${esc(c.name)} の${c.status==='got'?'単位を取得しました🎉':'単位を落としました💀'}`}));
  });
  return items.sort((a,b)=>b.ts-a.ts).slice(0,30);
}
function updateBell(){ const n=notifications(); document.getElementById('bellBadge').hidden = !n.length || n[0].ts<=S.notifSeen; }
document.getElementById('bellBtn').onclick=()=>{
  const n=notifications(); S.notifSeen=Date.now(); save(); updateBell();
  openScreen(`<div class="back"><button data-close>${BACK}</button><h3>お知らせ</h3></div>
    ${n.length?n.map(x=>`<div class="notif" data-friend="${x.f.id}">${avatar(x.f.emoji,x.f.bg,44)}<p>${x.text}<small>${ago(x.ts)}</small></p></div>`).join(''):'<div class="empty">お知らせはありません</div>'}`);
  document.querySelectorAll('#scrIn [data-friend]').forEach(el=>el.onclick=()=>openFriend(el.dataset.friend));
};

/* ============ マイページ ============ */
function openMe(){
  const st=stats(S.classes,S.logs,S.past);
  openScreen(`<div class="back"><button data-close>${BACK}</button><h3>プロフィール</h3></div>
    <div style="text-align:center;margin:10px 0 18px"><div style="display:inline-block">${avatar(S.me.emoji,S.me.bg,96)}</div></div>
    <label class="f">名前</label><input class="tx" id="mName" value="${esc(S.me.name)}" maxlength="20">
    <label class="f">アイコン</label><div class="emoji-pick" id="mEmo">${ME_EMOJI.map(e=>`<button class="${e===S.me.emoji?'on':''}">${e}</button>`).join('')}</div>
    <label class="f">背景</label><div class="colors" id="mBg">${BGS.map((b,i)=>`<button data-i="${i}" class="${i===S.me.bg?'on':''}" style="background:${b}"></button>`).join('')}</div>
    <label class="f">前期までの単位</label>
    <div style="display:flex;gap:10px"><div style="flex:1"><input class="tx" id="mGot" type="number" min="0" value="${S.past.got}"><p class="note">取得</p></div>
      <div style="flex:1"><input class="tx" id="mFail" type="number" min="0" value="${S.past.failed}"><p class="note">落単</p></div></div>
    <div style="margin-top:14px">${statsHTML(st)}</div>
    <button class="btn" id="mSave">保存する</button>
    <button class="btn danger" id="mReset">データをリセット</button>
    <p class="note" style="text-align:center">これはプロトタイプです。友だちはデモデータで、あなたのデータはこの端末にだけ保存されます。</p>`);
  document.querySelectorAll('#mEmo button').forEach(b=>b.onclick=()=>{ S.me.emoji=b.textContent; document.querySelectorAll('#mEmo button').forEach(x=>x.classList.toggle('on',x===b)); });
  document.querySelectorAll('#mBg button').forEach(b=>b.onclick=()=>{ S.me.bg=+b.dataset.i; document.querySelectorAll('#mBg button').forEach(x=>x.classList.toggle('on',x===b)); });
  document.getElementById('mSave').onclick=()=>{
    S.me.name=document.getElementById('mName').value.trim()||'あなた';
    S.past.got=Math.max(0,+document.getElementById('mGot').value||0);
    S.past.failed=Math.max(0,+document.getElementById('mFail').value||0);
    save(); closeScreen(); toast('保存しました');
  };
  document.getElementById('mReset').onclick=()=>{
    if(!confirm('時間割・出席記録をすべて消して初期状態に戻しますか?')) return;
    localStorage.removeItem(KEY); S=load(); closeScreen();
  };
}

/* ============ その他 ============ */
let toastT;
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2200); }
document.querySelectorAll('.pill button').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; render(); window.scrollTo(0,0); });
document.getElementById('plusBtn').onclick=()=>openCapture();
render();
</script>
</body>
